name: Apply validation scheduling patch

on:
  push:
    branches:
      - perf/prioritize-workspace-before-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/prioritize-workspace-before-validation
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply validation scheduling patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          protocol = Path('apps/web/src/workers/mlg-worker-protocol.ts')
          text = protocol.read_text()
          text = text.replace(
              "export interface MlgWorkerImportRequest {\n  readonly type: 'import';\n  readonly file: File;\n  readonly sourceIdentity: LogSourceIdentity;\n}\n",
              "export interface MlgWorkerImportRequest {\n  readonly type: 'import';\n  readonly file: File;\n  readonly sourceIdentity: LogSourceIdentity;\n}\n\nexport interface MlgWorkerStartValidationRequest {\n  readonly type: 'start-validation';\n}\n\nexport type MlgWorkerRequest = MlgWorkerImportRequest | MlgWorkerStartValidationRequest;\n",
          )
          protocol.write_text(text)

          staged = Path('apps/web/src/adapters/mlg-staged-import.ts')
          text = staged.read_text()
          text = text.replace(
              "  cancel(): void;\n}",
              "  startValidation(): void;\n  cancel(): void;\n}",
          )
          text = text.replace(
              "  let validationSettled = false;\n",
              "  let validationSettled = false;\n  let validationStarted = false;\n",
          )
          text = text.replace(
              "  return {\n    indexed,\n    validated,\n    cancel: () => {",
              "  return {\n    indexed,\n    validated,\n    startValidation: () => {\n      if (validationStarted || validationSettled) return;\n      validationStarted = true;\n      worker.postMessage({ type: 'start-validation' });\n    },\n    cancel: () => {",
          )
          staged.write_text(text)

          worker = Path('apps/web/src/workers/mlg-import.worker.ts')
          text = worker.read_text()
          text = text.replace(
              "  MlgWorkerImportRequest,\n  MlgWorkerResponse,\n",
              "  MlgWorkerRequest,\n  MlgWorkerResponse,\n",
          )
          text = text.replace(
              "  onmessage: ((event: MessageEvent<MlgWorkerImportRequest>) => void) | null;",
              "  onmessage: ((event: MessageEvent<MlgWorkerRequest>) => void) | null;",
          )
          text = text.replace(
              "const now = (): number => globalThis.performance?.now() ?? Date.now();\n",
              "const now = (): number => globalThis.performance?.now() ?? Date.now();\nlet validationStartResolver: (() => void) | undefined;\nlet validationStartRequested = false;\n",
          )
          text = text.replace(
              "scope.onmessage = (event): void => {\n  if (event.data.type !== 'import') return;\n\n  void (async () => {",
              "scope.onmessage = (event): void => {\n  if (event.data.type === 'start-validation') {\n    validationStartRequested = true;\n    validationStartResolver?.();\n    return;\n  }\n  if (event.data.type !== 'import') return;\n\n  const importRequest = event.data;\n  validationStartRequested = false;\n  validationStartResolver = undefined;\n\n  void (async () => {",
          )
          text = text.replace("event.data.file", "importRequest.file")
          text = text.replace("event.data.sourceIdentity", "importRequest.sourceIdentity")
          text = text.replace(
              "      const validation = await validateMlgRecordCrc(\n",
              "      if (!validationStartRequested) {\n        await new Promise<void>((resolve) => {\n          validationStartResolver = resolve;\n          if (validationStartRequested) resolve();\n        });\n      }\n      validationStartResolver = undefined;\n\n      const validation = await validateMlgRecordCrc(\n",
          )
          worker.write_text(text)

          app = Path('apps/web/src/app/app-shell.ts')
          text = app.read_text()
          old = """        void loadPersistedWorkspace(indexed.summary.source).then(async (restored) => {\n          if (!restored) await loggerPage.restoreActiveWorkspace();\n          resetWorkspaceHistory();\n          scheduleWorkspaceSave();\n        });\n\n        loadedLog.textContent = indexed.summary.source.displayName;\n        setSourceLoadState(openButton, 'loading', `${indexed.summary.source.displayName} · CRC validating`);\n        appStatus.textContent = 'Ready · validating CRC…';\n        parserStatus.textContent = `MLG v${indexed.header.version} · ${indexed.recordIndex.offsets.length.toLocaleString()} records · CRC validating`;\n        openButton.disabled = false;\n\n        void staged.validated\n"""
          new = """        const workspaceRestore = loadPersistedWorkspace(indexed.summary.source).then(async (restored) => {\n          if (!restored) await loggerPage.restoreActiveWorkspace();\n          resetWorkspaceHistory();\n          scheduleWorkspaceSave();\n        });\n\n        loadedLog.textContent = indexed.summary.source.displayName;\n        setSourceLoadState(openButton, 'loading', `${indexed.summary.source.displayName} · restoring channels before CRC validation`);\n        appStatus.textContent = 'Ready · restoring channels…';\n        parserStatus.textContent = `MLG v${indexed.header.version} · ${indexed.recordIndex.offsets.length.toLocaleString()} records · CRC validation queued`;\n        openButton.disabled = false;\n\n        void workspaceRestore.finally(() => {\n          if (activeStagedImport !== staged) return;\n          staged.startValidation();\n          setSourceLoadState(openButton, 'loading', `${indexed.summary.source.displayName} · CRC validating`);\n          appStatus.textContent = 'Ready · validating CRC…';\n          parserStatus.textContent = `MLG v${indexed.header.version} · ${indexed.recordIndex.offsets.length.toLocaleString()} records · CRC validating`;\n        });\n\n        void staged.validated\n"""
          if old not in text:
              raise SystemExit('staged workspace/validation block not found')
          text = text.replace(old, new)
          text = text.replace(
              "message: 'Record CRC validation is running in the background.',",
              "message: 'Record CRC validation is queued until the initial workspace channel restore completes.',",
          )
          app.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/workers/mlg-worker-protocol.ts apps/web/src/adapters/mlg-staged-import.ts apps/web/src/workers/mlg-import.worker.ts apps/web/src/app/app-shell.ts
          git commit -m "Perf: prioritize workspace restore before CRC validation"
          git push origin HEAD:perf/prioritize-workspace-before-validation
