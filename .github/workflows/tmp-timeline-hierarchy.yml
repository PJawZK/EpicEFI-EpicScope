name: Temporary timeline hierarchy patch

on:
  push:
    branches:
      - ui/timeline-hierarchy-v1

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ui/timeline-hierarchy-v1
          fetch-depth: 0

      - name: Apply timeline hierarchy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          timeline_path = Path('apps/web/src/components/timeline-shell.ts')
          text = timeline_path.read_text()
          old = '''    <div class="timeline-controls">
      <div class="transport" aria-label="Playback controls">
        <button type="button" data-action="start" disabled title="Start">|◀</button>
        <button type="button" data-action="back" disabled title="Back">◀</button>
        <button type="button" data-action="play" disabled title="Play / pause">▶</button>
        <button type="button" data-action="forward" disabled title="Forward">▶</button>
        <button type="button" data-action="end" disabled title="End">▶|</button>
      </div>
      <span class="timeline-time">00:00.000 / 00:00.000</span>
      <div class="timeline-progress" role="slider" aria-label="Timeline cursor" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><span></span></div>
      <div class="timeline-marker-actions" aria-label="Marker navigation">
        <button type="button" data-marker-action="previous" disabled title="Previous marker">◀ M</button>
        <button type="button" data-marker-action="next" disabled title="Next marker">M ▶</button>
      </div>
      <div class="timeline-history-actions" aria-label="View history">
        <button type="button" data-view-history="back" disabled title="Previous view">↶ View</button>
        <button type="button" data-view-history="forward" disabled title="Next view">View ↷</button>
      </div>
      <div class="timeline-zoom-actions">
        <button type="button" data-viewport-action="fit" disabled>Fit</button>
        <button type="button" data-viewport-action="zoom-in" disabled title="Zoom in">＋</button>
        <button type="button" data-viewport-action="zoom-out" disabled title="Zoom out">−</button>
      </div>
    </div>
    <div class="timeline-meta">
      <span>Cursor <strong class="timeline-cursor-value">00:00.000</strong></span>
      <span>Visible range <strong class="timeline-visible-range">—</strong></span>
      <span>Marker <strong class="timeline-marker-value">—</strong></span>
      <span>A/B <strong class="timeline-ab-value">—</strong></span>
      <select class="timeline-saved-ranges" aria-label="Saved ranges" hidden>
        <option value="">Saved ranges</option>
      </select>
      <button type="button" class="timeline-rename-range" disabled title="Rename selected saved range">Rename Range</button>
      <button type="button" class="timeline-delete-range" disabled title="Delete selected saved range">Delete Range</button>
      <span class="grow"></span>
      <button type="button" class="timeline-save-range" disabled>Save Range</button>
      <button type="button" class="timeline-add-marker" disabled>＋ Marker</button>
      <button type="button" class="timeline-edit-marker" disabled>Edit Marker</button>
      <button type="button" class="timeline-delete-marker" disabled>Delete Marker</button>
      <button type="button" class="timeline-set-a" disabled>Set A</button>
      <button type="button" class="timeline-set-b" disabled>Set B</button>
      <button type="button" class="timeline-clear-ab" disabled>Clear A/B</button>
    </div>'''
          new = '''    <div class="timeline-controls" aria-label="Navigate">
      <span class="timeline-group-label">Navigate</span>
      <div class="transport" aria-label="Playback controls">
        <button type="button" data-action="start" disabled title="Start">|◀</button>
        <button type="button" data-action="back" disabled title="Back">◀</button>
        <button type="button" data-action="play" disabled title="Play / pause">▶</button>
        <button type="button" data-action="forward" disabled title="Forward">▶</button>
        <button type="button" data-action="end" disabled title="End">▶|</button>
      </div>
      <span class="timeline-time">00:00.000 / 00:00.000</span>
      <div class="timeline-progress" role="slider" aria-label="Timeline cursor" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><span></span></div>
      <div class="timeline-zoom-actions" aria-label="Zoom controls">
        <button type="button" data-viewport-action="fit" disabled>Fit</button>
        <button type="button" data-viewport-action="zoom-in" disabled title="Zoom in">＋</button>
        <button type="button" data-viewport-action="zoom-out" disabled title="Zoom out">−</button>
      </div>
      <div class="timeline-history-actions" aria-label="View history">
        <button type="button" data-view-history="back" disabled title="Previous view">↶ View</button>
        <button type="button" data-view-history="forward" disabled title="Next view">View ↷</button>
      </div>
      <span class="timeline-navigate-status">Cursor <strong class="timeline-cursor-value">00:00.000</strong></span>
      <span class="timeline-navigate-status">Visible <strong class="timeline-visible-range">—</strong></span>
    </div>
    <div class="timeline-meta" aria-label="Range and markers">
      <span class="timeline-group-label">Range / Markers</span>
      <span>Marker <strong class="timeline-marker-value">—</strong></span>
      <div class="timeline-marker-actions" aria-label="Marker navigation">
        <button type="button" data-marker-action="previous" disabled title="Previous marker">◀ M</button>
        <button type="button" data-marker-action="next" disabled title="Next marker">M ▶</button>
      </div>
      <span>A/B <strong class="timeline-ab-value">—</strong></span>
      <button type="button" class="timeline-set-a" disabled>Set A</button>
      <button type="button" class="timeline-set-b" disabled>Set B</button>
      <button type="button" class="timeline-save-range" disabled>Save Range</button>
      <select class="timeline-saved-ranges" aria-label="Saved ranges" hidden>
        <option value="">Saved ranges</option>
      </select>
      <button type="button" class="timeline-add-marker" disabled>＋ Marker</button>
      <span class="grow"></span>
      <span class="timeline-analysis-context">Analyze · set A and B</span>
      <details class="timeline-maintenance-menu">
        <summary title="More range and marker actions" aria-label="More range and marker actions">⋯</summary>
        <span class="timeline-maintenance-actions">
          <button type="button" class="timeline-rename-range" disabled title="Rename selected saved range">Rename Range</button>
          <button type="button" class="timeline-delete-range" disabled title="Delete selected saved range">Delete Range</button>
          <button type="button" class="timeline-edit-marker" disabled>Edit Marker</button>
          <button type="button" class="timeline-delete-marker" disabled>Delete Marker</button>
          <button type="button" class="timeline-clear-ab" disabled>Clear A/B</button>
        </span>
      </details>
    </div>'''
          if old not in text:
              raise SystemExit('timeline markup anchor not found')
          text = text.replace(old, new, 1)

          old_query = "  const abText = timeline.querySelector<HTMLElement>('.timeline-ab-value');\n"
          new_query = old_query + "  const analysisContext = timeline.querySelector<HTMLElement>('.timeline-analysis-context');\n"
          if old_query not in text:
              raise SystemExit('analysis context query anchor not found')
          text = text.replace(old_query, new_query, 1)

          old_guard = "|| !visibleRangeText || !markerText || !abText || !savedRangeSelect"
          new_guard = "|| !visibleRangeText || !markerText || !abText || !analysisContext || !savedRangeSelect"
          if old_guard not in text:
              raise SystemExit('structure guard anchor not found')
          text = text.replace(old_guard, new_guard, 1)

          old_render = "    clearAbButton.disabled = aTimeMs === undefined && bTimeMs === undefined;\n"
          new_render = old_render + "    const analysisReady = aTimeMs !== undefined && bTimeMs !== undefined && aTimeMs !== bTimeMs;\n    analysisContext.textContent = analysisReady ? 'Analyze · range ready' : 'Analyze · set A and B';\n    analysisContext.classList.toggle('timeline-analysis-context--ready', analysisReady);\n"
          if old_render not in text:
              raise SystemExit('range state anchor not found')
          text = text.replace(old_render, new_render, 1)
          timeline_path.write_text(text)

          css_path = Path('apps/web/src/styles/app.css')
          css = css_path.read_text()
          css = css.replace(
              '.timeline-controls { gap: 8px; padding: 0 9px; border-top: 1px solid var(--line-soft); }',
              '.timeline-controls { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0 9px; border-top: 1px solid var(--line-soft); }',
              1,
          )
          css = css.replace(
              '.timeline-meta { gap: 7px; min-width: 0; padding: 0 9px; overflow-x: auto; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 9px; }',
              '.timeline-meta { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0 9px; overflow-x: auto; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 9px; }',
              1,
          )
          anchor = ".timeline-saved-ranges {\n"
          addition = '''.timeline-group-label {
  flex: none;
  color: #7ea9c4;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .055em;
  text-transform: uppercase;
  white-space: nowrap;
}
.timeline-navigate-status {
  flex: none;
  color: var(--muted);
  font-size: 8px;
  white-space: nowrap;
}
.timeline-navigate-status strong { color: var(--text); }
.timeline-analysis-context {
  flex: none;
  padding: 4px 7px;
  border: 1px solid #263b4b;
  border-radius: 3px;
  color: #78909e;
  background: #0a151d;
  font-size: 8px;
  font-weight: 700;
  white-space: nowrap;
}
.timeline-analysis-context--ready {
  border-color: #2e6382;
  color: #b8d8ea;
  background: #0d2130;
}
.timeline-maintenance-menu {
  position: relative;
  flex: none;
}
.timeline-maintenance-menu summary {
  width: 29px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid #2f4b59;
  border-radius: 3px;
  background: #101d28;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  font-weight: 800;
  line-height: 1;
  list-style: none;
}
.timeline-maintenance-menu summary::-webkit-details-marker { display: none; }
.timeline-maintenance-menu[open] summary {
  border-color: #3479ae;
  background: #102437;
}
.timeline-maintenance-actions {
  display: none;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
}
.timeline-maintenance-menu[open],
.timeline-maintenance-menu[open] .timeline-maintenance-actions {
  display: inline-flex;
  align-items: center;
}
'''
          if anchor not in css:
              raise SystemExit('timeline css anchor not found')
          css = css.replace(anchor, addition + anchor, 1)
          css_path.write_text(css)
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow and commit implementation
        shell: bash
        run: |
          rm .github/workflows/tmp-timeline-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/timeline-shell.ts apps/web/src/styles/app.css .github/workflows/tmp-timeline-hierarchy.yml
          git commit -m "Refine timeline workflow hierarchy"
          git push origin HEAD:ui/timeline-hierarchy-v1
