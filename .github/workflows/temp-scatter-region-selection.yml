name: Temporary Scatter region validation

on:
  push:
    branches:
      - feat/scatter-box-region-selection

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scatter-box-region-selection
      - run: python .github/scripts/temp_scatter_region_selection.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/analysis/scatter.ts apps/web/src/pages/scatter-view.ts apps/web/src/styles/scatter-mlv.css apps/web/src/pages/histogram-help.ts tests/analysis/scatter.test.ts docs/HISTOGRAM.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'add Scatter box region evidence selection'
            git push
          fi
