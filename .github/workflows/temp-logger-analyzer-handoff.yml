name: Temporary Logger Analyzer handoff
on:
  push:
    branches:
      - feature/logger-analyzer-handoff
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/logger-analyzer-handoff
          fetch-depth: 0
      - name: Patch Logger Analyzer handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          timeline_path = Path('apps/web/src/components/timeline-shell.ts')
          timeline = timeline_path.read_text()
          old = "  onAnnotationChange(listener: (state: TimelineAnnotationState) => void): void;\n  onWorkspaceMutation(listener: () => void): void;\n"
          new = "  onAnnotationChange(listener: (state: TimelineAnnotationState) => void): void;\n  onAnalyzeRequest(listener: (state: TimelineAnnotationState) => void): void;\n  onWorkspaceMutation(listener: () => void): void;\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "  let annotationListener: ((state: TimelineAnnotationState) => void) | undefined;\n  let workspaceMutationListener: (() => void) | undefined;\n"
          new = "  let annotationListener: ((state: TimelineAnnotationState) => void) | undefined;\n  let analyzeRequestListener: ((state: TimelineAnnotationState) => void) | undefined;\n  let workspaceMutationListener: (() => void) | undefined;\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "      <span class=\"grow\"></span>\n      <span class=\"timeline-analysis-context\">Analyze · set A and B</span>\n      <details class=\"timeline-maintenance-menu\">\n"
          new = "      <span class=\"grow\"></span>\n      <span class=\"timeline-analysis-context\">Qualify · set A and B</span>\n      <button type=\"button\" class=\"timeline-open-analyzer\" hidden disabled>Analyze A/B</button>\n      <details class=\"timeline-maintenance-menu\">\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "  const analysisContext = timeline.querySelector<HTMLElement>('.timeline-analysis-context');\n  const savedRangeSelect = timeline.querySelector<HTMLSelectElement>('.timeline-saved-ranges');\n"
          new = "  const analysisContext = timeline.querySelector<HTMLElement>('.timeline-analysis-context');\n  const analyzeButton = timeline.querySelector<HTMLButtonElement>('.timeline-open-analyzer');\n  const savedRangeSelect = timeline.querySelector<HTMLSelectElement>('.timeline-saved-ranges');\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "  if (!overview || !overviewCanvas || !overviewText || !focusWindow || !focusStartHandle || !focusEndHandle || !overviewCursor || !timelineTime || !cursorText || !visibleRangeText || !markerText || !abText || !analysisContext || !savedRangeSelect || !saveRangeButton || !renameRangeButton || !deleteRangeButton || !addMarkerButton || !editMarkerButton || !deleteMarkerButton || !setAButton || !setBButton || !clearAbButton || !progress || !progressFill) {"
          new = "  if (!overview || !overviewCanvas || !overviewText || !focusWindow || !focusStartHandle || !focusEndHandle || !overviewCursor || !timelineTime || !cursorText || !visibleRangeText || !markerText || !abText || !analysisContext || !analyzeButton || !savedRangeSelect || !saveRangeButton || !renameRangeButton || !deleteRangeButton || !addMarkerButton || !editMarkerButton || !deleteMarkerButton || !setAButton || !setBButton || !clearAbButton || !progress || !progressFill) {"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "    const analysisReady = aTimeMs !== undefined && bTimeMs !== undefined && aTimeMs !== bTimeMs;\n    analysisContext.textContent = analysisReady ? 'Analyze · range ready' : 'Analyze · set A and B';\n    analysisContext.classList.toggle('timeline-analysis-context--ready', analysisReady);\n"
          new = "    const analysisReady = aTimeMs !== undefined && bTimeMs !== undefined && aTimeMs !== bTimeMs;\n    analysisContext.textContent = analysisReady ? 'Qualify · range ready' : 'Qualify · set A and B';\n    analysisContext.classList.toggle('timeline-analysis-context--ready', analysisReady);\n    analyzeButton.hidden = !analysisReady;\n    analyzeButton.disabled = !analysisReady;\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "  setAButton.addEventListener('click', () => setAnalysisBoundary('a'));\n  setBButton.addEventListener('click', () => setAnalysisBoundary('b'));\n\n"
          new = "  setAButton.addEventListener('click', () => setAnalysisBoundary('a'));\n  setBButton.addEventListener('click', () => setAnalysisBoundary('b'));\n  analyzeButton.addEventListener('click', () => {\n    if (aTimeMs === undefined || bTimeMs === undefined || aTimeMs === bTimeMs) return;\n    analyzeRequestListener?.({ aTimeMs, bTimeMs });\n  });\n\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)

          old = "    onViewportIntent: (listener) => { viewportListener = listener; },\n    onAnnotationChange: (listener) => { annotationListener = listener; },\n    onWorkspaceMutation: (listener) => { workspaceMutationListener = listener; },\n"
          new = "    onViewportIntent: (listener) => { viewportListener = listener; },\n    onAnnotationChange: (listener) => { annotationListener = listener; },\n    onAnalyzeRequest: (listener) => { analyzeRequestListener = listener; },\n    onWorkspaceMutation: (listener) => { workspaceMutationListener = listener; },\n"
          assert timeline.count(old) == 1
          timeline = timeline.replace(old, new, 1)
          timeline_path.write_text(timeline)

          logger_path = Path('apps/web/src/pages/logger-page.ts')
          logger = logger_path.read_text()
          old = "  onWorkspaceMutation(listener: () => void): void;\n  getWorkspaceState(): LoggerWorkspaceState;\n"
          new = "  onWorkspaceMutation(listener: () => void): void;\n  onAnalyzeRange(listener: () => void): void;\n  getWorkspaceState(): LoggerWorkspaceState;\n"
          assert logger.count(old) == 1
          logger = logger.replace(old, new, 1)

          old = "  timeline.onWorkspaceMutation(emitWorkspaceMutation);\n  inspector.onWorkspaceMutation(emitWorkspaceMutation);\n"
          new = "  timeline.onWorkspaceMutation(emitWorkspaceMutation);\n  inspector.onWorkspaceMutation(emitWorkspaceMutation);\n"
          assert logger.count(old) == 1

          return_anchor = "    onWorkspaceMutation: (listener) => { workspaceMutationListener = listener; },\n"
          assert logger.count(return_anchor) == 1
          logger = logger.replace(return_anchor, return_anchor + "    onAnalyzeRange: (listener) => { timeline.onAnalyzeRequest(() => listener()); },\n", 1)
          logger_path.write_text(logger)

          analyzer_path = Path('apps/web/src/pages/analyzer-page.ts')
          analyzer = analyzer_path.read_text()
          old = "  setTuneModel(model: TuneModel | undefined, sourceName?: string): void;\n  refresh(): void;\n"
          new = "  setTuneModel(model: TuneModel | undefined, sourceName?: string): void;\n  openRangeCompareScope(scopeValue: 'ab'): void;\n  refresh(): void;\n"
          assert analyzer.count(old) == 1
          analyzer = analyzer.replace(old, new, 1)

          old = "    setContext,\n    setTuneModel: (model, sourceName) => tuneTableView.setTuneModel(model, sourceName),\n    refresh: () => {\n"
          new = "    setContext,\n    setTuneModel: (model, sourceName) => tuneTableView.setTuneModel(model, sourceName),\n    openRangeCompareScope: (scopeValue) => {\n      setView('compare');\n      const leftHasScope = [...leftSelect.options].some((option) => option.value === scopeValue);\n      const rightHasScope = [...rightSelect.options].some((option) => option.value === scopeValue);\n      if (!leftHasScope && !rightHasScope) return;\n      if (leftSelect.value !== scopeValue && rightSelect.value !== scopeValue && rightHasScope) rightSelect.value = scopeValue;\n      void render();\n    },\n    refresh: () => {\n"
          assert analyzer.count(old) == 1
          analyzer = analyzer.replace(old, new, 1)
          analyzer_path.write_text(analyzer)

          shell_path = Path('apps/web/src/app/app-shell.ts')
          shell = shell_path.read_text()
          anchor = "  const closeLoadDataMenu = (): void => {\n"
          assert shell.count(anchor) == 1
          handoff = "  loggerPage.onAnalyzeRange(() => {\n    setEpicScopeMode('analyzer');\n    analyzerPage.openRangeCompareScope('ab');\n    appStatus.textContent = 'Analyzer · Current A/B';\n  });\n\n"
          shell = shell.replace(anchor, handoff + anchor, 1)
          shell_path.write_text(shell)

          css_path = Path('apps/web/src/styles/app.css')
          css = css_path.read_text()
          anchor = ".timeline-analysis-context--ready {\n  border-color: #2e6382;\n  color: #b8d8ea;\n  background: #0d2130;\n}\n"
          assert css.count(anchor) == 1
          addition = anchor + ".timeline-open-analyzer {\n  border-color: #3479ae;\n  color: #dceef8;\n  background: #12334a;\n  font-weight: 750;\n}\n.timeline-open-analyzer:hover { background: #17425f; }\n"
          css = css.replace(anchor, addition, 1)
          css_path.write_text(css)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/timeline-shell.ts apps/web/src/pages/logger-page.ts apps/web/src/pages/analyzer-page.ts apps/web/src/app/app-shell.ts apps/web/src/styles/app.css
          git commit -m "Add contextual Logger to Analyzer handoff"
          git push origin HEAD:feature/logger-analyzer-handoff
