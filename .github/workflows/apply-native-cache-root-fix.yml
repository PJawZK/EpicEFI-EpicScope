name: Apply native cache root fix

on:
  push:
    branches:
      - fix/native-column-cache-persistence-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply native cache root fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-column-cache-persistence-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply-native-cache-root-fix.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/adapters/mlg-column-sidecar-storage.ts
          git commit -m "Apply native cache root fix"
          git push
