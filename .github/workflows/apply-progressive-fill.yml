name: Apply progressive channel fill
on:
  push:
    branches: [perf/progressive-channel-fill]
    paths:
      - '.github/scripts/apply-progressive-fill.py'
      - '.github/workflows/apply-progressive-fill.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python .github/scripts/apply-progressive-fill.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated patch and remove temporary tooling
        run: |
          rm .github/scripts/apply-progressive-fill.py .github/workflows/apply-progressive-fill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Perf: progressively fill channel viewport'
          git push
