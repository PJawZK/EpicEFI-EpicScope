name: Timeline refresh patch

on:
  push:
    branches:
      - fix/timeline-overview-after-materialization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_timeline_overview.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          rm .github/workflows/apply-timeline-overview-refresh.yml
          rm scripts/patch_timeline_overview.py
          git config user.name PJawZK
          git config user.email anderswedin@hotmail.se
          git add apps/web/src/pages/logger-page.ts .github/workflows/apply-timeline-overview-refresh.yml scripts/patch_timeline_overview.py
          git commit -m 'Fix timeline overview after trace materialization'
          git push origin HEAD:fix/timeline-overview-after-materialization
