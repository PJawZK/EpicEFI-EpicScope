name: Apply timeline overview refresh

on:
  push:
    branches:
      - fix/timeline-overview-after-materialization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/timeline-overview-after-materialization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply timeline overview refresh patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          old = """    runtime.graph.onChannelPerformance((performance) => {
      const channel = channelDefinitions.get(performance.channelId);
      channelPerformanceListener?.({
        ...performance,
        channelName: channel?.sourceName ?? performance.channelId,
      });
    });"""
          new = """    runtime.graph.onChannelPerformance((performance) => {
      const channel = channelDefinitions.get(performance.channelId);
      channelPerformanceListener?.({
        ...performance,
        channelName: channel?.sourceName ?? performance.channelId,
      });
      if (runtime.id === activeWorkspace()?.activePaneId) {
        timeline.setOverviewContent(runtime.graph.getOverviewTraces(), logMarkers);
      }
    });"""
          if old not in s:
              raise SystemExit('channel performance anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-timeline-overview-refresh.yml
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add apps/web/src/pages/logger-page.ts .github/workflows/apply-timeline-overview-refresh.yml
          git commit -m "Fix: refresh timeline overview when active trace data changes"
          git push origin HEAD:fix/timeline-overview-after-materialization
