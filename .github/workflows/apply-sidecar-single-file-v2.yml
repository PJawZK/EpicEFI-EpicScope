name: Apply single-file MLG sidecar v2

on:
  push:
    branches:
      - perf/mlg-sidecar-single-file-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mlg-sidecar-single-file-v2
      - run: python tools/apply-sidecar-single-file-v2.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/workers/mlg-worker-protocol.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/adapters/mlg-column-sidecar-storage.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: use single-file positioned MLG sidecar"
          git push origin HEAD:perf/mlg-sidecar-single-file-v2
