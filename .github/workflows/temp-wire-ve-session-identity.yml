name: Temp wire VE session identity helper

on:
  push:
    branches:
      - fix/ve-session-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ve-session-authority
          fetch-depth: 0
      - name: Wire helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/analyzer-page.ts')
          text = path.read_text()
          old = "import type { LoggerAnalysisContext } from './logger-page';\n"
          new = "import type { LoggerAnalysisContext } from './logger-page';\nimport { sameAnalyzerChannelCatalog, sameVeAnalysisContext } from './ve-analyzer-session-identity';\n"
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          start = text.index("function sameChannelCatalog(")
          end = text.index("export function createAnalyzerPage()", start)
          text = text[:start] + text[end:]
          text = text.replace("!sameChannelCatalog(context.channels, nextContext.channels)", "!sameAnalyzerChannelCatalog(context.channels, nextContext.channels)", 1)
          path.write_text(text)

          Path('.github/workflows/temp-wire-ve-session-identity.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/analyzer-page.ts .github/workflows/temp-wire-ve-session-identity.yml
          git commit -m "refactor: centralize VE session identity"
          git push origin HEAD:fix/ve-session-authority
