name: SHIM-8 live follow patch

on:
  push:
    branches: [shim/live-follow-v1-work]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[shim8-reviewed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shim/live-follow-v1-work
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          old = "      syncViewport(nextViewport);\n      if (options.followLatest) setCursorWithoutFollow(summary.timeRange.endMs);\n    }\n\n    await Promise.all(paneRuntimes.map((runtime) => runtime.graph.refreshGrowingSource(summary.timeRange)));\n    syncActivePaneContext();"
          new = "      syncViewport(nextViewport);\n    }\n\n    // Update graph source bounds before moving graph cursors to the new live edge.\n    await Promise.all(paneRuntimes.map((runtime) => runtime.graph.refreshGrowingSource(summary.timeRange)));\n    if (options.followLatest && summary.timeRange) setCursorWithoutFollow(summary.timeRange.endMs);\n    syncActivePaneContext();"
          s = replace_once(s, old, new, 'cursor order')
          p.write_text(s)

          p = Path('apps/web/src/app/shim-live-ui.ts')
          s = p.read_text()
          s = s.replace("modeChip.textContent = captureOpened ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · RECORDING';", "modeChip.textContent = captureOpened ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'LIVE · SHIM · RECORDING';")
          s = s.replace("(captureOpened ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · RECORDING')", "(captureOpened ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'LIVE · SHIM · RECORDING')")
          s = s.replace("modeChip.textContent = session?.isRecording ? 'LIVE · SHIM · FOLLOW' : 'CAPTURE · SHIM';", "modeChip.textContent = session?.isRecording ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'CAPTURE · SHIM';")
          old_stop = "        } else if (event.state === 'stopped') {\n          recordButton.textContent = 'Record';\n          recordButton.dataset.recording = 'false';\n          appStatus.textContent = `Shim capture stopped · ${session?.capture?.sampleCount ?? 0} samples retained`;\n          setHeaderLive(`${session?.capture?.sampleCount.toLocaleString() ?? '0'} samples retained`);\n          updateSelectionCount();"
          new_stop = "        } else if (event.state === 'stopped') {\n          recordButton.textContent = 'Record';\n          recordButton.dataset.recording = 'false';\n          appStatus.textContent = `Shim capture stopped · ${session?.capture?.sampleCount ?? 0} samples retained`;\n          if (captureOpened) modeChip.textContent = 'CAPTURE · SHIM';\n          else setHeaderLive(`${session?.capture?.sampleCount.toLocaleString() ?? '0'} samples retained`);\n          updateSelectionCount();"
          s = replace_once(s, old_stop, new_stop, 'stopped mode')
          old_follow = "    followButton.textContent = followLatest ? 'Follow' : 'Follow Off';\n    appStatus.textContent = followLatest ? 'Live follow enabled' : 'Live follow paused · inspect history freely';"
          new_follow = "    followButton.textContent = followLatest ? 'Follow' : 'Follow Off';\n    modeChip.textContent = followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW';\n    appStatus.textContent = followLatest ? 'Live follow enabled' : 'Live follow paused · inspect history freely';"
          s = replace_once(s, old_follow, new_follow, 'follow mode')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/shim-live-ui.ts
          git commit -m "Refine live follow source behavior [shim8-reviewed]"
          git push origin HEAD:shim/live-follow-v1-work
