name: Apply restore phase instrumentation

on:
  push:
    branches:
      - perf/revert-multilevel-instrument-restore-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/revert-multilevel-instrument-restore-v1
          fetch-depth: 1
      - run: git fetch origin e2e6205c0d23d055ed073ca0447317e5ffd4be8c
      - run: |
          git checkout e2e6205c0d23d055ed073ca0447317e5ffd4be8c -- \
            apps/web/src/adapters/mlg-column-sidecar-v1.ts \
            apps/web/src/workers/mlg-import.worker.ts \
            apps/web/src/workers/mlg-worker-protocol.ts \
            core/log-model/log-types.ts \
            core/timeline/viewport-series.ts \
            tests/timeline/viewport-series.test.ts
      - run: python tools/apply-restore-phase-instrumentation-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/adapters/mlg-column-sidecar-v1.ts \
            apps/web/src/workers/mlg-import.worker.ts \
            apps/web/src/workers/mlg-worker-protocol.ts \
            core/log-model/log-types.ts \
            core/timeline/viewport-series.ts \
            tests/timeline/viewport-series.test.ts \
            apps/web/src/pages/logger-page.ts \
            apps/web/src/components/performance-diagnostics.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: restore 64-block envelopes and instrument restore phases"
          git push origin HEAD:perf/revert-multilevel-instrument-restore-v1
