name: Temporary transient popover patch
on:
  push:
    branches:
      - ui/transient-popover-behavior
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/transient-popover-behavior
          fetch-depth: 0
      - name: Patch transient surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shell_path = Path('apps/web/src/app/app-shell.ts')
          shell = shell_path.read_text()

          anchor = "  bugReportButton.title = 'Capture EpicScope runtime diagnostics';\n"
          assert anchor in shell
          shell = shell.replace(
              anchor,
              anchor
              + "  bugReportButton.setAttribute('aria-haspopup', 'dialog');\n"
              + "  bugReportButton.setAttribute('aria-expanded', 'false');\n",
              1,
          )

          shell = shell.replace(
              "  const bugReportDialog = document.createElement('dialog');\n  bugReportDialog.className = 'bug-report-dialog';\n  bugReportDialog.innerHTML = `\n    <form method=\"dialog\" class=\"bug-report-panel\">",
              "  const bugReportPopover = document.createElement('div');\n  bugReportPopover.className = 'bug-report-popover';\n  bugReportPopover.setAttribute('role', 'dialog');\n  bugReportPopover.setAttribute('aria-label', 'EpicScope report');\n  bugReportPopover.hidden = true;\n  bugReportPopover.innerHTML = `\n    <div class=\"bug-report-panel\">",
              1,
          )
          shell = shell.replace('bugReportDialog', 'bugReportPopover')
          shell = shell.replace(
              '<button type="submit" class="bug-report-close" aria-label="Close bug report">×</button>',
              '<button type="button" class="bug-report-close" aria-label="Close report">×</button>',
              1,
          )
          shell = shell.replace(
              '        <button type="submit">Close</button>\n      </footer>\n    </form>',
              '        <button type="button" class="bug-report-footer-close">Close</button>\n      </footer>\n    </div>',
              1,
          )
          old_append = '  bugReportSlot.append(bugReportButton);\n'
          assert old_append in shell
          new_append = '''  const bugReportWrap = document.createElement('div');
  bugReportWrap.className = 'bug-report-wrap';
  bugReportWrap.append(bugReportButton, bugReportPopover);
  bugReportSlot.append(bugReportWrap);

  const closeTransientSurface = (trigger: HTMLElement): void => {
    trigger.setAttribute('aria-expanded', 'false');
    const owner = trigger.parentElement;
    if (!owner) return;
    for (const surface of owner.querySelectorAll<HTMLElement>('[role="menu"], [role="dialog"]')) {
      surface.hidden = true;
    }
    if (trigger.classList.contains('brand-button')) trigger.classList.remove('brand-button--open');
  };

  document.addEventListener('pointerdown', (event) => {
    const target = event.target;
    if (!(target instanceof Node)) return;
    for (const trigger of app.querySelectorAll<HTMLElement>('[aria-haspopup][aria-expanded="true"]')) {
      const owner = trigger.parentElement;
      if (!owner || owner.contains(target)) continue;
      closeTransientSurface(trigger);
    }
  }, true);
'''
          shell = shell.replace(old_append, new_append, 1)

          old_open = '''  bugReportButton.addEventListener('click', () => {
    refreshBugReport();
    bugReportPopover.showModal();
  });
'''
          assert old_open in shell
          new_open = '''  const closeBugReport = (): void => {
    bugReportPopover.hidden = true;
    bugReportButton.setAttribute('aria-expanded', 'false');
  };

  bugReportButton.addEventListener('click', (event) => {
    event.stopPropagation();
    const nextOpen = bugReportPopover.hidden;
    if (nextOpen) refreshBugReport();
    bugReportPopover.hidden = !nextOpen;
    bugReportButton.setAttribute('aria-expanded', String(nextOpen));
  });
  bugReportPopover.addEventListener('click', (event) => event.stopPropagation());
  bugReportPopover.querySelector<HTMLButtonElement>('.bug-report-close')?.addEventListener('click', closeBugReport);
  bugReportPopover.querySelector<HTMLButtonElement>('.bug-report-footer-close')?.addEventListener('click', closeBugReport);
'''
          shell = shell.replace(old_open, new_open, 1)

          assert 'bugReportDialog' not in shell
          assert 'showModal()' not in shell
          shell_path.write_text(shell)

          css_path = Path('apps/web/src/styles/app.css')
          css = css_path.read_text()
          assert '.bug-report-dialog {' in css
          css = css.replace('.bug-report-dialog {', '.bug-report-popover {', 1)
          css = css.replace('.bug-report-dialog::backdrop {', '.bug-report-popover::backdrop {', 1)
          css = re.sub(r'\n\.bug-report-popover::backdrop \{.*?\n\}\n', '\n', css, count=1, flags=re.S)
          popover_anchor = '.bug-report-popover {\n'
          assert popover_anchor in css
          css = css.replace(
              popover_anchor,
              '.bug-report-wrap {\n  position: relative;\n  display: flex;\n  align-items: center;\n}\n\n'
              + popover_anchor
              + '  position: absolute;\n  left: 0;\n  bottom: calc(100% + 4px);\n  z-index: 300;\n',
              1,
          )
          css = css.replace(
              '  width: min(920px, calc(100vw - 32px));\n  max-width: none;\n',
              '  width: min(760px, 80vw);\n  max-width: calc(100vw - 24px);\n  max-height: min(620px, 76vh);\n  overflow: hidden;\n',
              1,
          )
          css_path.write_text(css)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/app-shell.ts apps/web/src/styles/app.css
          git commit -m "Unify transient popover behavior"
          git push origin HEAD:ui/transient-popover-behavior
