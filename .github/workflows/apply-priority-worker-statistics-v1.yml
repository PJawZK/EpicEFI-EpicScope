name: Apply priority worker statistics

on:
  push:
    branches:
      - perf/priority-worker-statistics-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/priority-worker-statistics-v1
      - run: python tools/apply-priority-worker-statistics-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/log-model/log-types.ts apps/web/src/workers/mlg-worker-protocol.ts apps/web/src/workers/mlg-import.worker.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/components/graph-viewport.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: reuse priority capture statistics"
          git push origin HEAD:perf/priority-worker-statistics-v1
