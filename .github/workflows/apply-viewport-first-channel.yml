name: Apply viewport-first channel activation

on:
  workflow_dispatch:
  push:
    branches:
      - perf/viewport-first-channel-activation
    paths:
      - .github/workflows/apply-viewport-first-channel.yml
      - .github/scripts/apply-viewport-first-channel.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/viewport-first-channel-activation
          fetch-depth: 0

      - name: Apply viewport-first patch
        run: python .github/scripts/apply-viewport-first-channel.py

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/log-model/log-types.ts core/parsers/mlg/mlg-channel-data.ts apps/web/src/components/graph-viewport.ts apps/web/src/components/performance-diagnostics.ts apps/web/src/app/app-shell.ts
          git commit -m "Perf: render newly selected channels from viewport first"
          git push origin HEAD:perf/viewport-first-channel-activation

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Remove temporary patch files
        if: success()
        run: |
          git rm .github/workflows/apply-viewport-first-channel.yml .github/scripts/apply-viewport-first-channel.py
          git commit -m "Chore: remove temporary viewport-first tooling"
          git push origin HEAD:perf/viewport-first-channel-activation
