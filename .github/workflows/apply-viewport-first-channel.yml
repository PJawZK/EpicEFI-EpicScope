name: Validate viewport-first channel activation

on:
  workflow_dispatch:
  push:
    branches:
      - perf/viewport-first-channel-activation
    paths:
      - .github/workflows/apply-viewport-first-channel.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/viewport-first-channel-activation
          fetch-depth: 0

      - run: npm ci

      - name: Type-check
        run: |
          if ! npm run typecheck > /tmp/typecheck.log 2>&1; then
            cat /tmp/typecheck.log
            cp /tmp/typecheck.log TYPECHECK_ERROR.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add TYPECHECK_ERROR.txt
            git commit -m "Diag: capture viewport-first typecheck failure"
            git push origin HEAD:perf/viewport-first-channel-activation
            exit 1
          fi

      - run: npm test
      - run: npm run build

      - name: Remove temporary tooling
        if: success()
        run: |
          git rm .github/workflows/apply-viewport-first-channel.yml .github/scripts/apply-viewport-first-channel.py
          git commit -m "Chore: remove temporary viewport-first tooling"
          git push origin HEAD:perf/viewport-first-channel-activation
