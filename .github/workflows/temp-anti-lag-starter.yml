name: Temporary Anti-Lag starter

on:
  push:
    branches:
      - feat/epicefi-anti-lag-starter

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epicefi-anti-lag-starter
          fetch-depth: 0
      - run: python .github/scripts/temp_anti_lag_starter.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Remove temporary workflow and transform
        run: rm .github/workflows/temp-anti-lag-starter.yml .github/scripts/temp_anti_lag_starter.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/built-in-workspace-templates.test.ts tests/web/epicefi-anti-lag-starter.test.ts docs/PREPOPULATED_WORKSPACES.md docs/SPECIALIZED_WORKSPACE_COVERAGE.md .github/workflows/temp-anti-lag-starter.yml .github/scripts/temp_anti_lag_starter.py
          git commit -m 'feat: add EpicEFI anti-lag starter'
          git push origin HEAD:feat/epicefi-anti-lag-starter
