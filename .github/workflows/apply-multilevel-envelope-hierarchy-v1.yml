name: Apply multilevel envelope hierarchy

on:
  push:
    branches:
      - perf/multilevel-envelope-hierarchy-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/multilevel-envelope-hierarchy-v1
      - run: python tools/apply-multilevel-envelope-hierarchy-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/log-model/log-types.ts core/timeline/viewport-series.ts apps/web/src/workers/mlg-worker-protocol.ts apps/web/src/workers/mlg-import.worker.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts tests/timeline/viewport-series.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: add exact multilevel envelope hierarchy"
          git push origin HEAD:perf/multilevel-envelope-hierarchy-v1
