name: Temporary injector ignition protection transform
on:
  push:
    branches:
      - feat/epicefi-injector-ignition-protection
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/scripts/temp_injector_protection_transform.py
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/built-in-workspace-templates.test.ts tests/web/epicefi-injector-ignition-protection-starters.test.ts
          git commit -m "feat: add injector timing and engine protection starters"
          git push
