name: Temporary resident batch retention patch

on:
  push:
    branches:
      - perf/reuse-resident-large-batches

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Retain delegated sidecar batch columns'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/reuse-resident-large-batches
          fetch-depth: 0
      - name: Patch large-batch retention
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/adapters/persistent-channel-cache.ts')
          text = path.read_text()
          old = "        if (channelIds.length <= MAX_PERSISTED_SELECTION_BATCH) {\n          this.persistFullColumn(channelId, range);\n        }\n"
          new = "        if (this.source.managesPersistentColumns || channelIds.length <= MAX_PERSISTED_SELECTION_BATCH) {\n          this.persistFullColumn(channelId, range);\n        }\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one delegated retain gate, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/adapters/persistent-channel-cache.ts
          git commit -m "Retain delegated sidecar batch columns"
          git push origin HEAD:perf/reuse-resident-large-batches
