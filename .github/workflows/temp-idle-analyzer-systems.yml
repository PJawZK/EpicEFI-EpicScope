name: Temp idle analyzer systems validation

on:
  push:
    branches:
      - analyzer/idle-systems-pass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analyzer/idle-systems-pass
      - name: Apply Idle Analyzer systems patch
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: python3 tools/patch-idle-analyzer-systems.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Idle Analyzer changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/specialized-analyzer-suite-view.ts apps/web/src/styles/specialized-analyzer.css docs/ANALYZER.md
          git commit -m 'Separate Idle Analyzer control systems'
          git push origin HEAD:analyzer/idle-systems-pass
