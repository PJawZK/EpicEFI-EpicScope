name: Temporary details popover patch
on:
  push:
    branches:
      - ui/close-details-popovers
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/close-details-popovers
          fetch-depth: 0
      - name: Close transient details popovers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/app-shell.ts')
          text = path.read_text()
          old = (
              "    for (const trigger of app.querySelectorAll<HTMLElement>('[aria-haspopup][aria-expanded=\"true\"]')) {\n"
              "      const owner = trigger.parentElement;\n"
              "      if (!owner || owner.contains(target)) continue;\n"
              "      closeTransientSurface(trigger);\n"
              "    }\n"
              "  }, true);\n"
          )
          new = (
              "    for (const trigger of app.querySelectorAll<HTMLElement>('[aria-haspopup][aria-expanded=\"true\"]')) {\n"
              "      const owner = trigger.parentElement;\n"
              "      if (!owner || owner.contains(target)) continue;\n"
              "      closeTransientSurface(trigger);\n"
              "    }\n"
              "    for (const details of app.querySelectorAll<HTMLDetailsElement>('details[open]')) {\n"
              "      if (details.contains(target)) continue;\n"
              "      const transient = details.classList.contains('timeline-maintenance-menu')\n"
              "        || details.querySelector(':scope > [class*=\"popover\"]') !== null;\n"
              "      if (transient) details.open = false;\n"
              "    }\n"
              "  }, true);\n"
          )
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/app-shell.ts
          git commit -m "Close transient details popovers on outside interaction"
          git push origin HEAD:ui/close-details-popovers
