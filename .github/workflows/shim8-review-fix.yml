name: SHIM-8 review fixes

on:
  push:
    branches: [shim/live-follow-v1-work]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[shim8-reviewed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shim/live-follow-v1-work
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          old = """      syncViewport(nextViewport);
      if (options.followLatest) setCursorWithoutFollow(summary.timeRange.endMs);
    }

    await Promise.all(paneRuntimes.map((runtime) => runtime.graph.refreshGrowingSource(summary.timeRange)));
    syncActivePaneContext();"""
          new = """      syncViewport(nextViewport);
    }

    // Update each graph's source bounds/ranges before moving its cursor to the
    // new live edge; GraphViewport clamps cursor time against its own timeRange.
    await Promise.all(paneRuntimes.map((runtime) => runtime.graph.refreshGrowingSource(summary.timeRange)));
    if (options.followLatest && summary.timeRange) setCursorWithoutFollow(summary.timeRange.endMs);
    syncActivePaneContext();"""
          s = replace_once(s, old, new, 'live cursor order')
          p.write_text(s)

          p = Path('apps/web/src/app/shim-live-ui.ts')
          s = p.read_text()
          s = s.replace(
              "modeChip.textContent = captureOpened ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · RECORDING';",
              "modeChip.textContent = captureOpened ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'LIVE · SHIM · RECORDING';",
          )
          s = s.replace(
              "(captureOpened ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · RECORDING')",
              "(captureOpened ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'LIVE · SHIM · RECORDING')",
          )
          s = s.replace(
              "modeChip.textContent = session?.isRecording ? 'LIVE · SHIM · FOLLOW' : 'CAPTURE · SHIM';",
              "modeChip.textContent = session?.isRecording ? (followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW') : 'CAPTURE · SHIM';",
          )
          old_stop = """        } else if (event.state === 'stopped') {
          recordButton.textContent = 'Record';
          recordButton.dataset.recording = 'false';
          appStatus.textContent = `Shim capture stopped · ${session?.capture?.sampleCount ?? 0} samples retained`;
          setHeaderLive(`${session?.capture?.sampleCount.toLocaleString() ?? '0'} samples retained`);
          updateSelectionCount();"""
          new_stop = """        } else if (event.state === 'stopped') {
          recordButton.textContent = 'Record';
          recordButton.dataset.recording = 'false';
          appStatus.textContent = `Shim capture stopped · ${session?.capture?.sampleCount ?? 0} samples retained`;
          if (captureOpened) modeChip.textContent = 'CAPTURE · SHIM';
          else setHeaderLive(`${session?.capture?.sampleCount.toLocaleString() ?? '0'} samples retained`);
          updateSelectionCount();"""
          s = replace_once(s, old_stop, new_stop, 'stopped mode')
          old_follow = """    followButton.textContent = followLatest ? 'Follow' : 'Follow Off';
    appStatus.textContent = followLatest ? 'Live follow enabled' : 'Live follow paused · inspect history freely';"""
          new_follow = """    followButton.textContent = followLatest ? 'Follow' : 'Follow Off';
    modeChip.textContent = followLatest ? 'LIVE · SHIM · FOLLOW' : 'LIVE · SHIM · VIEW';
    appStatus.textContent = followLatest ? 'Live follow enabled' : 'Live follow paused · inspect history freely';"""
          s = replace_once(s, old_follow, new_follow, 'follow label')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/shim-live-ui.ts
          git commit -m "Refine live follow source behavior [shim8-reviewed]"
          git push origin HEAD:shim/live-follow-v1-work
