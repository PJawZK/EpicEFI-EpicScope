name: Apply newly-visible pane trace fix

on:
  push:
    branches:
      - fix/load-newly-visible-pane-traces

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/load-newly-visible-pane-traces
      - name: Patch layout activation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()

          old = """    renderGraphLayout();
    syncActivePaneContext();
    emitWorkspaceMutation();
  });

  arrangeSelect.addEventListener('change', () => {"""
          new = """    renderGraphLayout();
    syncActivePaneContext();
    reconcileAssignedVisiblePaneChannels();
    emitWorkspaceMutation();
  });

  arrangeSelect.addEventListener('change', () => {"""
          if old not in s:
              raise SystemExit('layout change anchor missing')
          s = s.replace(old, new, 1)

          old = """    renderGraphLayout();
    syncActivePaneContext();
    emitWorkspaceMutation();
  });

  clearPaneButton.addEventListener('click', () => {"""
          new = """    renderGraphLayout();
    syncActivePaneContext();
    reconcileAssignedVisiblePaneChannels();
    emitWorkspaceMutation();
  });

  clearPaneButton.addEventListener('click', () => {"""
          if old not in s:
              raise SystemExit('arrange change anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts
          git commit -m 'Load traces when graph panes become visible'
          git push origin HEAD:fix/load-newly-visible-pane-traces
