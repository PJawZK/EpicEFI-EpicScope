name: Temporary diagnostics patch

on:
  push:
    branches:
      - diag/source-integrity-runtime-health

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run diagnostics patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/source-integrity-runtime-health
      - name: Apply focused diagnostics patch
        run: python3 tools/temp_diagnostics_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/app-shell.ts
          git commit -m "Diag: improve source integrity and runtime health"
          git push origin HEAD:diag/source-integrity-runtime-health
