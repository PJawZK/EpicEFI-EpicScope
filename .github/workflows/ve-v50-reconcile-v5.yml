name: VE v50 reconcile v5 input ownership

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage v50 v5 reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Make legacy Lambda input yield to shared interaction owner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-analyzer-view-v5.ts')
          text = path.read_text()

          anchor = """  let previewOriginal = new Map<CellKey, string>();\n  let committing = false;\n\n"""
          replacement = anchor + """  const sharedInteractionOwnsInput = (): boolean => delayHost.dataset.tableInteractionOwner === 'shared';\n\n"""
          if anchor not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(anchor, replacement, 1)

          refresh_anchor = """  const refreshSelection = (): void => {\n    const visible = new Set<CellKey>();\n"""
          refresh_replacement = """  const refreshSelection = (): void => {\n    if (sharedInteractionOwnsInput()) {\n      selected.clear();\n      anchor = undefined;\n      dragPointerId = undefined;\n      return;\n    }\n    const visible = new Set<CellKey>();\n"""
          if refresh_anchor not in text:
              raise SystemExit('refresh anchor not found')
          text = text.replace(refresh_anchor, refresh_replacement, 1)

          replacements = {
            "if (committing || inlineInput) return;": "if (sharedInteractionOwnsInput() || committing || inlineInput) return;",
            "if (committing || dragPointerId !== event.pointerId || !anchor || inlineInput) return;": "if (sharedInteractionOwnsInput() || committing || dragPointerId !== event.pointerId || !anchor || inlineInput) return;",
            "if (committing || dragPointerId !== event.pointerId) return;": "if (sharedInteractionOwnsInput() || committing || dragPointerId !== event.pointerId) return;",
            "if (committing) return;\n    const cell = closestDelayCell(event.target);": "if (sharedInteractionOwnsInput() || committing) return;\n    const cell = closestDelayCell(event.target);",
            "if (committing || inlineInput || selected.size === 0) return;": "if (sharedInteractionOwnsInput() || committing || inlineInput || selected.size === 0) return;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'event anchor not found: {old[:50]}')
              text = text.replace(old, new, 1)

          observer_old = """  const observer = new MutationObserver((mutations) => {\n    ownerEvidence.event('ve.observer.dispatch', { mutations: mutations.length }, { origin: 'observer' });\n    if (inlineInput && inlineRevision !== inner.sessionRevision) endInlineEdit(false);\n    if (!inlineInput && !committing) {\n      refreshSelection();\n      queueMicrotask(focusAnchor);\n    }\n  });\n"""
          observer_new = """  const observer = new MutationObserver((mutations) => {\n    if (sharedInteractionOwnsInput()) {\n      selected.clear();\n      anchor = undefined;\n      dragPointerId = undefined;\n      return;\n    }\n    ownerEvidence.event('ve.observer.dispatch', { mutations: mutations.length }, { origin: 'observer' });\n    if (inlineInput && inlineRevision !== inner.sessionRevision) endInlineEdit(false);\n    if (!inlineInput && !committing) {\n      refreshSelection();\n      queueMicrotask(focusAnchor);\n    }\n  });\n"""
          if observer_old not in text:
              raise SystemExit('observer anchor not found')
          text = text.replace(observer_old, observer_new, 1)

          path.write_text(text)
          PY
      - name: Commit reconciled v5 and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-reconcile-v5.yml
          git add apps/web/src/pages/ve-analyzer-view-v5.ts
          git commit -m "Yield legacy Lambda input to shared v50 owner [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
