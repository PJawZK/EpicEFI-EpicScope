name: Fix first-channel timing types

on:
  push:
    branches:
      - perf/first-channel-read-breakdown-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/first-channel-read-breakdown-v1
      - run: python tools/fix-first-channel-read-breakdown-types.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts apps/web/src/components/performance-diagnostics.ts
          git commit -m "Fix first-channel timing type contracts"
          git push origin HEAD:perf/first-channel-read-breakdown-v1
