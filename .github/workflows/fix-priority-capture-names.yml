name: Fix priority capture names

on:
  push:
    branches:
      - perf/priority-capture-during-index-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/priority-capture-during-index-v1
      - run: python tools/fix-priority-capture-names.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/parsers/mlg/mlg-channel-data.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix shared MLG decoder references"
          git push origin HEAD:perf/priority-capture-during-index-v1
