name: Temp remove predecode experiment
on:
  push:
    branches: [perf/remove-predecode-experiment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python tools/temp-remove-predecode.py
      - run: rm tools/temp-remove-predecode.py .github/workflows/temp-remove-predecode.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit rollback
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: remove opportunistic predecode experiment"
          git push
