name: Temporary Boost scope comparison
on:
  push:
    branches:
      - feature/boost-scope-comparison
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-scope-comparison
          fetch-depth: 0
      - name: Add matched scope comparison
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('core/analysis/boost-analyzer.ts')
          text = core.read_text()
          anchor = "export interface BoostPeakContext {\n"
          insert = """export interface BoostOperatingPointComparison {\n  readonly rpmStart: number;\n  readonly tpsStart: number;\n  readonly primarySampleCount: number;\n  readonly comparisonSampleCount: number;\n  readonly primaryPressureMean: number;\n  readonly comparisonPressureMean: number;\n  readonly pressureDelta: number;\n  readonly pressureDeltaFraction: number;\n  readonly pressureDirection: 'rising' | 'similar' | 'falling';\n  readonly upperDutyDelta: number | undefined;\n  readonly lowerDutyDelta: number | undefined;\n  readonly interpretation: 'pressure-only' | 'pressure-changed-similar-duty' | 'duty-changed-little-pressure-response' | 'duty-and-pressure-response' | 'similar-duty-and-pressure';\n}\n\n"""
          assert anchor in text
          text = text.replace(anchor, insert + anchor, 1)

          anchor = "\nfunction buildTrackingSamples(\n"
          insert = """\nexport function compareBoostOperatingPoints(\n  primary: readonly BoostOperatingPoint[],\n  comparison: readonly BoostOperatingPoint[],\n): BoostOperatingPointComparison[] {\n  const trustworthy = (point: BoostOperatingPoint): boolean => point.assessment !== 'mixed-transient-likely' && point.assessment !== 'limited-evidence';\n  const comparisonByKey = new Map(comparison.map((point) => [`${point.rpmStart}|${point.tpsStart}`, point]));\n  const results: BoostOperatingPointComparison[] = [];\n  for (const first of primary) {\n    const second = comparisonByKey.get(`${first.rpmStart}|${first.tpsStart}`);\n    if (!second || !trustworthy(first) || !trustworthy(second)) continue;\n    const pressureDelta = second.pressureMean - first.pressureMean;\n    const pressureScale = Math.max((Math.abs(first.pressureMean) + Math.abs(second.pressureMean)) / 2, Number.EPSILON);\n    const pressureDeltaFraction = pressureDelta / pressureScale;\n    const pressureDirection: BoostOperatingPointComparison['pressureDirection'] = pressureDeltaFraction > 0.02 ? 'rising' : pressureDeltaFraction < -0.02 ? 'falling' : 'similar';\n    const upperDutyDelta = first.upperDutyMean !== undefined && second.upperDutyMean !== undefined ? second.upperDutyMean - first.upperDutyMean : undefined;\n    const lowerDutyDelta = first.lowerDutyMean !== undefined && second.lowerDutyMean !== undefined ? second.lowerDutyMean - first.lowerDutyMean : undefined;\n    const dutyDeltas = [upperDutyDelta, lowerDutyDelta].filter((value): value is number => value !== undefined);\n    const dutyChanged = dutyDeltas.some((value) => Math.abs(value) >= 0.5);\n    const interpretation: BoostOperatingPointComparison['interpretation'] = dutyDeltas.length === 0\n      ? 'pressure-only'\n      : !dutyChanged && pressureDirection !== 'similar'\n        ? 'pressure-changed-similar-duty'\n        : dutyChanged && pressureDirection === 'similar'\n          ? 'duty-changed-little-pressure-response'\n          : dutyChanged\n            ? 'duty-and-pressure-response'\n            : 'similar-duty-and-pressure';\n    results.push({\n      rpmStart: first.rpmStart,\n      tpsStart: first.tpsStart,\n      primarySampleCount: first.sampleCount,\n      comparisonSampleCount: second.sampleCount,\n      primaryPressureMean: first.pressureMean,\n      comparisonPressureMean: second.pressureMean,\n      pressureDelta,\n      pressureDeltaFraction,\n      pressureDirection,\n      upperDutyDelta,\n      lowerDutyDelta,\n      interpretation,\n    });\n  }\n  return results;\n}\n"""
          assert anchor in text
          text = text.replace(anchor, insert + anchor, 1)
          core.write_text(text)

          tests = Path('tests/analysis/boost-analyzer.test.ts')
          text = tests.read_text()
          text = text.replace("import { analyzeBoost", "import { analyzeBoost, compareBoostOperatingPoints", 1)
          anchor = "  it('detects open-loop pressure-rise spool without a boost target', () => {\n"
          insert = """  it('compares matched trustworthy operating points across scopes without assuming wastegate polarity', () => {\n    const primary = analyzeBoost({\n      measuredPressure: range(0, [150, 151, 149, 150, 151, 149]),\n      rpm: range(0, [3000, 3010, 3020, 3030, 3040, 3050]),\n      tps: range(0, [90, 90, 90, 90, 90, 90]),\n      upperDuty: range(0, [40, 40, 40, 40, 40, 40]),\n    }, { operatingPoints: { rpmBinSize: 250, tpsBinSize: 5, minimumSamples: 2 } });\n    const comparison = analyzeBoost({\n      measuredPressure: range(0, [165, 166, 164, 165, 166, 164]),\n      rpm: range(0, [3000, 3010, 3020, 3030, 3040, 3050]),\n      tps: range(0, [90, 90, 90, 90, 90, 90]),\n      upperDuty: range(0, [45, 45, 45, 45, 45, 45]),\n    }, { operatingPoints: { rpmBinSize: 250, tpsBinSize: 5, minimumSamples: 2 } });\n\n    expect(compareBoostOperatingPoints(primary.operatingPoints, comparison.operatingPoints)).toEqual([expect.objectContaining({\n      rpmStart: 3000,\n      tpsStart: 90,\n      pressureDelta: 15,\n      pressureDirection: 'rising',\n      upperDutyDelta: 5,\n      interpretation: 'duty-and-pressure-response',\n    })]);\n  });\n\n"""
          assert anchor in text
          text = text.replace(anchor, insert + anchor, 1)
          tests.write_text(text)

          view = Path('apps/web/src/pages/boost-analyzer-view.ts')
          text = view.read_text()
          text = text.replace("import { analyzeBoost, type BoostAnalyzerResult } from '../../../../core/analysis/boost-analyzer';", "import { analyzeBoost, compareBoostOperatingPoints, type BoostAnalyzerResult } from '../../../../core/analysis/boost-analyzer';", 1)
          text = text.replace("<label><span>Scope</span><select class=\"boost-scope\"></select></label>", "<label><span>Scope</span><select class=\"boost-scope\"></select></label>\n      <label class=\"boost-open-loop-only\"><span>Compare scope</span><select class=\"boost-compare-scope\"></select></label>", 1)
          text = text.replace("<section class=\"boost-result-section boost-open-loop-only\">\n        <header><strong>Open-loop pressure-rise spool events</strong>", "<section class=\"boost-result-section boost-open-loop-only boost-comparison-section\" hidden>\n        <header><strong>Matched scope comparison</strong><span data-boost=\"comparison-count\">0</span></header>\n        <div class=\"boost-table-wrap\"><table class=\"boost-table boost-comparison-table\"><thead><tr><th>RPM bin</th><th>TPS/load bin</th><th>Primary N</th><th>Compare N</th><th>Primary P</th><th>Compare P</th><th>Δ pressure</th><th>Δ upper duty</th><th>Δ lower duty</th><th>Observed result</th></tr></thead><tbody></tbody></table></div>\n      </section>\n      <section class=\"boost-result-section boost-open-loop-only\">\n        <header><strong>Open-loop pressure-rise spool events</strong>", 1)
          text = text.replace("const scopeSelect = root.querySelector<HTMLSelectElement>('.boost-scope');", "const scopeSelect = root.querySelector<HTMLSelectElement>('.boost-scope');\n  const compareScopeSelect = root.querySelector<HTMLSelectElement>('.boost-compare-scope');", 1)
          text = text.replace("const operatingBody = root.querySelector<HTMLTableSectionElement>('.boost-operating-table tbody');", "const operatingBody = root.querySelector<HTMLTableSectionElement>('.boost-operating-table tbody');\n  const comparisonSection = root.querySelector<HTMLElement>('.boost-comparison-section');\n  const comparisonBody = root.querySelector<HTMLTableSectionElement>('.boost-comparison-table tbody');", 1)
          old = "if (!modeSelect || !measuredSelect || !targetSelect || !rpmSelect || !tpsSelect || !upperSelect || !lowerSelect || !scopeSelect || !qualificationSelect"
          new = "if (!modeSelect || !measuredSelect || !targetSelect || !rpmSelect || !tpsSelect || !upperSelect || !lowerSelect || !scopeSelect || !compareScopeSelect || !qualificationSelect"
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace("|| !content || !operatingBody || !openSpoolBody", "|| !content || !operatingBody || !comparisonSection || !comparisonBody || !openSpoolBody", 1)
          text = text.replace("const selectedScope = (): AnalyzerScope | undefined => selectedAnalyzerScope(scopeSelect, context);", "const selectedScope = (): AnalyzerScope | undefined => selectedAnalyzerScope(scopeSelect, context);\n  const selectedComparisonScope = (): AnalyzerScope | undefined => compareScopeSelect.value ? selectedAnalyzerScope(compareScopeSelect, context) : undefined;", 1)
          old = """  const fillScope = (preferred: string): void => {\n    populateAnalyzerScopeSelect(scopeSelect, context, preferred);\n  };"""
          new = """  const fillScope = (preferred: string, comparisonPreferred = ''): void => {\n    populateAnalyzerScopeSelect(scopeSelect, context, preferred);\n    populateAnalyzerScopeSelect(compareScopeSelect, context, comparisonPreferred);\n    compareScopeSelect.insertBefore(new Option('(none)', ''), compareScopeSelect.firstChild);\n    if (comparisonPreferred === '' || ![...compareScopeSelect.options].some((option) => option.value === comparisonPreferred)) compareScopeSelect.value = '';\n  };"""
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace("const scope = selectedScope();\n    const filterSet", "const scope = selectedScope();\n    const comparisonScope = !closedLoop ? selectedComparisonScope() : undefined;\n    const filterSet", 1)
          old = """    const bounds = analyzerScopeBounds(scope);\n    const startMs = bounds.startMs;\n    const endMs = bounds.endMs;"""
          new = """    const bounds = analyzerScopeBounds(scope);\n    const startMs = bounds.startMs;\n    const endMs = bounds.endMs;\n    const comparisonBounds = comparisonScope ? analyzerScopeBounds(comparisonScope) : {};"""
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace("const loaded = await context.loadTraces(requestedIds, startMs, endMs);", "const loaded = comparisonScope ? await context.loadTraces(requestedIds) : await context.loadTraces(requestedIds, startMs, endMs);", 1)

          anchor = """    field('steady-count').textContent = currentResult.steadyStateWindows.length.toLocaleString();\n\n    operatingBody.replaceChildren"""
          insert = """    field('steady-count').textContent = currentResult.steadyStateWindows.length.toLocaleString();\n\n    let comparisonRows = [] as ReturnType<typeof compareBoostOperatingPoints>;\n    if (!closedLoop && comparisonScope && operatingPoints && comparisonScope.label !== scope.label) {\n      const compareStartMs = comparisonBounds.startMs;\n      const compareEndMs = comparisonBounds.endMs;\n      const compareScoped = qualifyNumericSampleGroups({\n        referenceChannelId: measured.channel.id,\n        channels,\n        groupLogic: filterSet?.groupLogic ?? 'and',\n        groups,\n        ...(comparisonScope.kind === 'range' && compareStartMs !== undefined && compareEndMs !== undefined ? { timeRange: { startMs: compareStartMs, endMs: compareEndMs } } : {}),\n      });\n      let compareEligible = compareScoped.eligibleSampleIndices;\n      if (pullGateEnabled.checked && rpm && tps) {\n        const minimumTps = optionalNumber(pullMinTps);\n        const minimumRpm = optionalNumber(pullMinRpm);\n        if (minimumTps !== undefined && minimumRpm !== undefined) {\n          const compareQuick = qualifyNumericSampleGroups({\n            referenceChannelId: measured.channel.id,\n            channels,\n            groupLogic: 'and',\n            groups: [{ id: 'boost-high-load', logic: 'and', conditions: [\n              { channelId: tps.channel.id, operator: 'gte', value: minimumTps },\n              { channelId: rpm.channel.id, operator: 'gte', value: minimumRpm },\n            ] }],\n            ...(comparisonScope.kind === 'range' && compareStartMs !== undefined && compareEndMs !== undefined ? { timeRange: { startMs: compareStartMs, endMs: compareEndMs } } : {}),\n          });\n          compareEligible = intersectSampleIndices(compareEligible, compareQuick.eligibleSampleIndices);\n        }\n      }\n      const comparisonResult = analyzeBoost({\n        measuredPressure: measured.range,\n        ...(rpm ? { rpm: rpm.range } : {}),\n        ...(tps ? { tps: tps.range } : {}),\n        ...(upper ? { upperDuty: upper.range } : {}),\n        ...(lower ? { lowerDuty: lower.range } : {}),\n      }, { sampleIndices: compareEligible, operatingPoints });\n      comparisonRows = compareBoostOperatingPoints(currentResult.operatingPoints, comparisonResult.operatingPoints);\n    }\n    comparisonSection.hidden = comparisonRows.length === 0;\n    field('comparison-count').textContent = comparisonRows.length.toLocaleString();\n    comparisonBody.replaceChildren(...comparisonRows.map((comparison) => {\n      const row = document.createElement('tr');\n      const direction = comparison.pressureDirection === 'rising' ? '↑' : comparison.pressureDirection === 'falling' ? '↓' : '→';\n      const delta = (value: number | undefined): string => value === undefined ? '—' : `${value >= 0 ? '+' : ''}${formatNumber(value)}`;\n      const interpretation = comparison.interpretation === 'pressure-only' ? 'Pressure comparison; duty unavailable'\n        : comparison.interpretation === 'pressure-changed-similar-duty' ? 'Pressure changed at similar duty'\n          : comparison.interpretation === 'duty-changed-little-pressure-response' ? 'Duty changed with little pressure response'\n            : comparison.interpretation === 'duty-and-pressure-response' ? 'Observed duty + pressure response; repeat to confirm'\n              : 'Similar duty and pressure';\n      row.innerHTML = `<td>${formatNumber(comparison.rpmStart, 0)}</td><td>${formatNumber(comparison.tpsStart)}</td><td>${comparison.primarySampleCount.toLocaleString()}</td><td>${comparison.comparisonSampleCount.toLocaleString()}</td><td>${formatNumber(comparison.primaryPressureMean)}</td><td>${formatNumber(comparison.comparisonPressureMean)}</td><td>${direction} ${delta(comparison.pressureDelta)}</td><td>${delta(comparison.upperDutyDelta)}</td><td>${delta(comparison.lowerDutyDelta)}</td><td>${interpretation}</td>`;\n      return row;\n    }));\n\n    operatingBody.replaceChildren"""
          assert anchor in text
          text = text.replace(anchor, insert, 1)

          text = text.replace("const previousScope = scopeSelect.value;", "const previousScope = scopeSelect.value;\n    const previousCompareScope = compareScopeSelect.value;", 1)
          text = text.replace("fillScope(previousScope);", "fillScope(previousScope, previousCompareScope);", 1)
          text = text.replace("for (const select of [measuredSelect, targetSelect, rpmSelect, tpsSelect, upperSelect, lowerSelect, scopeSelect, qualificationSelect])", "for (const select of [measuredSelect, targetSelect, rpmSelect, tpsSelect, upperSelect, lowerSelect, scopeSelect, compareScopeSelect, qualificationSelect])", 1)
          view.write_text(text)

          help_file = Path('apps/web/src/pages/boost-analyzer-help.ts')
          text = help_file.read_text()
          anchor = "  [/^Qualification$/i,"
          idx = text.index(anchor)
          line_end = text.index('\n', idx)
          insert = "\n  [/^Compare scope$/i, { title: 'Compare scope · Open Loop', text: 'Optionally analyzes a second Full Log, Current A/B or Saved Range using the same channels, qualification, high-load gate and RPM×TPS/load bin geometry as the primary Scope. EpicScope only compares matching bins when both sides have usable evidence, then reports measured-pressure and upper/lower duty deltas. The result describes the observed response; it does not assume that more or less duty must increase boost.' }],"
          text = text[:line_end] + insert + text[line_end:]
          help_file.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/analysis/boost-analyzer.ts tests/analysis/boost-analyzer.test.ts apps/web/src/pages/boost-analyzer-view.ts apps/web/src/pages/boost-analyzer-help.ts
          git commit -m "Compare matched Boost scopes"
          git push origin HEAD:feature/boost-scope-comparison