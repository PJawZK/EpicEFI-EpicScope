name: Apply Codex audit correctness fixes

on:
  push:
    branches:
      - fix/codex-audit-correctness

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-audit-correctness
      - name: Apply correctness fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          # 1) Never interpolate external/saved labels into HTML.
          replace('apps/web/src/pages/histogram-math-channels-view.ts',
              """        button.innerHTML = `<strong>${field.name}</strong><small>${field.expression}</small>`;""",
              """        const name = document.createElement('strong');
        name.textContent = field.name;
        const expression = document.createElement('small');
        expression.textContent = field.expression;
        button.replaceChildren(name, expression);""")
          replace('apps/web/src/pages/histogram-math-channels-view.ts',
              """      button.innerHTML = `<strong>${label}</strong><small>${channel.unit ?? channel.sourceName}</small>`;""",
              """      const name = document.createElement('strong');
      name.textContent = label;
      const detail = document.createElement('small');
      detail.textContent = channel.unit ?? channel.sourceName;
      button.replaceChildren(name, detail);""")

          replace('apps/web/src/pages/histogram-table-generator-view.ts',
              """    tooltip.innerHTML = `
      <strong>${aggregationLabel(currentAggregation)} · ${zName}: ${formatCellValue(value, currentAggregation, 100)}</strong>
      <span>${traceLabel(xTrace)}: ${formatNumber(xBin.lowerBound)} to ${formatNumber(xBin.upperBound)}</span>
      <span>${traceLabel(yTrace)}: ${formatNumber(yBin.lowerBound)} to ${formatNumber(yBin.upperBound)}</span>
      <span>Hits: ${count.toLocaleString()}${result.aggregationMethod === 'count' ? '' : ` · valid Z: ${validValues.toLocaleString()}`}</span>
      ${currentAggregation === 'weighted-mean' ? `<span>Total hit weight: ${formatNumber(totalWeight, 3)} · weighted hits: ${(weightedHits ?? 0).toLocaleString()}</span>` : ''}
    `;""",
              """    const heading = document.createElement('strong');
    heading.textContent = `${aggregationLabel(currentAggregation)} · ${zName}: ${formatCellValue(value, currentAggregation, 100)}`;
    const xDetail = document.createElement('span');
    xDetail.textContent = `${traceLabel(xTrace)}: ${formatNumber(xBin.lowerBound)} to ${formatNumber(xBin.upperBound)}`;
    const yDetail = document.createElement('span');
    yDetail.textContent = `${traceLabel(yTrace)}: ${formatNumber(yBin.lowerBound)} to ${formatNumber(yBin.upperBound)}`;
    const hitDetail = document.createElement('span');
    hitDetail.textContent = `Hits: ${count.toLocaleString()}${result.aggregationMethod === 'count' ? '' : ` · valid Z: ${validValues.toLocaleString()}`}`;
    const tooltipChildren: Node[] = [heading, xDetail, yDetail, hitDetail];
    if (currentAggregation === 'weighted-mean') {
      const weightDetail = document.createElement('span');
      weightDetail.textContent = `Total hit weight: ${formatNumber(totalWeight, 3)} · weighted hits: ${(weightedHits ?? 0).toLocaleString()}`;
      tooltipChildren.push(weightDetail);
    }
    tooltip.replaceChildren(...tooltipChildren);""")

          # 2) Make assignment authoritative even while a channel is loading.
          replace('apps/web/src/components/graph-viewport.ts',
              """  toggleChannel(channelId: string): Promise<boolean>;
  hasActiveChannel(channelId: string): boolean;""",
              """  toggleChannel(channelId: string): Promise<boolean>;
  deactivateChannel(channelId: string): void;
  hasActiveChannel(channelId: string): boolean;""")
          replace('apps/web/src/components/graph-viewport.ts',
              """  const pendingTraces = new Map<string, PendingTrace>();
  const loadingTraceIds = new Set<string>();""",
              """  const pendingTraces = new Map<string, PendingTrace>();
  const loadingTraceIds = new Set<string>();
  const suppressedTraceIds = new Set<string>();""")
          replace('apps/web/src/components/graph-viewport.ts',
              """      for (const [channelId, pending] of batch) {
        const range = result.ranges.get(channelId);
        if (!range) continue;""",
              """      for (const [channelId, pending] of batch) {
        const range = result.ranges.get(channelId);
        if (suppressedTraceIds.has(channelId) || !range) continue;""")
          replace('apps/web/src/components/graph-viewport.ts',
              """      for (const [channelId, pending] of batch) {
        const range = result.ranges.get(channelId);
        if (!range) {
          pending.resolve(false);
          continue;
        }""",
              """      for (const [channelId, pending] of batch) {
        const range = result.ranges.get(channelId);
        if (suppressedTraceIds.has(channelId) || !range) {
          pending.resolve(false);
          continue;
        }""")
          replace('apps/web/src/components/graph-viewport.ts',
              """      const range = result.ranges.get(channelId);
      if (generation !== decodeGeneration || !range) return false;""",
              """      const range = result.ranges.get(channelId);
      if (generation !== decodeGeneration || suppressedTraceIds.has(channelId) || !range) return false;""")
          replace('apps/web/src/components/graph-viewport.ts',
              """  const toggleChannel = async (channelId: string): Promise<boolean> => {
    const queued = pendingTraces.get(channelId);""",
              """  const toggleChannel = async (channelId: string): Promise<boolean> => {
    const queued = pendingTraces.get(channelId);""")
          replace('apps/web/src/components/graph-viewport.ts',
              """    if (!channelData) return false;
    if (
      activeTraces.size""",
              """    if (!channelData) return false;
    suppressedTraceIds.delete(channelId);
    if (
      activeTraces.size""")
          replace('apps/web/src/components/graph-viewport.ts',
              """  const clearChannels = (options: { readonly render?: boolean } = {}): void => {""",
              """  const deactivateChannel = (channelId: string): void => {
    suppressedTraceIds.add(channelId);
    const queued = pendingTraces.get(channelId);
    if (queued) {
      pendingTraces.delete(channelId);
      queued.resolve(false);
      emitPendingChannels();
    }
    activeTraces.delete(channelId);
    envelopeCache.delete(channelId);
    const materializationTimer = materializationTimers.get(channelId);
    if (materializationTimer !== undefined) {
      window.clearTimeout(materializationTimer);
      materializationTimers.delete(channelId);
    }
    materializingTraceIds.delete(channelId);
    overlay.hidden = activeTraces.size > 0 || assignedChannels.length > 0;
    renderReadout();
    emitCursorValues();
    draw();
  };

  const clearChannels = (options: { readonly render?: boolean } = {}): void => {""")
          replace('apps/web/src/components/graph-viewport.ts',
              """    setLog,
    toggleChannel,
    hasActiveChannel:""",
              """    setLog,
    toggleChannel,
    deactivateChannel,
    hasActiveChannel:""")

          replace('apps/web/src/pages/logger-page.ts',
              """      syncPaneAssignedChannels(runtime, pane);
      if (runtime.activeChannelIds.has(channelId)) {
        void runtime.graph.toggleChannel(channelId).then(() => {
          runtime.activeChannelIds.delete(channelId);
          syncActivePaneContext();
        });
      } else {
        syncActivePaneContext();
      }
      emitWorkspaceMutation();""",
              """      syncPaneAssignedChannels(runtime, pane);
      runtime.graph.deactivateChannel(channelId);
      runtime.activeChannelIds.delete(channelId);
      syncActivePaneContext();
      emitWorkspaceMutation();""")
          replace('apps/web/src/pages/logger-page.ts',
              """    void runtime.graph.toggleChannel(channelId).then((active) => {
      if (active) runtime.activeChannelIds.add(channelId);
      syncActivePaneContext();
    });""",
              """    void runtime.graph.toggleChannel(channelId).then((active) => {
      const latestPane = activePaneState();
      if (active && latestPane?.id === pane.id && latestPane.channelIds.includes(channelId)) {
        runtime.activeChannelIds.add(channelId);
      } else if (!latestPane?.channelIds.includes(channelId)) {
        runtime.graph.deactivateChannel(channelId);
        runtime.activeChannelIds.delete(channelId);
      }
      syncActivePaneContext();
    });""")

          # 3/4) Storage now retains session state; surface persistence failure to users.
          replace('apps/web/src/pages/histogram-math-channels-view.ts',
              """      saveHistogramCalculatedFields(fields);
      editingId = field.id;""",
              """      const persisted = saveHistogramCalculatedFields(fields);
      editingId = field.id;""")
          replace('apps/web/src/pages/histogram-math-channels-view.ts',
              """      renderList();
      notifyChanged();
      void preview();""",
              """      renderList();
      notifyChanged();
      if (!persisted) {
        validation.className = 'math-channel-validation math-channel-validation--warning';
        validation.textContent = 'Available this session; could not save locally.';
      } else {
        void preview();
      }""", 1)

          replace('apps/web/src/pages/histogram-table-generator-view.ts',
              """      saveHistogramCalculatedFields(calculatedFields);
      populateFormulaManager();""",
              """      const persisted = saveHistogramCalculatedFields(calculatedFields);
      populateFormulaManager();""")
          replace('apps/web/src/pages/histogram-table-generator-view.ts',
              """      formulaStatus.textContent = `Saved ${field.name}.`;""",
              """      formulaStatus.textContent = persisted
        ? `Saved ${field.name}.`
        : `${field.name} is available this session; could not save locally.`;""")
          replace('apps/web/src/pages/histogram-table-generator-view.ts',
              """    saveHistogramTablePresets(tablePresets);
    populatePresets();
    presetSelect.value = preset.id;""",
              """    const persisted = saveHistogramTablePresets(tablePresets);
    populatePresets();
    presetSelect.value = preset.id;
    presetSaveButton.title = persisted
      ? 'Save the current Table Generator setup'
      : 'Available this session; could not save locally.';""")

          # 5) Clear Scatter state before every new selection load, and on load failure.
          replace('apps/web/src/pages/scatter-view.ts',
              """      const xId = pane.xSelect.value;
      const yId = pane.ySelect.value;
      if (!xId || !yId) return;
      const loaded = await context.loadTraces([xId, yId], bounds.startMs, bounds.endMs);""",
              """      const xId = pane.xSelect.value;
      const yId = pane.ySelect.value;
      pane.result = undefined;
      pane.xTrace = undefined;
      pane.yTrace = undefined;
      pane.renderedPointCount = 0;
      const canvasContext = pane.canvas.getContext('2d');
      canvasContext?.clearRect(0, 0, pane.canvas.width, pane.canvas.height);
      if (!xId || !yId) {
        pane.status.textContent = 'Select X and Y channels.';
        return;
      }
      let loaded: Awaited<ReturnType<HistogramPageContext['loadTraces']>>;
      try {
        loaded = await context.loadTraces([xId, yId], bounds.startMs, bounds.endMs);
      } catch (error) {
        if (generation !== renderGeneration) return;
        pane.status.textContent = error instanceof Error ? `Unable to load selected channels: ${error.message}` : 'Unable to load selected channels.';
        return;
      }""")

          PY
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts apps/web/src/pages/logger-page.ts apps/web/src/pages/histogram-math-channels-view.ts apps/web/src/pages/histogram-table-generator-view.ts apps/web/src/pages/scatter-view.ts
          git commit -m 'Fix Codex audit correctness issues'
          git push origin HEAD:fix/codex-audit-correctness
