name: Apply interaction-aware viewport coalescing

on:
  push:
    branches:
      - perf/coalesce-continuous-viewport-interaction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/coalesce-continuous-viewport-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply interaction coalescing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/graph-viewport.ts')
          s = p.read_text()

          replacements = [
            (
              "const PROGRESSIVE_FILL_BASE_STEP_SAMPLES = 16_384;",
              "const PROGRESSIVE_FILL_BASE_STEP_SAMPLES = 16_384;\nconst VIEWPORT_REFRESH_DEFAULT_DELAY_MS = 90;\nconst VIEWPORT_INTERACTION_BURST_WINDOW_MS = 180;\nconst VIEWPORT_INTERACTION_SETTLE_DELAY_MS = 160;",
              'constant anchor',
            ),
            (
              "  let viewportRefreshTimer: number | undefined;\n  let viewportRefreshGeneration = 0;",
              "  let viewportRefreshTimer: number | undefined;\n  let viewportRefreshGeneration = 0;\n  let lastViewportInteractionMs = Number.NEGATIVE_INFINITY;\n  let nextViewportRefreshDelayMs = VIEWPORT_REFRESH_DEFAULT_DELAY_MS;",
              'viewport state anchor',
            ),
            (
              "  const resizeObserver = new ResizeObserver(draw);\n  resizeObserver.observe(root);\n\n  canvas.addEventListener('wheel', (event) => {",
              "  const resizeObserver = new ResizeObserver(draw);\n  resizeObserver.observe(root);\n\n  const markViewportInteraction = (): void => {\n    const now = globalThis.performance?.now() ?? Date.now();\n    const repeated = now - lastViewportInteractionMs <= VIEWPORT_INTERACTION_BURST_WINDOW_MS;\n    lastViewportInteractionMs = now;\n    nextViewportRefreshDelayMs = repeated\n      ? VIEWPORT_INTERACTION_SETTLE_DELAY_MS\n      : VIEWPORT_REFRESH_DEFAULT_DELAY_MS;\n\n    // Stop progressive work from chasing a viewport the user has already left.\n    // An in-flight Blob read cannot be aborted, but its result is discarded.\n    viewportRefreshGeneration += 1;\n    if (viewportRefreshTimer !== undefined) {\n      window.clearTimeout(viewportRefreshTimer);\n      viewportRefreshTimer = undefined;\n    }\n  };\n\n  canvas.addEventListener('wheel', (event) => {",
              'wheel anchor',
            ),
            (
              "    const factor = event.deltaY < 0 ? 0.72 : 1.38;\n    zoomListener(factor, anchorMs);",
              "    const factor = event.deltaY < 0 ? 0.72 : 1.38;\n    markViewportInteraction();\n    zoomListener(factor, anchorMs);",
              'wheel callback anchor',
            ),
            (
              "      const span = viewport.visibleEndMs - viewport.visibleStartMs;\n      panListener?.(-(deltaX / rect.width) * span);",
              "      const span = viewport.visibleEndMs - viewport.visibleStartMs;\n      markViewportInteraction();\n      panListener?.(-(deltaX / rect.width) * span);",
              'pan callback anchor',
            ),
            (
              "  const scheduleViewportRefresh = (): void => {\n    viewportRefreshGeneration += 1;\n    const generation = viewportRefreshGeneration;\n    if (viewportRefreshTimer !== undefined) window.clearTimeout(viewportRefreshTimer);\n    viewportRefreshTimer = window.setTimeout(() => {\n      viewportRefreshTimer = undefined;\n      void refreshActiveViewportRanges(generation);\n    }, 90);\n  };",
              "  const scheduleViewportRefresh = (): void => {\n    viewportRefreshGeneration += 1;\n    const generation = viewportRefreshGeneration;\n    const delayMs = nextViewportRefreshDelayMs;\n    nextViewportRefreshDelayMs = VIEWPORT_REFRESH_DEFAULT_DELAY_MS;\n    if (viewportRefreshTimer !== undefined) window.clearTimeout(viewportRefreshTimer);\n    viewportRefreshTimer = window.setTimeout(() => {\n      viewportRefreshTimer = undefined;\n      void refreshActiveViewportRanges(generation);\n    }, delayMs);\n  };",
              'schedule anchor',
            ),
          ]

          for old, new, label in replacements:
              if old not in s:
                  raise SystemExit(f'{label} not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-interaction-coalescing.yml
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add apps/web/src/components/graph-viewport.ts .github/workflows/apply-interaction-coalescing.yml
          git commit -m "Perf: coalesce continuous viewport interaction"
          git push origin HEAD:perf/coalesce-continuous-viewport-interaction
