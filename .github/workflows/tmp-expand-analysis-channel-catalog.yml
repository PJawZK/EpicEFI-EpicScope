name: Temporary full analysis channel catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-expand-analysis-channel-catalog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analysis/full-channel-catalog-v1
          fetch-depth: 0
      - name: Apply channel-catalog expansion
        run: |
          git show origin/main:scripts/tmp-expand-analysis-channel-catalog.py > /tmp/patch.py
          python /tmp/patch.py
          git show origin/main:scripts/tmp-fix-full-analysis-catalog.py > /tmp/fix.py
          python /tmp/fix.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts apps/web/src/pages/histogram-page.ts apps/web/src/pages/heatmap-view.ts apps/web/src/pages/scatter-view.ts apps/web/src/pages/analyzer-page.ts apps/web/src/pages/tune-table-view.ts apps/web/src/pages/boost-analyzer-view.ts apps/web/src/pages/specialized-analyzer-suite-view.ts
          git commit -m "Expose full channel catalog to analysis tools"
          git push origin HEAD:analysis/full-channel-catalog-v1

# retry 2
