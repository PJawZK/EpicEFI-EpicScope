name: Temporary captured priority viewport slices

on:
  push:
    branches:
      - perf/captured-priority-viewport-slices

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use captured columns for viewport ranges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/captured-priority-viewport-slices
          fetch-depth: 0
      - name: Patch captured priority partial reads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/adapters/mlg-column-sidecar-v1.ts')
          text = path.read_text()
          old = """    if (startSampleIndex === 0 && sampleCount === this.sampleCount) {\n      const captured = channelIds.map((channelId) => this.capturedPriorityColumns.get(channelId));\n      if (captured.every((column) => column !== undefined)) {\n        const ranges = new Map<string, NumericChannelRange>();\n        for (let index = 0; index < channelIds.length; index += 1) {\n          const column = captured[index]!;\n          ranges.set(\n            channelIds[index]!,\n            buildRange(\n              this.recordIndex,\n              0,\n              this.sampleCount,\n              column.values,\n              column.statistics,\n              column.envelopeBlocks,\n            ),\n          );\n        }\n        return { ranges, performance: { channelCount: channelIds.length, cacheHitChannelIds: [...channelIds], physicalReadCount: 0, physicalBytesRead: 0, physicalReadMs: 0, sidecarReadPath: 'captured' } };\n      }\n    }\n"""
          new = """    const captured = channelIds.map((channelId) => this.capturedPriorityColumns.get(channelId));\n    if (captured.every((column) => column !== undefined)) {\n      const rangeStarted = now();\n      const ranges = new Map<string, NumericChannelRange>();\n      const isFullRange = startSampleIndex === 0 && sampleCount === this.sampleCount;\n      const endSampleIndex = startSampleIndex + sampleCount;\n      for (let index = 0; index < channelIds.length; index += 1) {\n        const column = captured[index]!;\n        ranges.set(\n          channelIds[index]!,\n          buildRange(\n            this.recordIndex,\n            startSampleIndex,\n            sampleCount,\n            isFullRange\n              ? column.values\n              : column.values.slice(startSampleIndex, endSampleIndex),\n            isFullRange ? column.statistics : undefined,\n            isFullRange ? column.envelopeBlocks : undefined,\n          ),\n        );\n      }\n      return {\n        ranges,\n        performance: {\n          channelCount: channelIds.length,\n          cacheHitChannelIds: [...channelIds],\n          physicalReadCount: 0,\n          physicalBytesRead: 0,\n          physicalReadMs: 0,\n          sidecarRangeBuildMs: now() - rangeStarted,\n          sidecarReadPath: 'captured',\n        },\n      };\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'captured priority anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts
          git commit -m "Use captured columns for viewport ranges"
          git push origin HEAD:perf/captured-priority-viewport-slices
