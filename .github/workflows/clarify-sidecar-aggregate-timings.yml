name: Clarify sidecar aggregate timings

on:
  push:
    branches:
      - perf/first-channel-read-breakdown-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/first-channel-read-breakdown-v1
      - run: python tools/clarify-sidecar-aggregate-timings.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/log-model/log-types.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/adapters/persistent-channel-cache.ts apps/web/src/components/graph-viewport.ts apps/web/src/components/performance-diagnostics.ts
          git commit -m "Clarify sidecar aggregate timing diagnostics"
          git push origin HEAD:perf/first-channel-read-breakdown-v1
