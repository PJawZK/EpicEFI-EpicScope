name: Temporary handoff wording
on:
  push:
    branches:
      - feature/logger-analyzer-handoff
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/logger-analyzer-handoff
          fetch-depth: 0
      - name: Update qualification wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/logger-page.ts')
          text = path.read_text()
          old = "    analysisTrigger.title = 'Analyze the selected A/B range';"
          new = "    analysisTrigger.title = 'Qualify samples or find events inside the selected A/B range';"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts
          git commit -m "Clarify range qualification wording"
          git push origin HEAD:feature/logger-analyzer-handoff
