name: Temporary Logger analysis cache patch

on:
  push:
    branches:
      - audit/logger-analysis-channel-cache

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/logger-analysis-channel-cache
          fetch-depth: 0

      - name: Patch Logger analysis-channel cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/logger-page.ts')
          text = path.read_text()

          state_old = "  let channelDefinitions = new Map<string, ChannelDefinition>();\n  let catalogChannelDefinitions = new Map<string, ChannelDefinition>();"
          state_new = "  let channelDefinitions = new Map<string, ChannelDefinition>();\n  const analysisChannelCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });\n  let analysisChannelsCache: readonly ChannelDefinition[] | undefined;\n  let catalogChannelDefinitions = new Map<string, ChannelDefinition>();"
          if state_new not in text:
              if text.count(state_old) != 1:
                  raise SystemExit(f'Expected one channel state anchor, found {text.count(state_old)}')
              text = text.replace(state_old, state_new)

          helper_anchor = "  const activeDecodedChannels = (): readonly ChannelDefinition[] => {"
          helper = "  const invalidateAnalysisChannels = (): void => { analysisChannelsCache = undefined; };\n\n  const analysisChannels = (): readonly ChannelDefinition[] => {\n    if (analysisChannelsCache) return analysisChannelsCache;\n    analysisChannelsCache = [...channelDefinitions.values()]\n      .filter((channel) => !unavailableChannelIds.has(channel.id))\n      .sort((left, right) => analysisChannelCollator.compare(\n        left.displayName || left.sourceName,\n        right.displayName || right.sourceName,\n      ));\n    return analysisChannelsCache;\n  };\n\n"
          if helper not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit(f'Expected one helper anchor, found {text.count(helper_anchor)}')
              text = text.replace(helper_anchor, helper + helper_anchor)

          replacements = [
              (
                  "      unavailableChannelIds.clear();\n      for (const channel of channels) unavailableChannelIds.add(channel.id);\n      inspector.setCatalogChannels(channels, sourceName);",
                  "      unavailableChannelIds.clear();\n      for (const channel of channels) unavailableChannelIds.add(channel.id);\n      invalidateAnalysisChannels();\n      inspector.setCatalogChannels(channels, sourceName);",
              ),
              (
                  "      channelDefinitions.clear();\n      unavailableChannelIds.clear();\n      inspector.setChannels([], 'No source channels');",
                  "      channelDefinitions.clear();\n      unavailableChannelIds.clear();\n      invalidateAnalysisChannels();\n      inspector.setChannels([], 'No source channels');",
              ),
              (
                  "    unavailableChannelIds.clear();\n    for (const channelId of options.unavailableChannelIds ?? []) unavailableChannelIds.add(channelId);\n    channelDataSource = channelData;",
                  "    unavailableChannelIds.clear();\n    for (const channelId of options.unavailableChannelIds ?? []) unavailableChannelIds.add(channelId);\n    invalidateAnalysisChannels();\n    channelDataSource = channelData;",
              ),
              (
                  "    if (catalogChannelDefinitions.size > 0) {\n      channelDefinitions = new Map(catalogChannelDefinitions);\n      inspector.setCatalogChannels([...catalogChannelDefinitions.values()], catalogSourceName || 'INI');\n    } else {\n      inspector.setError(message);\n    }\n    timeline.setTimeRange(undefined, 0);",
                  "    if (catalogChannelDefinitions.size > 0) {\n      channelDefinitions = new Map(catalogChannelDefinitions);\n      inspector.setCatalogChannels([...catalogChannelDefinitions.values()], catalogSourceName || 'INI');\n    } else {\n      inspector.setError(message);\n    }\n    invalidateAnalysisChannels();\n    timeline.setTimeRange(undefined, 0);",
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one invalidation anchor, found {text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new)

          old_catalog = "    const channels = [...channelDefinitions.values()]\n      .filter((channel) => !unavailableChannelIds.has(channel.id))\n      .sort((left, right) => (left.displayName || left.sourceName).localeCompare(\n        right.displayName || right.sourceName,\n        undefined,\n        { numeric: true, sensitivity: 'base' },\n      ));"
          new_catalog = "    const channels = analysisChannels();"
          if new_catalog not in text:
              if text.count(old_catalog) != 1:
                  raise SystemExit(f'Expected one analysis catalog block, found {text.count(old_catalog)}')
              text = text.replace(old_catalog, new_catalog)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/pages/logger-page.ts; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts
          git commit -m "Cache Logger analysis channel catalog"
          git push origin HEAD:audit/logger-analysis-channel-cache
