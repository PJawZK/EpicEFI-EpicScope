name: Temporary Math Channels parity validation
on:
  push:
    branches: [feat/math-channels-research-parity]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_math_channels_parity.py
      - run: python .github/scripts/temp_math_channels_research_parity.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          rm .github/workflows/temp-math-channels-parity.yml .github/scripts/temp_math_channels_research_parity.py .github/scripts/patch_math_channels_parity.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'complete Math Channels research parity'
          git push
