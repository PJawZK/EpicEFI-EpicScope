name: VE v50 one-off native typing fix

on:
  push:
    branches:
      - ui/ve-analyzer-v50-port

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-off VE v50 native typing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-port
      - name: Keep typed replacement caret after first character
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-table-interaction-dom.ts')
          text = path.read_text()
          old = """    input.focus({ preventScroll: true });\n    input.select();\n\n    let completed = false;\n"""
          new = """    input.focus({ preventScroll: true });\n    if (initial === undefined) input.select();\n    else input.setSelectionRange(input.value.length, input.value.length);\n\n    let completed = false;\n"""
          if old not in text:
              raise SystemExit('expected inline-focus block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ve-table-interaction-dom.ts
          git commit -m "Preserve direct-typing caret semantics [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-port
