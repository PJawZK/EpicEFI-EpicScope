name: Fix priority envelope blocks

on:
  push:
    branches:
      - perf/priority-envelope-blocks-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/priority-envelope-blocks-v1
      - run: python tools/fix-priority-envelope-blocks-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/timeline/viewport-series.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix exact envelope invalid counts"
          git push origin HEAD:perf/priority-envelope-blocks-v1
