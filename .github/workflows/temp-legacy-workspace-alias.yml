name: Temporary legacy workspace alias patch

on:
  push:
    branches:
      - fix/legacy-workspace-shorthand-aliases

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run legacy workspace alias patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-workspace-shorthand-aliases
      - name: Apply legacy workspace alias patch
        run: python3 tools/temp_legacy_workspace_alias_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/channels/channel-binding.ts tests/channels/channel-binding.test.ts
          git commit -m "Fix: migrate legacy workspace shorthand channels"
          git push origin HEAD:fix/legacy-workspace-shorthand-aliases
