name: Temp apply VE source revision

on:
  push:
    branches:
      - fix/ve-session-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ve-session-authority
          fetch-depth: 0
      - name: Apply source sample identity
        run: |
          python - <<'PY'
          from pathlib import Path

          logger = Path('apps/web/src/pages/logger-page.ts')
          text = logger.read_text()
          old = "  readonly bTimeMs: number | undefined;\n  readonly savedRanges: readonly import('../state/workspace-state').SavedTimelineRangeState[];\n"
          new = "  readonly bTimeMs: number | undefined;\n  readonly sourceSampleCount?: number;\n  readonly savedRanges: readonly import('../state/workspace-state').SavedTimelineRangeState[];\n"
          if old not in text:
              raise SystemExit('LoggerAnalysisContext anchor not found')
          text = text.replace(old, new, 1)

          old = "    return {\n      traces,\n      channels,\n      loadTraces,\n      aTimeMs: analysisStartMs,\n"
          new = "    return {\n      traces,\n      channels,\n      loadTraces,\n      sourceSampleCount: channelDataSource?.sampleCount,\n      aTimeMs: analysisStartMs,\n"
          if old not in text:
              raise SystemExit('getAnalysisContext return anchor not found')
          text = text.replace(old, new, 1)
          logger.write_text(text)

          analyzer = Path('apps/web/src/pages/analyzer-page.ts')
          text = analyzer.read_text()
          old = "    && left.aTimeMs === right.aTimeMs\n    && left.bTimeMs === right.bTimeMs\n    && sameSavedRanges(left.savedRanges, right.savedRanges);\n"
          new = "    && left.aTimeMs === right.aTimeMs\n    && left.bTimeMs === right.bTimeMs\n    && left.sourceSampleCount === right.sourceSampleCount\n    && sameSavedRanges(left.savedRanges, right.savedRanges);\n"
          if old not in text:
              raise SystemExit('sameVeAnalysisContext anchor not found')
          analyzer.write_text(text.replace(old, new, 1))

          Path('.github/workflows/temp-apply-ve-source-revision.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts apps/web/src/pages/analyzer-page.ts .github/workflows/temp-apply-ve-source-revision.yml
          git commit -m "fix: invalidate VE session when source grows"
          git push origin HEAD:fix/ve-session-authority
