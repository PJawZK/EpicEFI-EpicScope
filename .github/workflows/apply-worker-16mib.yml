name: Apply worker 16 MiB experiment

on:
  push:
    branches:
      - perf/worker-16mib-pages

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/worker-16mib-pages
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply split page-size patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/adapters/blob-byte-source.ts')
          text = path.read_text()
          text = text.replace(
              'const CACHE_PAGE_SIZE = 32 * 1024 * 1024;\nconst CACHE_LIMIT_BYTES = 96 * 1024 * 1024;\nconst PINNED_CACHE_LIMIT_BYTES = CACHE_LIMIT_BYTES - CACHE_PAGE_SIZE;',
              'const DEFAULT_CACHE_PAGE_SIZE = 32 * 1024 * 1024;\nconst CACHE_LIMIT_BYTES = 96 * 1024 * 1024;'
          )
          text = text.replace(
              'export interface BlobByteSourceStats {',
              'export interface BlobByteSourceOptions {\n  readonly pageSizeBytes?: number;\n}\n\nexport interface BlobByteSourceStats {'
          )
          text = text.replace(
              '  private readonly blob: Blob;\n',
              '  private readonly blob: Blob;\n  private readonly pageSizeBytes: number;\n  private readonly pinnedCacheLimitBytes: number;\n'
          )
          text = text.replace(
              '  public constructor(blob: Blob) {\n    this.blob = blob;\n    this.size = blob.size;\n    this.preferredReadAlignmentBytes = this.size > CACHE_LIMIT_BYTES\n      ? CACHE_PAGE_SIZE\n      : undefined;\n    latestBlobByteSource = this;\n  }',
              '  public constructor(blob: Blob, options: BlobByteSourceOptions = {}) {\n    this.blob = blob;\n    this.size = blob.size;\n    this.pageSizeBytes = options.pageSizeBytes ?? DEFAULT_CACHE_PAGE_SIZE;\n    if (!Number.isFinite(this.pageSizeBytes) || this.pageSizeBytes <= 0 || this.pageSizeBytes > CACHE_LIMIT_BYTES) {\n      throw new RangeError(`Invalid Blob page size: ${this.pageSizeBytes}`);\n    }\n    this.pinnedCacheLimitBytes = CACHE_LIMIT_BYTES - this.pageSizeBytes;\n    this.preferredReadAlignmentBytes = this.size > CACHE_LIMIT_BYTES\n      ? this.pageSizeBytes\n      : undefined;\n    latestBlobByteSource = this;\n  }'
          )
          text = text.replace('pageIndex * CACHE_PAGE_SIZE', 'pageIndex * this.pageSizeBytes')
          text = text.replace('firstPageIndex * CACHE_PAGE_SIZE', 'firstPageIndex * this.pageSizeBytes')
          text = text.replace('Math.min(CACHE_PAGE_SIZE, this.size - start)', 'Math.min(this.pageSizeBytes, this.size - start)')
          text = text.replace('<= PINNED_CACHE_LIMIT_BYTES', '<= this.pinnedCacheLimitBytes')
          text = text.replace('Math.floor(offset / CACHE_PAGE_SIZE)', 'Math.floor(offset / this.pageSizeBytes)')
          text = text.replace('Math.floor((offset + length - 1) / CACHE_PAGE_SIZE)', 'Math.floor((offset + length - 1) / this.pageSizeBytes)')
          text = text.replace('pageSizeBytes: CACHE_PAGE_SIZE,', 'pageSizeBytes: this.pageSizeBytes,')
          text = text.replace('pinnedCacheLimitBytes: PINNED_CACHE_LIMIT_BYTES,', 'pinnedCacheLimitBytes: this.pinnedCacheLimitBytes,')
          path.write_text(text)

          worker = Path('apps/web/src/workers/mlg-import.worker.ts')
          text = worker.read_text()
          text = text.replace(
              'const now = (): number => globalThis.performance?.now() ?? Date.now();',
              'const now = (): number => globalThis.performance?.now() ?? Date.now();\nconst WORKER_CACHE_PAGE_SIZE = 16 * 1024 * 1024;'
          )
          text = text.replace(
              'const source = new BlobByteSource(importRequest.file);',
              'const source = new BlobByteSource(importRequest.file, {\n      pageSizeBytes: WORKER_CACHE_PAGE_SIZE,\n    });'
          )
          worker.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          rm -f typecheck-worker-experiment.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A apps/web/src/adapters/blob-byte-source.ts apps/web/src/workers/mlg-import.worker.ts typecheck-worker-experiment.txt
          git commit -m "Perf: test 16 MiB worker Blob pages"
          git push origin HEAD:perf/worker-16mib-pages
