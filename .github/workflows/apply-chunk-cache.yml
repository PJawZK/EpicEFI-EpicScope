name: Apply chunked channel cache
on:
  push:
    branches: [perf/chunked-channel-cache]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/chunked-channel-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python3 .github/chunk_cache_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-chunk-cache.yml .github/chunk_cache_patch.py
          git add -A
          git diff --cached --quiet || git commit -m "Perf: reuse fixed decoded channel chunks"
          git push origin HEAD:perf/chunked-channel-cache
