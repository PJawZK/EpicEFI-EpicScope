name: Temporary histogram cell drilldown

on:
  push:
    paths:
      - .github/workflows/tmp-histogram-cell-drilldown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: histogram/mlv-cell-drilldown-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Align patch to current source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-cell-drilldown.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('x > currentLayout.left + currentLayout.width', 'x >= currentLayout.left + currentLayout.width')
          text = text.replace('y > currentLayout.top + currentLayout.height', 'y >= currentLayout.top + currentLayout.height')
          text = text.replace("`${sampleIndex}\\t${selectedCell!.timeMs[index] ?? ''}`", "`${sampleIndex}\\\\t${selectedCell!.timeMs[index] ?? ''}`")
          text = text.replace("['sampleIndex\\ttimeMs', ...lines].join('\\n')", "['sampleIndex\\\\ttimeMs', ...lines].join('\\\\n')")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply cell drilldown patch
        run: python scripts/tmp-cell-drilldown.py
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add histogram cell sample drilldown"
          git push origin HEAD:histogram/mlv-cell-drilldown-v1
