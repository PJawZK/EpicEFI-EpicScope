name: Current documentation refresh
on: push
permissions:
  contents: write
jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/update_current_documentation.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          rm scripts/update_current_documentation.py
          rm .github/workflows/apply-current-docs.yml
          git config user.name PJawZK
          git config user.email anderswedin@hotmail.se
          git add README.md docs scripts .github/workflows
          git commit -m "Docs: synchronize current EpicScope project state"
          git push origin HEAD:docs/current-state-2026-10-03
