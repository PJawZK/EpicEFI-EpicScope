name: Patch logger render reconciliation and report status

on:
  push:
    branches: [fix/logger-render-reconcile-report-status]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/logger-render-reconcile-report-status
      - name: Apply focused patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing patch anchor in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          # Expose graph in-flight channel IDs so Logger can distinguish a genuinely missing trace
          # from one that is already queued/loading.
          path='apps/web/src/components/graph-viewport.ts'
          replace_once(path,
          "  toggleChannel(channelId: string): Promise<boolean>;\n  activatePreloadedChannels(\n",
          "  toggleChannel(channelId: string): Promise<boolean>;\n  getInFlightChannelIds(): readonly string[];\n  activatePreloadedChannels(\n")
          replace_once(path,
          "    toggleChannel,\n    activatePreloadedChannels,\n",
          "    toggleChannel,\n    getInFlightChannelIds: () => [...new Set([...pendingTraces.keys(), ...loadingTraceIds])],\n    activatePreloadedChannels,\n")

          # Reconcile assigned/renderable pane channels after every channel completion. This repairs
          # any selection that was assigned but lost from the pending/active pipeline without
          # disturbing channels that are still queued/loading.
          path='apps/web/src/pages/logger-page.ts'
          anchor="  inspector.onChannelToggled((channelId) => {\n"
          helper="""  const reconcileAssignedPaneChannels = (runtime: (typeof paneRuntimes)[number]): void => {
    const workspace = activeWorkspace();
    const pane = workspace?.panes.find((candidate) => candidate.id === runtime.id);
    if (!pane || !channelDataSource) return;
    const inFlight = new Set(runtime.graph.getInFlightChannelIds());
    const missingIds = renderablePersistentChannelIds(pane.channelIds).filter(
      (channelId) => channelDefinitions.has(channelId)
        && !unavailableChannelIds.has(channelId)
        && !runtime.activeChannelIds.has(channelId)
        && !inFlight.has(channelId),
    );
    if (missingIds.length === 0) return;
    const activations = missingIds.map((channelId) => runtime.graph.toggleChannel(channelId));
    runtime.graph.loadPendingChannels();
    void Promise.all(activations).then((results) => {
      missingIds.forEach((channelId, index) => {
        if (results[index]) runtime.activeChannelIds.add(channelId);
      });
      syncActivePaneContext();
    });
  };

"""
          replace_once(path, anchor, helper+anchor)
          replace_once(path,
          "      if (runtime.id === activeWorkspace()?.activePaneId) {\n        timeline.setOverviewContent(runtime.graph.getOverviewTraces(), logMarkers);\n      }\n",
          "      if (runtime.id === activeWorkspace()?.activePaneId) {\n        timeline.setOverviewContent(runtime.graph.getOverviewTraces(), logMarkers);\n      }\n      reconcileAssignedPaneChannels(runtime);\n")
          replace_once(path,
          "  inspector.onLoadSelected(() => {\n    activePaneRuntime()?.graph.loadPendingChannels();\n  });\n",
          "  inspector.onLoadSelected(() => {\n    const runtime = activePaneRuntime();\n    if (!runtime) return;\n    runtime.graph.loadPendingChannels();\n    window.setTimeout(() => reconcileAssignedPaneChannels(runtime), 0);\n  });\n")

          # Add live Report health status (issue / warning / OK) without opening the dialog.
          path='apps/web/src/app/app-shell.ts'
          replace_once(path,
          "  bugReportButton.innerHTML = '<span class=\"utility-action-symbol\" aria-hidden=\"true\">⚑</span><span>Report</span>';\n",
          "  bugReportButton.innerHTML = '<span class=\"utility-action-symbol\" aria-hidden=\"true\">⚑</span><span>Report</span><span class=\"bug-report-status\" aria-hidden=\"true\">—</span>';\n")
          anchor="  const setPersistenceStatus = (message: string): void => {\n"
          status="""  const refreshBugReportButtonStatus = (): void => {
    const snapshot = loggerPage.getRuntimeDiagnosticSnapshot();
    const { issues, warnings } = evaluateBugReportHealth(snapshot, {
      logLoaded: currentRawLog !== undefined,
      iniLoaded: activeIniCatalog !== undefined,
      bindingActive: activeIniBinding !== undefined,
      runtimeErrorCount: runtimeErrors.length,
    });
    const status = bugReportButton.querySelector<HTMLElement>('.bug-report-status');
    const state = issues.length > 0 ? 'issue' : warnings.length > 0 ? 'warning' : 'ok';
    bugReportButton.dataset.reportState = state;
    if (status) status.textContent = issues.length > 0 ? String(issues.length) : warnings.length > 0 ? String(warnings.length) : '✓';
    bugReportButton.title = issues.length > 0
      ? `Report · ${issues.length} issue${issues.length === 1 ? '' : 's'}${warnings.length ? ` · ${warnings.length} warning${warnings.length === 1 ? '' : 's'}` : ''}`
      : warnings.length > 0
        ? `Report · ${warnings.length} warning${warnings.length === 1 ? '' : 's'}`
        : 'Report · runtime health OK';
  };
  refreshBugReportButtonStatus();
  window.setInterval(refreshBugReportButtonStatus, 750);

"""
          replace_once(path, anchor, status+anchor)

          # Keep Report status compact and consistent with the existing footer controls.
          path='apps/web/src/styles/ui-refinements.css'
          p=Path(path); s=p.read_text()
          css="""

/* Live bug-report health status: compact footer-state indicator. */
.bug-report-button .bug-report-status {
  min-width: 15px;
  height: 15px;
  display: inline-grid;
  place-items: center;
  margin-left: 2px;
  padding: 0 3px;
  border: 1px solid #3a5364;
  border-radius: 8px;
  color: #91a5b2;
  font-size: 8px;
  font-weight: 850;
  line-height: 1;
}
.bug-report-button[data-report-state="ok"] .bug-report-status { border-color: #315f4c; color: #76d6a8; }
.bug-report-button[data-report-state="warning"] .bug-report-status { border-color: #7b682d; color: #f1c84b; }
.bug-report-button[data-report-state="issue"] .bug-report-status { border-color: #8c5344; color: #ff8c78; }
"""
          if 'Live bug-report health status' not in s: p.write_text(s+css)
          PY
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts apps/web/src/pages/logger-page.ts apps/web/src/app/app-shell.ts apps/web/src/styles/ui-refinements.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair assigned logger traces and show report health"
          git push origin HEAD:fix/logger-render-reconcile-report-status
