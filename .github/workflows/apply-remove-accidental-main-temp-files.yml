name: Apply accidental main temp cleanup

on:
  push:
    branches:
      - cleanup/remove-accidental-main-temp-files

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply accidental main temp cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-accidental-main-temp-files
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/remove-accidental-main-temp-files.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SHOULD_NOT_EXIST.tmp cleanup-note.tmp
          git commit -m "Cleanup: remove accidental main temp files"
          git push
