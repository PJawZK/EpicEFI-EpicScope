name: Temp runtime predecode diagnostics
on:
  push:
    branches: [perf/runtime-predecode-diagnostics]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/runtime-predecode-diagnostics
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python tools/temp-runtime-predecode-diagnostics.py
      - run: rm tools/temp-runtime-predecode-diagnostics.py .github/workflows/temp-runtime-predecode-diagnostics.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: derive and report runtime predecode channels"
          git push
