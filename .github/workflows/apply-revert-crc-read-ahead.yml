name: Apply CRC read-ahead revert

on:
  push:
    branches:
      - perf/revert-crc-read-ahead

permissions:
  contents: write

jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/revert-crc-read-ahead
          fetch-depth: 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert -m 1 --no-edit 0834ccb2e47ffe898b3345645ed2f14cd49cb129
          git push origin HEAD:perf/revert-crc-read-ahead
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
