name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase1/**
      - perf/retained-memory-diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: perf/retained-memory-diagnostics

      - name: Apply retained-memory diagnostics
        if: ${{ github.ref == 'refs/heads/perf/retained-memory-diagnostics' && github.actor != 'github-actions[bot]' }}
        run: python3 tools/patch-retained-memory-diagnostics.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated diagnostics
        if: ${{ github.ref == 'refs/heads/perf/retained-memory-diagnostics' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/channels/channel-binding.ts apps/web/src/adapters/persistent-channel-cache.ts apps/web/src/components/graph-viewport.ts apps/web/src/pages/logger-page.ts apps/web/src/components/performance-diagnostics.ts apps/web/src/app/app-shell.ts
          git commit -m 'Instrument retained channel memory'
          git push origin HEAD:perf/retained-memory-diagnostics
