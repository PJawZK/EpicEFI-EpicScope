name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase1/**
      - fix/codex-audit-correctness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/codex-audit-correctness

      - name: Apply Codex audit fixes
        if: ${{ github.ref == 'refs/heads/fix/codex-audit-correctness' && github.actor != 'github-actions[bot]' }}
        run: python3 tools/patch-codex-audit-correctness.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated fixes
        if: ${{ github.ref == 'refs/heads/fix/codex-audit-correctness' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts apps/web/src/pages/logger-page.ts apps/web/src/pages/histogram-math-channels-view.ts apps/web/src/pages/histogram-table-generator-view.ts apps/web/src/pages/scatter-view.ts
          git commit -m 'Fix Codex audit correctness issues'
          git push origin HEAD:fix/codex-audit-correctness
