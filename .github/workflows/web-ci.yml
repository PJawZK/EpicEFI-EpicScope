name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase1/**
      - fix/graph-preset-trace-invariant-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/graph-preset-trace-invariant-v2
      - name: Guard cached activation across preset switches
        if: ${{ github.ref == 'refs/heads/fix/graph-preset-trace-invariant-v2' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/graph-viewport.ts')
          s = p.read_text()
          reps = [
            ("  const activateCachedChannel = async (\n    channelId: string,\n    pending: PendingTrace,\n  ): Promise<boolean> => {", "  const activateCachedChannel = async (\n    channelId: string,\n    pending: PendingTrace,\n    generation: number,\n  ): Promise<boolean> => {"),
            ("      const range = result.ranges.get(channelId);\n      if (!range) return false;", "      const range = result.ranges.get(channelId);\n      if (generation !== decodeGeneration || !range) return false;"),
            ("      loadingTraceIds.add(channelId);\n      overlay.hidden = false;", "      const generation = decodeGeneration;\n      loadingTraceIds.add(channelId);\n      overlay.hidden = false;"),
            ("      void activateCachedChannel(channelId, pending)\n        .then(resolveSelection)", "      void activateCachedChannel(channelId, pending, generation)\n        .then(resolveSelection)"),
          ]
          for old, new in reps:
            if old not in s: raise SystemExit('cached activation anchor missing: ' + old[:80])
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated cached preset guard
        if: ${{ github.ref == 'refs/heads/fix/graph-preset-trace-invariant-v2' && github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts
          git commit -m 'Guard cached trace activation across preset switches'
          git push origin HEAD:fix/graph-preset-trace-invariant-v2
