name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase1/**
      - fix/load-newly-visible-pane-traces
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-layout-traces:
    if: ${{ github.ref == 'refs/heads/fix/load-newly-visible-pane-traces' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/load-newly-visible-pane-traces
      - name: Patch layout activation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          old = "    renderGraphLayout();\n    syncActivePaneContext();\n    emitWorkspaceMutation();\n  });\n\n  arrangeSelect.addEventListener('change', () => {"
          new = "    renderGraphLayout();\n    syncActivePaneContext();\n    reconcileAssignedVisiblePaneChannels();\n    emitWorkspaceMutation();\n  });\n\n  arrangeSelect.addEventListener('change', () => {"
          if old not in s: raise SystemExit('layout change anchor missing')
          s = s.replace(old, new, 1)
          old = "    renderGraphLayout();\n    syncActivePaneContext();\n    emitWorkspaceMutation();\n  });\n\n  clearPaneButton.addEventListener('click', () => {"
          new = "    renderGraphLayout();\n    syncActivePaneContext();\n    reconcileAssignedVisiblePaneChannels();\n    emitWorkspaceMutation();\n  });\n\n  clearPaneButton.addEventListener('click', () => {"
          if old not in s: raise SystemExit('arrange change anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts
          git commit -m 'Load traces when graph panes become visible'
          git push origin HEAD:fix/load-newly-visible-pane-traces

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
