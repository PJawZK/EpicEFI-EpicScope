name: Temp live-source memory validation

on:
  push:
    branches:
      - perf/all-live-source-memory
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/all-live-source-memory
      - name: Apply instrumentation patch
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: python3 tools/patch-all-live-source-memory.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/adapters/persistent-channel-cache.ts core/channels/channel-binding.ts apps/web/src/components/performance-diagnostics.ts
          git commit -m 'Track retained memory across live log sources'
          git push origin HEAD:perf/all-live-source-memory
