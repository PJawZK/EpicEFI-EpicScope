name: Temporary run timeline hierarchy patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-target-and-clean-main:
    if: contains(github.event.head_commit.message, 'run timeline hierarchy branch patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ui/timeline-hierarchy-v1
          fetch-depth: 0

      - name: Apply patch
        run: python .tmp/apply_timeline_hierarchy.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit target implementation
        run: |
          rm -f .github/workflows/tmp-timeline-hierarchy.yml .tmp/apply_timeline_hierarchy.py
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine timeline workflow hierarchy"
          git push origin HEAD:ui/timeline-hierarchy-v1

      - name: Clean temporary main workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/tmp-run-timeline-hierarchy.yml
          git add .github/workflows/tmp-run-timeline-hierarchy.yml
          git commit -m "chore: remove temporary timeline patch workflow"
          git push origin HEAD:main
