name: Apply sidecar stripe 16 v1

on:
  push:
    branches:
      - perf/sidecar-stripe-16-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sidecar-stripe-16-v1
      - run: python tools/apply-sidecar-stripe-16-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts
          git commit -m "Perf: test 16-byte MLG sidecar stripes"
          git push origin HEAD:perf/sidecar-stripe-16-v1
