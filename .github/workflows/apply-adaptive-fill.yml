name: Apply adaptive progressive fill
on:
  push:
    branches: [perf/progressive-channel-fill]
    paths: [.github/workflows/apply-adaptive-fill.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/progressive-channel-fill
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply adaptive fill patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/components/graph-viewport.ts')
          s = p.read_text()
          s = s.replace("const PROGRESSIVE_FILL_STEP_SAMPLES = 16_384;", "const PROGRESSIVE_FILL_BASE_STEP_SAMPLES = 16_384;\nconst PROGRESSIVE_FILL_DESKTOP_MAX_STEP_SAMPLES = 65_536;\nconst PROGRESSIVE_FILL_LOW_SPEC_MAX_STEP_SAMPLES = 32_768;\n\nfunction progressiveFillStepSamples(missingSamples: number, completedSteps: number): number {\n  if (completedSteps === 0 || missingSamples <= PROGRESSIVE_FILL_BASE_STEP_SAMPLES * 2) {\n    return PROGRESSIVE_FILL_BASE_STEP_SAMPLES;\n  }\n\n  const logicalThreads = Math.max(1, globalThis.navigator?.hardwareConcurrency ?? 1);\n  const maximum = logicalThreads <= 3\n    ? PROGRESSIVE_FILL_LOW_SPEC_MAX_STEP_SAMPLES\n    : PROGRESSIVE_FILL_DESKTOP_MAX_STEP_SAMPLES;\n  if (missingSamples >= PROGRESSIVE_FILL_BASE_STEP_SAMPLES * 8) return maximum;\n  return Math.min(maximum, PROGRESSIVE_FILL_BASE_STEP_SAMPLES * 2);\n}")
          s = s.replace("      let preferLeft = true;\n      while (generation === viewportRefreshGeneration) {", "      let preferLeft = true;\n      let completedSteps = 0;\n      while (generation === viewportRefreshGeneration) {")
          s = s.replace("        if (disjointLeft || disjointRight) {\n          chunkStart = desiredStart;\n          chunkCount = Math.min(PROGRESSIVE_FILL_STEP_SAMPLES, requestRange.sampleCount);\n          replaceExisting = true;\n        } else {\n          const missingLeft = Math.max(0, existingStart - desiredStart);\n          const missingRight = Math.max(0, desiredEnd - existingEnd);", "        if (disjointLeft || disjointRight) {\n          chunkStart = desiredStart;\n          chunkCount = Math.min(PROGRESSIVE_FILL_BASE_STEP_SAMPLES, requestRange.sampleCount);\n          replaceExisting = true;\n        } else {\n          const missingLeft = Math.max(0, existingStart - desiredStart);\n          const missingRight = Math.max(0, desiredEnd - existingEnd);\n          const fillStepSamples = progressiveFillStepSamples(\n            missingLeft + missingRight,\n            completedSteps,\n          );")
          s = s.replace("            chunkCount = Math.min(PROGRESSIVE_FILL_STEP_SAMPLES, missingLeft);", "            chunkCount = Math.min(fillStepSamples, missingLeft);")
          s = s.replace("            chunkCount = Math.min(PROGRESSIVE_FILL_STEP_SAMPLES, missingRight);", "            chunkCount = Math.min(fillStepSamples, missingRight);")
          s = s.replace("          channelPerformanceListener?.({\n            channelId,", "          channelPerformanceListener?.({\n            channelId,")
          marker = "          channelPerformanceListener?.({\n            channelId,\n            phase: requestRange.phase,\n            startSampleIndex: chunkStart,\n            requestedSampleCount: chunkCount,\n            totalMs: completedMs - readStart,\n            readDecodeMs,\n            scaleMs,\n            renderMs,\n            sampleCount: nextRange.values.length,\n            batchSize: 1,\n            cacheHit: result.performance.cacheHitChannelIds.includes(channelId),\n            physicalReadCount: result.performance.physicalReadCount,\n            physicalBytesRead: result.performance.physicalBytesRead,\n            physicalReadMs: result.performance.physicalReadMs,\n          });"
          replacement = marker + "\n          completedSteps += 1;"
          if marker not in s:
            raise SystemExit('performance marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated patch and remove temporary tooling
        run: |
          rm .github/workflows/apply-adaptive-fill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts .github/workflows/apply-adaptive-fill.yml
          git commit -m "Perf: adapt progressive fill size to missing span"
          git push origin HEAD:perf/progressive-channel-fill
