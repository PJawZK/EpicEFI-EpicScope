name: Apply sidecar concurrent IO

on:
  push:
    branches:
      - perf/mlg-sidecar-concurrent-io-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mlg-sidecar-concurrent-io-v1
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/adapters/mlg-column-sidecar-v1.ts')
          text = path.read_text()
          text = text.replace(
              "      for (let index = 0; index < outputs.length; index += 1) {\n        await streams[index]!.write(outputs[index]!);\n      }",
              "      await Promise.all(outputs.map((output, index) => streams[index]!.write(output)));",
              1,
          )
          text = text.replace(
              "      for (const stream of streams) {\n        await stream.close();\n      }",
              "      await Promise.all(streams.map((stream) => stream.close()));",
              1,
          )
          path.write_text(text)
          PY
      - name: Commit patch when changed
        run: |
          if git diff --quiet -- apps/web/src/adapters/mlg-column-sidecar-v1.ts; then
            exit 0
          fi
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts
          git commit -m "Perf: parallelize sidecar stripe IO"
          git push origin HEAD:perf/mlg-sidecar-concurrent-io-v1
