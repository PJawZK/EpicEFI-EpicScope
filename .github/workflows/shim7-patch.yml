name: SHIM-7 shell patch

on:
  push:
    branches: [shim/logger-ui-v1]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[shim7-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shim/logger-ui-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch shell and live header ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/app/app-shell.ts')
          s = p.read_text()
          anchor = "import {\n  createWorkspaceHistory,\n  type WebWorkspaceState,\n} from '../state/workspace-state';\n"
          insert = anchor + "import { SHIM_CAPTURE_SOURCE_EVENT, type ShimCaptureSourceEventDetail } from './shim-capture-source-event';\n"
          if "SHIM_CAPTURE_SOURCE_EVENT" not in s:
              s = s.replace(anchor, insert, 1)

          old = "  const setEpicScopeMode = (mode: EpicScopeMode): void => {"
          if old not in s:
              raise SystemExit('setEpicScopeMode anchor missing')
          s = s.replace(
              "    modeChip.textContent = loggerActive ? 'RECORDED' : analyzerActive ? 'ANALYZER' : 'HISTOGRAM';",
              "    modeChip.textContent = loggerActive ? (modeChip.dataset.loggerSource === 'shim' ? 'CAPTURE · SHIM' : 'RECORDED') : analyzerActive ? 'ANALYZER' : 'HISTOGRAM';",
              1,
          )

          init_anchor = "  if (!brandButton || !brandMenu || !loadDataButton || !loadDataMenu || !openButton || !loadIniButton || !loadMsqButton || !loadedLog || !appStatus || !parserStatus || !modeChip || !settingsButton || !settingsPopover || !playbackSpeed || !samplePoints || !overviewTraces || !performanceVisible || !undoButton || !redoButton || !unloadIniButton || !iniStatus || !forgetWorkspaceButton || !persistenceStatus || !clearChannelCacheButton || !channelCacheStatus) {\n    throw new Error('EpicScope application shell structure is incomplete.');\n  }\n"
          if "modeChip.dataset.loggerSource = 'recorded';" not in s:
              s = s.replace(init_anchor, init_anchor + "  modeChip.dataset.loggerSource = 'recorded';\n", 1)

          staged_anchor = "  let activeStagedImport: StagedMlgImportHandle | undefined;\n"
          listener = staged_anchor + "\n  root.addEventListener(SHIM_CAPTURE_SOURCE_EVENT, (event) => {\n    const detail = (event as CustomEvent<ShimCaptureSourceEventDetail>).detail;\n    const source = detail?.source;\n    if (!source || source.recordCount < 1) return;\n\n    activeStagedImport?.cancel();\n    activeStagedImport = undefined;\n    currentRawLog = {\n      summary: source.summary,\n      recordCount: source.recordCount,\n      channelData: source.channelData,\n    };\n    activeIniBinding = undefined;\n    activeWorkspaceSource = undefined;\n    workspacePersistenceBlocked = false;\n    forgetWorkspaceButton.disabled = true;\n    modeChip.dataset.loggerSource = 'shim';\n\n    loggerPage.setLog(source.summary, source.recordCount, source.channelData);\n    loadedLog.textContent = source.summary.source.displayName;\n    loggerPage.setDiagnostics(source.summary.diagnostics);\n    parserStatus.textContent = `TS-SHIM · ${source.recordCount.toLocaleString()} samples · ${source.summary.channels.length.toLocaleString()} channels · retained capture`;\n    appStatus.textContent = `Shim capture active · ${source.recordCount.toLocaleString()} samples`;\n    setPersistenceStatus('Shim capture uses the reusable workspace structure · capture navigation is session-only.');\n\n    if (activeMode !== 'logger') setEpicScopeMode('logger');\n    else modeChip.textContent = 'CAPTURE · SHIM';\n    void loggerPage.restoreActiveWorkspace().then(() => {\n      resetWorkspaceHistory();\n      scheduleWorkspaceSave();\n    });\n  });\n"
          if "Shim capture active" not in s:
              s = s.replace(staged_anchor, listener, 1)

          file_anchor = "    if (!file) return;\n\n    activeStagedImport?.cancel();"
          s = s.replace(file_anchor, "    if (!file) return;\n\n    modeChip.dataset.loggerSource = 'recorded';\n    activeStagedImport?.cancel();", 1)

          p.write_text(s)

          p = Path('apps/web/src/app/shim-live-ui.ts')
          s = p.read_text()
          old = "  const setHeaderLive = (detail: string): void => {\n    modeChip.textContent = session?.isRecording ? 'LIVE · SHIM · RECORDING' : 'LIVE · SHIM';\n    loadedLog.title = 'Live ts_shim source';\n    loadedLog.innerHTML = `<span>Shim</span><strong class=\"shim-live-detail\">${detail}</strong>`;\n    parserStatus.textContent = 'TS-SHIM · same-origin telemetry';\n  };"
          new = "  let captureOpened = false;\n  const setHeaderLive = (detail: string): void => {\n    if (captureOpened) return;\n    modeChip.textContent = session?.isRecording ? 'LIVE · SHIM · RECORDING' : 'LIVE · SHIM';\n    loadedLog.title = 'Live ts_shim source';\n    const label = loadedLog.querySelector<HTMLElement>(':scope > span');\n    const value = loadedLog.querySelector<HTMLElement>(':scope > strong');\n    if (label) label.textContent = 'Shim';\n    if (value) { value.textContent = detail; value.classList.add('shim-live-detail'); }\n    parserStatus.textContent = 'TS-SHIM · same-origin telemetry';\n  };"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('setHeaderLive anchor missing')

          dispatch_anchor = "    dispatchShimCaptureSource(root, source);\n    appStatus.textContent = `Shim capture opened · ${source.recordCount.toLocaleString()} samples`;"
          s = s.replace(dispatch_anchor, "    captureOpened = true;\n    dispatchShimCaptureSource(root, source);\n    modeChip.textContent = 'CAPTURE · SHIM';\n    appStatus.textContent = `Shim capture opened · ${source.recordCount.toLocaleString()} samples`;", 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/app-shell.ts apps/web/src/app/shim-live-ui.ts
          git commit -m "Wire shim capture into application source [shim7-patched]"
          git push origin HEAD:shim/logger-ui-v1
