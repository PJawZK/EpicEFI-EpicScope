name: Temporary Boost operating suggestions
on:
  push:
    branches:
      - feature/boost-operating-suggestions
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-operating-suggestions
          fetch-depth: 0
      - name: Add conservative operating-point suggestions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/pages/boost-analyzer-view.ts')
          t = p.read_text()
          old = "<th>RPM trend</th><th>Load trend</th><th>Upper duty mean</th><th>Lower duty mean</th>"
          new = "<th>RPM trend</th><th>Load trend</th><th>What this suggests</th><th>Upper duty mean</th><th>Lower duty mean</th>"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "      const trendText = (trend: typeof point.rpmTrend): string => {\n        if (!trend) return '—';\n        const direction = trend.direction === 'rising' ? '↑' : trend.direction === 'falling' ? '↓' : '→';\n        const duty = trend.upperDutyDelta === undefined && trend.lowerDutyDelta === undefined\n          ? ''\n          : ` · U ${trend.upperDutyDelta === undefined ? '—' : `${trend.upperDutyDelta >= 0 ? '+' : ''}${formatNumber(trend.upperDutyDelta)}`} · L ${trend.lowerDutyDelta === undefined ? '—' : `${trend.lowerDutyDelta >= 0 ? '+' : ''}${formatNumber(trend.lowerDutyDelta)}`}`;\n        return `${direction} P ${trend.pressureDelta >= 0 ? '+' : ''}${formatNumber(trend.pressureDelta)}${duty}`;\n      };\n      row.dataset.boostAssessment = point.assessment;"
          new = "      const trendText = (trend: typeof point.rpmTrend): string => {\n        if (!trend) return '—';\n        const direction = trend.direction === 'rising' ? '↑' : trend.direction === 'falling' ? '↓' : '→';\n        const duty = trend.upperDutyDelta === undefined && trend.lowerDutyDelta === undefined\n          ? ''\n          : ` · U ${trend.upperDutyDelta === undefined ? '—' : `${trend.upperDutyDelta >= 0 ? '+' : ''}${formatNumber(trend.upperDutyDelta)}`} · L ${trend.lowerDutyDelta === undefined ? '—' : `${trend.lowerDutyDelta >= 0 ? '+' : ''}${formatNumber(trend.lowerDutyDelta)}`}`;\n        return `${direction} P ${trend.pressureDelta >= 0 ? '+' : ''}${formatNumber(trend.pressureDelta)}${duty}`;\n      };\n      const suggestionText = (): string => {\n        if (point.assessment === 'mixed-transient-likely') return 'Qualify further before tuning';\n        if (point.assessment === 'limited-evidence') return 'Collect more evidence';\n        const trend = point.rpmTrend ?? point.loadTrend;\n        if (!trend) return point.assessment === 'good-comparison' ? 'Good standalone evidence; no comparable neighbor' : 'Usable, but no trustworthy adjacent bin';\n        const dutyDeltas = [trend.upperDutyDelta, trend.lowerDutyDelta].filter((value): value is number => value !== undefined);\n        if (dutyDeltas.length === 0) return 'Pressure trend only; duty response unavailable';\n        const dutyChanged = dutyDeltas.some((value) => Math.abs(value) >= 0.5);\n        if (!dutyChanged && trend.direction !== 'similar') return 'Pressure changed at similar duty';\n        if (dutyChanged && trend.direction === 'similar') return 'Duty changed with little pressure response';\n        if (dutyChanged) return 'Observed duty + pressure response; confirm with another pull';\n        return 'Similar duty and pressure';\n      };\n      row.dataset.boostAssessment = point.assessment;"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "<td>${trendText(point.rpmTrend)}</td><td>${trendText(point.loadTrend)}</td><td>${formatNumber(point.upperDutyMean)}</td>"
          new = "<td>${trendText(point.rpmTrend)}</td><td>${trendText(point.loadTrend)}</td><td>${suggestionText()}</td><td>${formatNumber(point.upperDutyMean)}</td>"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('apps/web/src/pages/boost-analyzer-help.ts')
          t = p.read_text()
          old = "These labels and trends describe observed evidence; they do not prescribe a tune change."
          new = "The What this suggests column turns those facts into a conservative next-step interpretation such as Collect more evidence, Qualify further before tuning, Pressure changed at similar duty, or Duty changed with little pressure response. A duty change of less than 0.5 percentage point is treated as effectively similar for this descriptive comparison. These labels, trends and suggestions describe observed evidence; they do not prescribe a tune change."
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-view.ts apps/web/src/pages/boost-analyzer-help.ts
          git commit -m "Interpret Boost operating-point evidence"
          git push origin HEAD:feature/boost-operating-suggestions
