name: Temporary Histogram surface wiring

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-wire-histogram-surface.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analysis/histogram-surface-v1
          fetch-depth: 0
      - name: Apply Histogram wiring patch
        run: |
          git show origin/main:scripts/tmp-wire-histogram-surface.py > /tmp/patch.py
          python /tmp/patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit Histogram wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/app-shell.ts
          git commit -m "Wire Histogram mode to Logger analysis context"
          git push origin HEAD:analysis/histogram-surface-v1
