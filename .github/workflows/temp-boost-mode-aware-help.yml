name: Temporary Boost mode-aware help
on:
  push:
    branches:
      - feature/boost-mode-aware-help
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-mode-aware-help
          fetch-depth: 0
      - name: Add control mode and help integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/boost-analyzer-view.ts')
          t = p.read_text()

          anchor = "import { analyzerScopeBounds, populateAnalyzerScopeSelect, selectedAnalyzerScope, type AnalyzerScope } from './analyzer-scope';\n"
          assert t.count(anchor) == 1
          t = t.replace(anchor, anchor + "import { ensureBoostAnalyzerHelp } from './boost-analyzer-help';\n", 1)

          old = "    <div class=\"boost-analyzer-banner\"><strong>Boost · Experimental</strong><span>Capability-driven analysis. Select the channels that represent measured pressure, target, RPM and wastegate duties in this log.</span></div>\n    <div class=\"boost-analyzer-controls\">\n      <label><span>Measured pressure</span><select class=\"boost-measured\"></select></label>\n      <label><span>Target pressure</span><select class=\"boost-target\"></select></label>"
          new = "    <div class=\"boost-analyzer-banner\"><strong>Boost · Experimental</strong><span>Analyze the physical pressure response to wastegate control. Closed Loop additionally enables Boost Target tracking metrics.</span></div>\n    <div class=\"boost-analyzer-controls\">\n      <label><span>Control mode</span><select class=\"boost-control-mode\"><option value=\"open-loop\">Open Loop</option><option value=\"closed-loop\">Closed Loop</option></select></label>\n      <label><span>Measured pressure</span><select class=\"boost-measured\"></select></label>\n      <label class=\"boost-closed-loop-only\"><span>Target pressure</span><select class=\"boost-target\"></select></label>"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "      <button type=\"button\" class=\"boost-refresh\">Analyze</button>\n    </div>\n    <details class=\"boost-analysis-options\">"
          new = "      <button type=\"button\" class=\"boost-refresh\">Analyze</button>\n    </div>\n    <div class=\"boost-analyzer-guidance\" hidden><strong data-boost-help=\"title\">What this setting does</strong><span data-boost-help=\"text\"></span></div>\n    <details class=\"boost-analysis-options boost-closed-loop-only\">"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "      <summary>Tracking / spool / steady-state</summary>"
          assert t.count(old) == 1
          t = t.replace(old, "      <summary>Closed-loop tracking / spool / steady-state</summary>", 1)

          old = "      <span>Target/RPM/wastegate duty channels are optional. Spool and steady-state detection require a target channel and explicit thresholds.</span>"
          assert t.count(old) == 1
          t = t.replace(old, "      <span>RPM and wastegate duty channels are optional but strongly recommended. Boost Target is only used in Closed Loop mode.</span>", 1)

          for label in ['Target mean','Mean error','Mean abs error','RMSE','Target attainment','Max overshoot','Max undershoot']:
              old = f'        <div><span>{label}</span>'
              new = f'        <div class="boost-closed-loop-only"><span>{label}</span>'
              assert t.count(old) == 1
              t = t.replace(old, new, 1)

          for text in ['Tracking valid','Tracking invalid','Tracking unavailable']:
              old = f'        <span>{text} '
              new = f'        <span class="boost-closed-loop-only">{text} '
              assert t.count(old) == 1
              t = t.replace(old, new, 1)

          old = '      <section class="boost-result-section">\n        <header><strong>Spool events</strong>'
          new = '      <section class="boost-result-section boost-closed-loop-only">\n        <header><strong>Target-relative spool events</strong>'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = '      <section class="boost-result-section">\n        <header><strong>Steady-state windows</strong>'
          new = '      <section class="boost-result-section boost-closed-loop-only">\n        <header><strong>Closed-loop steady-state windows</strong>'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  const measuredSelect = root.querySelector<HTMLSelectElement>('.boost-measured');\n"
          new = "  const modeSelect = root.querySelector<HTMLSelectElement>('.boost-control-mode');\n  const measuredSelect = root.querySelector<HTMLSelectElement>('.boost-measured');\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = "  if (!measuredSelect || !targetSelect || !rpmSelect || !upperSelect || !lowerSelect || !scopeSelect || !qualificationSelect || !refreshButton || !targetTolerance"
          new = "  if (!modeSelect || !measuredSelect || !targetSelect || !rpmSelect || !upperSelect || !lowerSelect || !scopeSelect || !qualificationSelect || !refreshButton || !targetTolerance"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          insert = "  const isClosedLoop = (): boolean => modeSelect.value === 'closed-loop';\n\n  const syncControlModeUi = (): void => {\n    const closedLoop = isClosedLoop();\n    for (const node of root.querySelectorAll<HTMLElement>('.boost-closed-loop-only')) node.hidden = !closedLoop;\n    targetSelect.disabled = !closedLoop;\n  };\n\n"
          anchor = "  const selectedScope = (): AnalyzerScope | undefined => selectedAnalyzerScope(scopeSelect, context);\n\n"
          assert t.count(anchor) == 1
          t = t.replace(anchor, insert + anchor, 1)

          old = "    const measuredId = measuredSelect.value || context.channels[0]?.id;\n    const targetId = targetSelect.value || undefined;"
          new = "    const closedLoop = isClosedLoop();\n    const measuredId = measuredSelect.value || context.channels[0]?.id;\n    const targetId = closedLoop ? (targetSelect.value || undefined) : undefined;"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    if (spoolEnabled.checked && target && spoolStartValue !== undefined && spoolTargetValue !== undefined) {"
          new = "    if (closedLoop && spoolEnabled.checked && target && spoolStartValue !== undefined && spoolTargetValue !== undefined) {"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = "    if (steadyEnabled.checked && target && steadyTargetRateValue !== undefined) {"
          new = "    if (closedLoop && steadyEnabled.checked && target && steadyTargetRateValue !== undefined) {"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "        ...(optionalNumber(targetTolerance) !== undefined ? { targetTolerance: optionalNumber(targetTolerance)! } : {}),"
          new = "        ...(closedLoop && optionalNumber(targetTolerance) !== undefined ? { targetTolerance: optionalNumber(targetTolerance)! } : {}),"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  for (const select of [measuredSelect, targetSelect, rpmSelect, upperSelect, lowerSelect, scopeSelect, qualificationSelect]) select.addEventListener('change', () => { void render(); });"
          new = "  modeSelect.addEventListener('change', () => { syncControlModeUi(); void render(); });\n  for (const select of [measuredSelect, targetSelect, rpmSelect, upperSelect, lowerSelect, scopeSelect, qualificationSelect]) select.addEventListener('change', () => { void render(); });"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  refreshButton.addEventListener('click', () => { void render(); });\n\n  return { element: root, setContext, refresh: () => { void render(); } };"
          new = "  refreshButton.addEventListener('click', () => { void render(); });\n  syncControlModeUi();\n  ensureBoostAnalyzerHelp(root);\n\n  return { element: root, setContext, refresh: () => { void render(); } };"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-view.ts
          git commit -m "Make Boost analysis control-mode aware"
          git push origin HEAD:feature/boost-mode-aware-help
