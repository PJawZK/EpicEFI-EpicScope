name: VE v50 table interaction performance patch

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile
    paths:
      - scripts/ve-v50-performance-hotpath.py
      - .github/workflows/ve-v50-performance-hotpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - run: python scripts/ve-v50-performance-hotpath.py
      - run: rm scripts/ve-v50-performance-hotpath.py .github/workflows/ve-v50-performance-hotpath.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reduce VE table interaction hot-path work"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
