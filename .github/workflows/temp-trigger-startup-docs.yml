name: Temporary Trigger Startup docs refresh
on:
  push:
    branches: [docs/trigger-startup-catalog]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh starter catalog docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/PREPOPULATED_WORKSPACES.md')
          s = p.read_text()
          old = """- **Fuel System** — Dual layout; RPM, fuel pressure, MAP, TPS, fuel-pressure delta, injector pulse width, injector duty, fuel-pump command, battery voltage and Lambda.\n\nPlanned generic starter families remain:\n- **Trigger / Sync** — RPM, sync state, sync-loss count/reason, trigger/crank error, cam state/phase, trigger runtime channels and battery voltage where available;\n- **Startup / Warmup** — RPM, coolant temp, intake-air temp, MAP, TPS, AFR/Lambda, target, warmup correction, after-start enrichment, injector pulse width, idle target and idle actuator command;\n- **Electrical** — battery voltage, RPM, injector pulse width/duty, ignition dwell, fuel-pump state, ECU/sensor supply voltage and relevant electrical fault/status channels where available;"""
          new = """- **Fuel System** — Dual layout; RPM, fuel pressure, MAP, TPS, fuel-pressure delta, injector pulse width, injector duty, fuel-pump command, battery voltage and Lambda;\n- **Trigger / Sync** — Dual layout; RPM, trigger sync state, phase synchronization, active trigger error, trigger error count, resync count, decoded engine phase and battery voltage;\n- **Startup / Warmup** — Dual layout; RPM, coolant temp, intake-air temp, battery voltage, engine cycles since start, cranking fuel, after-start correction, warmup correction, Lambda and idle target.\n\nPlanned generic starter families remain:\n- **Electrical** — battery voltage, RPM, injector pulse width/duty, ignition dwell, fuel-pump state, ECU/sensor supply voltage and relevant electrical fault/status channels where available;"""
          assert old in s, 'starter catalog docs anchor missing'
          p.write_text(s.replace(old, new, 1))
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PREPOPULATED_WORKSPACES.md
          git diff --cached --quiet && exit 1
          git commit -m "docs: add Trigger Sync and Startup Warmup starters"
          git push
