name: Apply 16 MiB comparison patch

on:
  push:
    branches:
      - perf/compare-16mib-after-validation-priority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/compare-16mib-after-validation-priority
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply 16 MiB page-size comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blob = Path('apps/web/src/adapters/blob-byte-source.ts')
          text = blob.read_text()
          text = text.replace('const CACHE_PAGE_SIZE = 32 * 1024 * 1024;', 'const CACHE_PAGE_SIZE = 16 * 1024 * 1024;')
          text = text.replace('the first ~64 MiB admitted stays pinned between sequential passes;', 'the first ~80 MiB admitted stays pinned between sequential passes;')
          text = text.replace('one 32 MiB rolling page preserves the boundary page for the next batch.', 'one 16 MiB rolling page preserves the boundary page for the next batch.')
          blob.write_text(text)

          test = Path('tests/web/blob-byte-source.test.ts')
          text = test.read_text()
          text = text.replace('const page = 32 * 1024 * 1024;', 'const page = 16 * 1024 * 1024;')
          text = text.replace('const total = 4 * page;', 'const total = 7 * page;')
          text = text.replace('// Fill the pinned 64 MiB prefix (pages 0-1).\n  for (let index = 0; index < 2; index += 1) {', '// Fill the pinned 80 MiB prefix (pages 0-4).\n  for (let index = 0; index < 5; index += 1) {')
          text = text.replace('expect(before.physicalReadCount).toBe(2);', 'expect(before.physicalReadCount).toBe(5);')
          text = text.replace('// First boundary read loads page 2 as the rolling page.\n  await source.read(2 * page - 1024, 2048);', '// First boundary read loads page 5 as the rolling page.\n  await source.read(5 * page - 1024, 2048);')
          text = text.replace('expect(afterFirstBoundary.physicalReadCount).toBe(3);', 'expect(afterFirstBoundary.physicalReadCount).toBe(6);')
          text = text.replace('// The next boundary read must reuse page 2 and only load page 3.\n  await source.read(3 * page - 1024, 2048);', '// The next boundary read must reuse page 5 and only load page 6.\n  await source.read(6 * page - 1024, 2048);')
          text = text.replace('expect(afterSecondBoundary.physicalReadCount).toBe(4);', 'expect(afterSecondBoundary.physicalReadCount).toBe(7);')
          text = text.replace('expect(runtime?.pageSizeBytes).toBe(32 * 1024 * 1024);', 'expect(runtime?.pageSizeBytes).toBe(16 * 1024 * 1024);')
          test.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/adapters/blob-byte-source.ts tests/web/blob-byte-source.test.ts
          git commit -m "Perf: compare 16 MiB Blob pages after validation priority"
          git push origin HEAD:perf/compare-16mib-after-validation-priority
