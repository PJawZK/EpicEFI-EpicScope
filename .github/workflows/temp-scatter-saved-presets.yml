name: Temporary Scatter saved preset validation

on:
  push:
    branches:
      - feat/scatter-saved-presets

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scatter-saved-presets
      - run: python .github/scripts/temp_scatter_saved_presets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-scatter-saved-presets.yml
          rm .github/scripts/temp_scatter_saved_presets.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'add saved Scatter setup presets'
            git push
          fi
