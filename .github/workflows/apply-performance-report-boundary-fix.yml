name: Apply performance report boundary fix

on:
  push:
    branches:
      - refactor/extract-performance-report-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply performance report boundary fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-performance-report-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/fix-performance-report-boundary.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/performance-diagnostics.ts apps/web/src/components/performance-diagnostics-report.ts
          git commit -m "Fix performance report extraction boundary"
          git push
