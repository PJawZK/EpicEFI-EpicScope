name: Temporary Fuel Rail and ETB starter transform
on:
  push:
    branches: [feat/epicefi-fuel-rail-etb-starters]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply specialized starter slice
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/state/semantic-channel-roles.ts')
          s = p.read_text()
          old = "  | 'transient.predictedMap'\n  | 'transient.mapPredictionActive'\n  | 'transient.wallFuelAmount';"
          new = """  | 'transient.predictedMap'\n  | 'transient.mapPredictionActive'\n  | 'transient.wallFuelAmount'\n  | 'fuel.highPressure'\n  | 'fuel.highPressureTarget'\n  | 'fuel.hpfpActive'\n  | 'fuel.hpfpValveState'\n  | 'fuel.hpfpPControl'\n  | 'fuel.hpfpIControl'\n  | 'etb.pedalPosition'\n  | 'etb.target'\n  | 'etb.error'\n  | 'etb.duty'\n  | 'etb.feedForward'\n  | 'etb.jamDetected';"""
          assert old in s, 'semantic role union anchor missing'
          s = s.replace(old, new, 1)
          old = """  'transient.wallFuelAmount': { id: 'transient.wallFuelAmount', displayName: 'Wall Fuel Amount', aliases: ['wallFuelAmount', 'Fuel: wall amount', 'Wall Fuel Amount', 'Fuel on the wall'], include: [/wall.*fuel.*amount/i, /fuel.*wall.*amount/i, /^fuel on the wall$/i], exclude: [/correction/i, /tau/i, /beta/i, /table/i, /config/i] },\n};"""
          new = """  'transient.wallFuelAmount': { id: 'transient.wallFuelAmount', displayName: 'Wall Fuel Amount', aliases: ['wallFuelAmount', 'Fuel: wall amount', 'Wall Fuel Amount', 'Fuel on the wall'], include: [/wall.*fuel.*amount/i, /fuel.*wall.*amount/i, /^fuel on the wall$/i], exclude: [/correction/i, /tau/i, /beta/i, /table/i, /config/i] },\n  'fuel.highPressure': { id: 'fuel.highPressure', displayName: 'High Fuel Pressure', aliases: ['highFuelPressure', 'Fuel pressure (high)', 'Fuel Pressure High', 'High Fuel Pressure'], include: [/(?:high.*fuel|fuel.*high).*pressure/i, /fuel.*pressure.*high/i], exclude: [/raw/i, /bank.*2/i, /high2/i, /target/i, /table/i, /config/i, /minimum/i, /maximum/i] },\n  'fuel.highPressureTarget': { id: 'fuel.highPressureTarget', displayName: 'High Fuel Pressure Target', aliases: ['m_pressureTarget_kPa', 'GDI: target pressure', 'HPFP Pressure Target', 'Fuel Rail Pressure Target'], include: [/(?:gdi|hpfp|fuel|rail).*target.*pressure/i, /pressure.*target.*(?:fuel|rail|hpfp)/i], exclude: [/table/i, /config/i, /decay/i, /reference/i, /minimum/i, /maximum/i] },\n  'fuel.hpfpActive': { id: 'fuel.hpfpActive', displayName: 'HPFP Active', aliases: ['isHpfpActive', 'GDI: HPFP Active', 'HPFP Active'], include: [/hpfp.*active/i], exclude: [/enable/i, /config/i, /table/i] },\n  'fuel.hpfpValveState': { id: 'fuel.hpfpValveState', displayName: 'HPFP Valve State', aliases: ['HpfpValveState', 'GDI: HPFP Valve state', 'HPFP Valve State'], include: [/hpfp.*valve.*state/i], exclude: [/pin/i, /mode/i, /config/i, /table/i] },\n  'fuel.hpfpPControl': { id: 'fuel.hpfpPControl', displayName: 'HPFP P Control', aliases: ['hpfp_p_control_percent', 'HPFP P Control', 'HPFP P Term'], include: [/hpfp.*(?:p.*control|p.*term)/i], exclude: [/pid.*factor/i, /config/i, /table/i] },\n  'fuel.hpfpIControl': { id: 'fuel.hpfpIControl', displayName: 'HPFP I Control', aliases: ['hpfp_i_control_percent', 'HPFP I Control', 'HPFP I Term'], include: [/hpfp.*(?:i.*control|i.*term)/i], exclude: [/pid.*factor/i, /min/i, /max/i, /config/i, /table/i] },\n  'etb.pedalPosition': { id: 'etb.pedalPosition', displayName: 'Pedal Position', aliases: ['throttlePedalPosition', 'Throttle pedal position', 'Accelerator Pedal', 'Pedal Position'], include: [/(?:throttle|accelerator).*pedal.*position/i, /^pedal.*position$/i], exclude: [/raw/i, /primary/i, /secondary/i, /target/i, /table/i, /config/i] },\n  'etb.target': { id: 'etb.target', displayName: 'ETB Target', aliases: ['etb1m_adjustedTarget', 'ETB: position target', 'ETB 1 target', 'ETB Target'], include: [/etb.*(?:position.*)?target/i], exclude: [/table/i, /bias/i, /min/i, /max/i, /config/i, /target.*table/i] },\n  'etb.error': { id: 'etb.error', displayName: 'ETB Error', aliases: ['etbStatus_error', 'ETB: position error', 'ETB 1 PID error', 'ETB Error'], include: [/etb.*(?:position.*|pid.*)?error/i], exclude: [/counter/i, /code/i, /timer/i, /threshold/i, /config/i] },\n  'etb.duty': { id: 'etb.duty', displayName: 'ETB Duty', aliases: ['etb1DutyCycle', 'ETB: Duty', 'ETB 1 duty', 'ETB Duty'], include: [/etb.*(?:duty|duty.*cycle)/i], exclude: [/test/i, /bias/i, /table/i, /config/i] },\n  'etb.feedForward': { id: 'etb.feedForward', displayName: 'ETB Feed Forward', aliases: ['etb1etbFeedForward', 'ETB Feed Forward', 'ETB Feedforward'], include: [/etb.*feed.*forward/i], exclude: [/table/i, /curve/i, /config/i] },\n  'etb.jamDetected': { id: 'etb.jamDetected', displayName: 'ETB Jam Detected', aliases: ['etb1jamDetected', 'ETB Jam Detected', 'ETB control fault/jam'], include: [/etb.*jam.*(?:detected|fault)/i, /jam.*detected/i], exclude: [/enable/i, /threshold/i, /timeout/i, /config/i] },\n};"""
          assert old in s, 'semantic role definitions anchor missing'
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/state/built-in-workspace-templates.ts')
          s = p.read_text()
          old = """export const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,"""
          inserted = """export const EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'epicefi-fuel-rail-diagnostics-dual',\n  name: 'EpicEFI · Fuel Rail Diagnostics',\n  description: 'EpicEFI high-pressure fuel rail and HPFP control diagnostics.',\n  tier: 'epicefi',\n  availability: { allOfRoleIds: ['fuel.highPressure', 'fuel.highPressureTarget', 'fuel.hpfpActive', 'fuel.hpfpValveState'] },\n  layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'fuel.highPressure', requirement: 'required' },\n      { roleId: 'fuel.highPressureTarget', requirement: 'required' },\n      { roleId: 'fuel.pressureDelta', requirement: 'preferred' },\n      { roleId: 'fuel.injectorPulseWidth', requirement: 'preferred' },\n      { roleId: 'fuel.lambda', requirement: 'optional' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'fuel.hpfpActive', requirement: 'required' },\n      { roleId: 'fuel.hpfpValveState', requirement: 'required' },\n      { roleId: 'fuel.hpfpPControl', requirement: 'preferred' },\n      { roleId: 'fuel.hpfpIControl', requirement: 'preferred' },\n      { roleId: 'electrical.batteryVoltage', requirement: 'optional' },\n    ] },\n  ],\n};\n\nexport const EPICEFI_ETB_CONTROL_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'epicefi-etb-control-dual',\n  name: 'EpicEFI · ETB Control',\n  description: 'EpicEFI electronic-throttle demand, tracking and motor-control diagnostics.',\n  tier: 'epicefi',\n  availability: { allOfRoleIds: ['etb.pedalPosition', 'etb.target', 'engine.throttle.position', 'etb.error', 'etb.duty', 'etb.feedForward'] },\n  layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'preferred' },\n      { roleId: 'etb.pedalPosition', requirement: 'required' },\n      { roleId: 'etb.target', requirement: 'required' },\n      { roleId: 'engine.throttle.position', requirement: 'required' },\n      { roleId: 'etb.error', requirement: 'required' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'etb.duty', requirement: 'required' },\n      { roleId: 'etb.feedForward', requirement: 'required' },\n      { roleId: 'etb.jamDetected', requirement: 'optional' },\n      { roleId: 'electrical.batteryVoltage', requirement: 'preferred' },\n    ] },\n  ],\n};\n\nexport const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,"""
          assert old in s, 'starter insertion anchor missing'
          s = s.replace(old, inserted, 1)
          old = """  VEHICLE_DRIVELINE_DUAL_WORKSPACE,\n  EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE,\n]);"""
          new = """  VEHICLE_DRIVELINE_DUAL_WORKSPACE,\n  EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE,\n  EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE,\n  EPICEFI_ETB_CONTROL_DUAL_WORKSPACE,\n]);"""
          assert old in s, 'starter catalog tail anchor missing'
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/built-in-workspace-templates.test.ts')
          s = p.read_text()
          old = """      'EpicEFI · MAP Predict + Wall Wetting',\n    ]);"""
          new = """      'EpicEFI · MAP Predict + Wall Wetting', 'EpicEFI · Fuel Rail Diagnostics', 'EpicEFI · ETB Control',\n    ]);"""
          assert old in s, 'menu order test anchor missing'
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/epicefi-fuel-rail-etb-starters.test.ts')
          assert not p.exists(), 'focused starter test already exists'
          p.write_text("""import { describe, expect, it } from 'vitest';\nimport type { ChannelDefinition } from '../../core/log-model/log-types';\nimport {\n  EPICEFI_ETB_CONTROL_DUAL_WORKSPACE,\n  EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE,\n  availableStarterWorkspaceTemplates,\n  resolveStarterWorkspaceTemplate,\n  starterWorkspaceAvailable,\n} from '../../apps/web/src/state/built-in-workspace-templates';\nimport { resolveSemanticChannelRole } from '../../apps/web/src/state/semantic-channel-roles';\n\nfunction channel(id: string, sourceName = id, displayName = sourceName): ChannelDefinition { return { id, sourceName, displayName, valueType: 'number' }; }\n\nconst fuelRailChannels = [\n  channel('ini:RPMValue','RPMValue','RPM'), channel('ini:highFuelPressure','highFuelPressure','Fuel pressure (high)'), channel('ini:m_pressureTarget_kPa','m_pressureTarget_kPa','GDI: target pressure'),\n  channel('ini:pressureDelta','pressureDelta','Fuel: Injector pressure delta'), channel('ini:actualLastInjection','actualLastInjection','Fuel: Last inj pulse width'), channel('ini:lambdaValue','lambdaValue','Lambda'),\n  channel('ini:isHpfpActive','isHpfpActive','GDI: HPFP Active'), channel('ini:HpfpValveState','HpfpValveState','GDI: HPFP Valve state'), channel('ini:hpfp_p_control_percent','hpfp_p_control_percent','hpfp_p_control_percent'), channel('ini:hpfp_i_control_percent','hpfp_i_control_percent','hpfp_i_control_percent'), channel('ini:VBatt','VBatt','Battery Voltage'),\n];\n\nconst etbChannels = [\n  channel('ini:RPMValue','RPMValue','RPM'), channel('ini:throttlePedalPosition','throttlePedalPosition','Throttle pedal position'), channel('ini:etb1m_adjustedTarget','etb1m_adjustedTarget','ETB: position target'),\n  channel('ini:TPSValue','TPSValue','TPS'), channel('ini:etbStatus_error','etbStatus_error','ETB: position error'), channel('ini:etb1DutyCycle','etb1DutyCycle','ETB: Duty'), channel('ini:etb1etbFeedForward','etb1etbFeedForward','ETB Feed Forward'), channel('ini:etb1jamDetected','etb1jamDetected','ETB Jam Detected'), channel('ini:VBatt','VBatt','Battery Voltage'),\n];\n\ndescribe('EpicEFI Fuel Rail Diagnostics and ETB Control starters', () => {\n  it('gates Fuel Rail Diagnostics on the defining HPFP runtime bundle', () => {\n    expect(starterWorkspaceAvailable(EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE, fuelRailChannels)).toBe(true);\n    expect(starterWorkspaceAvailable(EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE, fuelRailChannels.filter((c)=>c.sourceName!=='HpfpValveState'))).toBe(false);\n  });\n  it('resolves Fuel Rail Diagnostics onto canonical EpicEFI runtime identities', () => {\n    const r=resolveStarterWorkspaceTemplate(EPICEFI_FUEL_RAIL_DIAGNOSTICS_DUAL_WORKSPACE, fuelRailChannels);\n    expect(r.panes[0]?.channelIds).toEqual(['ini:RPMValue','ini:highFuelPressure','ini:m_pressureTarget_kPa','ini:pressureDelta','ini:actualLastInjection','ini:lambdaValue']);\n    expect(r.panes[1]?.channelIds).toEqual(['ini:isHpfpActive','ini:HpfpValveState','ini:hpfp_p_control_percent','ini:hpfp_i_control_percent','ini:VBatt']);\n    expect(r.unresolvedRequiredRoleIds).toEqual([]);\n  });\n  it('gates ETB Control on demand, target, tracking and motor-control telemetry', () => {\n    expect(starterWorkspaceAvailable(EPICEFI_ETB_CONTROL_DUAL_WORKSPACE, etbChannels)).toBe(true);\n    expect(starterWorkspaceAvailable(EPICEFI_ETB_CONTROL_DUAL_WORKSPACE, etbChannels.filter((c)=>c.sourceName!=='etb1etbFeedForward'))).toBe(false);\n  });\n  it('resolves ETB Control onto canonical EpicEFI runtime identities', () => {\n    const r=resolveStarterWorkspaceTemplate(EPICEFI_ETB_CONTROL_DUAL_WORKSPACE, etbChannels);\n    expect(r.panes[0]?.channelIds).toEqual(['ini:RPMValue','ini:throttlePedalPosition','ini:etb1m_adjustedTarget','ini:TPSValue','ini:etbStatus_error']);\n    expect(r.panes[1]?.channelIds).toEqual(['ini:etb1DutyCycle','ini:etb1etbFeedForward','ini:etb1jamDetected','ini:VBatt']);\n    expect(r.unresolvedRequiredRoleIds).toEqual([]);\n  });\n  it('does not confuse HPFP/ETB configuration values with runtime capability channels', () => {\n    const configOnly=[channel('hpfpTarget','hpfpTarget','HPFP target table'),channel('hpfpPidP','hpfpPidP','HPFP PID P'),channel('etbTestDuty','etbTestDuty','ETB test duty'),channel('etbJamDetectThreshold','etbJamDetectThreshold','Jam detection error max'),channel('etbBiasValues','etbBiasValues','ETB bias curve')];\n    expect(resolveSemanticChannelRole('fuel.highPressureTarget',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('fuel.hpfpPControl',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('etb.duty',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('etb.error',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('etb.feedForward',configOnly).channel).toBeUndefined();\n  });\n  it('exposes both specialized starters when the active schema contains both capability bundles', () => {\n    const names=availableStarterWorkspaceTemplates([...fuelRailChannels,...etbChannels]).map((t)=>t.name);\n    expect(names).toContain('EpicEFI · Fuel Rail Diagnostics');\n    expect(names).toContain('EpicEFI · ETB Control');\n  });\n});\n""")

          p = Path('docs/PREPOPULATED_WORKSPACES.md')
          s = p.read_text()
          old = """Implemented specialized starter:\n\n- **EpicEFI · MAP Predict + Wall Wetting** — Dual layout. Pane 1: RPM, TPS, TPS change, live MAP, predicted/fallback MAP, effective MAP and prediction-active state. Pane 2: Lambda, injector pulse width, TPS AE fuel, wall-fuel amount and wall-fuel correction. The menu exposes it only when predicted MAP, effective MAP, prediction-active state, wall-fuel amount and wall-fuel correction all resolve.\n\nPlanned specialized candidates remain:\n\n- **EpicEFI · Dual Chamber Boost**;\n- **EpicEFI · ETB Control**;\n- **EpicEFI · Fuel Rail Diagnostics**;\n- **EpicEFI · Trigger + Sync Detailed**;"""
          new = """Implemented specialized starters:\n\n- **EpicEFI · MAP Predict + Wall Wetting** — Dual layout. Pane 1: RPM, TPS, TPS change, live MAP, predicted/fallback MAP, effective MAP and prediction-active state. Pane 2: Lambda, injector pulse width, TPS AE fuel, wall-fuel amount and wall-fuel correction. The menu exposes it only when predicted MAP, effective MAP, prediction-active state, wall-fuel amount and wall-fuel correction all resolve.\n- **EpicEFI · Fuel Rail Diagnostics** — Dual layout. Pane 1 follows actual high rail pressure against HPFP target with RPM, injector pressure delta, injector pulse width and Lambda context. Pane 2 shows HPFP active/valve state plus P/I control contributions and battery voltage. It is offered only when actual high pressure, target pressure, HPFP-active state and valve state all resolve.\n- **EpicEFI · ETB Control** — Dual layout. Pane 1 compares pedal demand, ETB target, actual TPS and position error with RPM context. Pane 2 shows motor duty, feed-forward, jam state and battery voltage. It is offered only when pedal, target, actual TPS, ETB error, duty and feed-forward all resolve.\n\nPlanned specialized candidates remain:\n\n- **EpicEFI · Dual Chamber Boost**;\n- **EpicEFI · Trigger + Sync Detailed**;"""
          assert old in s, 'docs specialized section anchor missing'
          p.write_text(s.replace(old, new, 1))
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/built-in-workspace-templates.test.ts tests/web/epicefi-fuel-rail-etb-starters.test.ts docs/PREPOPULATED_WORKSPACES.md
          git commit -m 'feat: add Fuel Rail and ETB capability starters'
          git push
