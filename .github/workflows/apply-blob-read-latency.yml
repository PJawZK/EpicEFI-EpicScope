name: Apply Blob read latency instrumentation

on:
  push:
    branches:
      - diag/blob-read-latency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/blob-read-latency
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply instrumentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blob = Path('apps/web/src/adapters/blob-byte-source.ts')
          text = blob.read_text()
          text = text.replace(
              "const PINNED_CACHE_LIMIT_BYTES = CACHE_LIMIT_BYTES - CACHE_PAGE_SIZE;\n",
              "const PINNED_CACHE_LIMIT_BYTES = CACHE_LIMIT_BYTES - CACHE_PAGE_SIZE;\nconst MAX_PHYSICAL_READ_DIAGNOSTICS = 512;\n\nexport interface BlobPhysicalReadDiagnostic {\n  readonly offset: number;\n  readonly bytes: number;\n  readonly durationMs: number;\n}\n\nexport interface BlobByteSourceRuntimeDiagnostics {\n  readonly scope: 'main-thread-source-lifetime';\n  readonly pageSizeBytes: number;\n  readonly cacheLimitBytes: number;\n  readonly pinnedCacheLimitBytes: number;\n  readonly physicalReadCount: number;\n  readonly physicalReadMs: number;\n  readonly physicalReadMinMs: number;\n  readonly physicalReadAverageMs: number;\n  readonly physicalReadMaxMs: number;\n  readonly slowestReads: readonly BlobPhysicalReadDiagnostic[];\n}\n\nlet latestBlobByteSource: BlobByteSource | undefined;\n\nexport function latestBlobByteSourceRuntimeDiagnostics(): BlobByteSourceRuntimeDiagnostics | undefined {\n  return latestBlobByteSource?.runtimeDiagnostics();\n}\n",
          )
          text = text.replace(
              "  private physicalReadMsValue = 0;\n",
              "  private physicalReadMsValue = 0;\n  private readonly physicalReadDiagnostics: BlobPhysicalReadDiagnostic[] = [];\n",
          )
          text = text.replace(
              "    this.preferredReadAlignmentBytes = this.size > CACHE_LIMIT_BYTES\n      ? CACHE_PAGE_SIZE\n      : undefined;\n",
              "    this.preferredReadAlignmentBytes = this.size > CACHE_LIMIT_BYTES\n      ? CACHE_PAGE_SIZE\n      : undefined;\n    latestBlobByteSource = this;\n",
          )
          text = text.replace(
              "  private async loadWholeBuffer(): Promise<Uint8Array> {\n",
              "  private recordPhysicalRead(offset: number, bytes: number, durationMs: number): void {\n    this.physicalReadDiagnostics.push({ offset, bytes, durationMs });\n    if (this.physicalReadDiagnostics.length > MAX_PHYSICAL_READ_DIAGNOSTICS) {\n      this.physicalReadDiagnostics.shift();\n    }\n  }\n\n  private async loadWholeBuffer(): Promise<Uint8Array> {\n",
          )
          text = text.replace(
              "        this.physicalReadMsValue += (globalThis.performance?.now() ?? Date.now()) - started;\n        const bytes = new Uint8Array(buffer);\n",
              "        const durationMs = (globalThis.performance?.now() ?? Date.now()) - started;\n        this.physicalReadMsValue += durationMs;\n        this.recordPhysicalRead(0, buffer.byteLength, durationMs);\n        const bytes = new Uint8Array(buffer);\n",
          )
          text = text.replace(
              "    this.physicalReadMsValue += (globalThis.performance?.now() ?? Date.now()) - readStarted;\n    const page: CachedPage = {\n",
              "    const durationMs = (globalThis.performance?.now() ?? Date.now()) - readStarted;\n    this.physicalReadMsValue += durationMs;\n    this.recordPhysicalRead(start, length, durationMs);\n    const page: CachedPage = {\n",
          )
          text = text.replace(
              "  public stats(): BlobByteSourceStats {\n",
              "  public runtimeDiagnostics(): BlobByteSourceRuntimeDiagnostics {\n    const durations = this.physicalReadDiagnostics.map((read) => read.durationMs);\n    const count = durations.length;\n    const total = durations.reduce((sum, duration) => sum + duration, 0);\n    const slowestReads = [...this.physicalReadDiagnostics]\n      .sort((left, right) => right.durationMs - left.durationMs)\n      .slice(0, 5);\n    return {\n      scope: 'main-thread-source-lifetime',\n      pageSizeBytes: CACHE_PAGE_SIZE,\n      cacheLimitBytes: CACHE_LIMIT_BYTES,\n      pinnedCacheLimitBytes: PINNED_CACHE_LIMIT_BYTES,\n      physicalReadCount: count,\n      physicalReadMs: total,\n      physicalReadMinMs: count > 0 ? Math.min(...durations) : 0,\n      physicalReadAverageMs: count > 0 ? total / count : 0,\n      physicalReadMaxMs: count > 0 ? Math.max(...durations) : 0,\n      slowestReads,\n    };\n  }\n\n  public stats(): BlobByteSourceStats {\n",
          )
          blob.write_text(text)

          perf = Path('apps/web/src/components/performance-diagnostics.ts')
          text = perf.read_text()
          text = text.replace(
              "} from '../../../../core/diagnostics/channel-decode-performance';\n",
              "} from '../../../../core/diagnostics/channel-decode-performance';\nimport { latestBlobByteSourceRuntimeDiagnostics } from '../adapters/blob-byte-source';\n",
          )
          text = text.replace(
              "    const lines: string[] = ['EpicScope performance diagnostics'];\n    const latestLoad = loadRuns[loadRuns.length - 1];\n",
              "    const lines: string[] = ['EpicScope performance diagnostics'];\n    const blobRuntime = latestBlobByteSourceRuntimeDiagnostics();\n    if (blobRuntime) {\n      lines.push(\n        '',\n        '[Blob source runtime]',\n        `scope=${blobRuntime.scope}`,\n        `pageSizeBytes=${blobRuntime.pageSizeBytes}`,\n        `cacheLimitBytes=${blobRuntime.cacheLimitBytes}`,\n        `pinnedCacheLimitBytes=${blobRuntime.pinnedCacheLimitBytes}`,\n        `physicalReads=${blobRuntime.physicalReadCount}`,\n        `physicalReadMs=${blobRuntime.physicalReadMs.toFixed(2)} ms`,\n        `physicalReadMinMs=${blobRuntime.physicalReadMinMs.toFixed(2)} ms`,\n        `physicalReadAverageMs=${blobRuntime.physicalReadAverageMs.toFixed(2)} ms`,\n        `physicalReadMaxMs=${blobRuntime.physicalReadMaxMs.toFixed(2)} ms`,\n      );\n      blobRuntime.slowestReads.forEach((read, index) => {\n        lines.push(\n          `slowRead${index + 1}=offset:${read.offset};bytes:${read.bytes};ms:${read.durationMs.toFixed(2)}`\n        );\n      });\n    }\n    const latestLoad = loadRuns[loadRuns.length - 1];\n",
          )
          perf.write_text(text)

          test = Path('tests/web/blob-byte-source.test.ts')
          text = test.read_text()
          text = text.replace(
              "import { BlobByteSource } from '../../apps/web/src/adapters/blob-byte-source';\n",
              "import {\n  BlobByteSource,\n  latestBlobByteSourceRuntimeDiagnostics,\n} from '../../apps/web/src/adapters/blob-byte-source';\n",
          )
          text = text.replace(
              "  expect(afterSecondBoundary.cacheBytes).toBeLessThanOrEqual(96 * 1024 * 1024);\n});\n",
              "  expect(afterSecondBoundary.cacheBytes).toBeLessThanOrEqual(96 * 1024 * 1024);\n\n  const runtime = latestBlobByteSourceRuntimeDiagnostics();\n  expect(runtime?.pageSizeBytes).toBe(32 * 1024 * 1024);\n  expect(runtime?.cacheLimitBytes).toBe(96 * 1024 * 1024);\n  expect(runtime?.physicalReadCount).toBe(afterSecondBoundary.physicalReadCount);\n  expect(runtime?.physicalReadAverageMs).toBeGreaterThanOrEqual(0);\n  expect(runtime?.physicalReadMaxMs).toBeGreaterThanOrEqual(runtime?.physicalReadMinMs ?? 0);\n  expect(runtime?.slowestReads.length).toBeGreaterThan(0);\n});\n",
          )
          test.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/adapters/blob-byte-source.ts apps/web/src/components/performance-diagnostics.ts tests/web/blob-byte-source.test.ts
          git commit -m "Diag: capture Blob read latency distribution"
          git push origin HEAD:diag/blob-read-latency
