name: Low spec wide direct full patch
on:
  push:
    branches:
      - perf/low-spec-wide-direct-full
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/low-spec-wide-direct-full
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/patch_low_spec_wide_direct_full.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: rm scripts/patch_low_spec_wide_direct_full.py .github/workflows/apply-low-spec-wide-direct-full.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts scripts/patch_low_spec_wide_direct_full.py .github/workflows/apply-low-spec-wide-direct-full.yml
          git commit -m "Perf: load wide low-spec channel selections directly"
          git push origin HEAD:perf/low-spec-wide-direct-full
