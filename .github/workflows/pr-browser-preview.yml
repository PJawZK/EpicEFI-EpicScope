name: Deploy PR Browser Preview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to preview
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: epicscope-browser-preview-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  # issue_comment starts a workflow run for every PR comment. Those non-/preview
  # runs are skipped by the job condition below, but workflow-level concurrency
  # is evaluated before jobs, so they must not cancel a real preview in flight.
  cancel-in-progress: >-
    ${{ github.event_name == 'workflow_dispatch' ||
        (github.event.issue.pull_request && github.event.comment.body == '/preview') }}

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.body == '/preview')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
      preview_url: ${{ steps.publish.outputs.preview_url }}
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.eventName === 'issue_comment'
              ? context.issue.number
              : Number('${{ inputs.pr_number }}');
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('A valid pull request number is required.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== expectedRepo) {
              core.setFailed('Browser previews are limited to same-repository pull requests.');
              return;
            }
            core.setOutput('number', String(prNumber));
            core.setOutput('sha', pr.head.sha);

      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: preview-src

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Validate and build isolated preview
        working-directory: preview-src
        env:
          VITE_EPICSCOPE_BUILD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          # Relative asset URLs keep the build independent of the production
          # GitHub Pages path and allow it to be hosted from an isolated origin.
          npm run build -- --base "./"

      - name: Verify relative preview asset paths
        working-directory: preview-src
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '/EpicEFI-EpicScope/' dist/web/index.html; then
            echo 'Preview build still contains the production Pages base path.'
            cat dist/web/index.html
            exit 1
          fi
          if ! grep -Eq '(\./)?assets/' dist/web/index.html; then
            echo 'Preview build does not reference relative asset paths.'
            cat dist/web/index.html
            exit 1
          fi

      - name: Publish to isolated browser-preview branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --branch browser-previews --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview-host
          cd preview-host
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch was bootstrapped from main. Convert it once into a
          # dedicated static-preview store, then preserve other PR previews.
          if [ ! -f .epicscope-browser-preview-root ]; then
            git rm -rf .
            touch .epicscope-browser-preview-root
          fi

          preview_dir="pr-${PR_NUMBER}"
          rm -rf "$preview_dir"
          mkdir -p "$preview_dir"
          cp -a ../preview-src/dist/web/. "$preview_dir/"
          cat > "$preview_dir/preview-meta.json" <<EOF
          {
            "pullRequest": ${PR_NUMBER},
            "headSha": "${PR_SHA}",
            "isolatedOrigin": true
          }
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo 'Preview content is unchanged.'
          else
            git commit -m "preview: PR ${PR_NUMBER} at ${PR_SHA}"
            git push origin browser-previews
          fi

          preview_url="https://raw.githack.com/${GITHUB_REPOSITORY}/browser-previews/${preview_dir}/index.html"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Comment isolated preview link
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: `Isolated browser preview published: ${process.env.PREVIEW_URL}\n\nPreview SHA: \`${{ steps.pr.outputs.sha }}\`\n\nThis preview is served from a different origin than production GitHub Pages and does not redeploy the production site.`
            });
