name: Deploy PR Browser Preview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to preview
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.body == '/preview')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.eventName === 'issue_comment'
              ? context.issue.number
              : Number('${{ inputs.pr_number }}');
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('A valid pull request number is required.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== expectedRepo) {
              core.setFailed('Browser previews are limited to same-repository pull requests.');
              return;
            }
            core.setOutput('number', String(prNumber));
            core.setOutput('sha', pr.head.sha);

      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: preview-src

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            main-src/package-lock.json
            preview-src/package-lock.json

      - name: Build production root
        working-directory: main-src
        env:
          VITE_EPICSCOPE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Validate and build PR preview
        working-directory: preview-src
        env:
          VITE_EPICSCOPE_BUILD_SHA: ${{ steps.pr.outputs.sha }}
          EPICSCOPE_BASE_PATH: /EpicEFI-EpicScope/previews/pr-${{ steps.pr.outputs.number }}/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          preview_dir="deploy/previews/pr-${{ steps.pr.outputs.number }}"
          mkdir -p "$preview_dir"
          cp -a main-src/dist/web/. deploy/
          cp -a preview-src/dist/web/. "$preview_dir/"
          cat > "$preview_dir/preview-meta.json" <<EOF
          {
            "pullRequest": ${{ steps.pr.outputs.number }},
            "headSha": "${{ steps.pr.outputs.sha }}"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

  deploy:
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ needs.build.outputs.pr_number }}/
    steps:
      - name: Deploy production + PR preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview link
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ needs.build.outputs.pr_number }}/
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.build.outputs.pr_number }}'),
              body: `Browser preview deployed: ${process.env.PREVIEW_URL}\n\nPreview SHA: \`${{ needs.build.outputs.pr_sha }}\`\n\nThe production root remains built from \`main\`; only the preview subpath contains the PR build.`
            });
