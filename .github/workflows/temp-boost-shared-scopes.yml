name: Temporary Boost shared scopes
on:
  push:
    branches:
      - refactor/boost-shared-scopes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/boost-shared-scopes
          fetch-depth: 0
      - name: Share Boost Analyzer scopes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/boost-analyzer-view.ts')
          t = p.read_text()

          old = "import type { LoggerAnalysisContext, LoggerAnalysisTraceContext } from './logger-page';\n"
          new = "import type { LoggerAnalysisContext, LoggerAnalysisTraceContext } from './logger-page';\nimport { analyzerScopeBounds, populateAnalyzerScopeSelect, selectedAnalyzerScope, type AnalyzerScope } from './analyzer-scope';\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          start = t.index("  const selectedScope = ():")
          end = t.index("  const addOptionalTraceOptions", start)
          replacement = (
              "  const selectedScope = (): AnalyzerScope | undefined => selectedAnalyzerScope(scopeSelect, context);\n\n"
          )
          t = t[:start] + replacement + t[end:]

          start = t.index("  const fillScope = (preferred: string): void => {")
          end = t.index("  const render = async (): Promise<void> => {", start)
          replacement = (
              "  const fillScope = (preferred: string): void => {\n"
              "    populateAnalyzerScopeSelect(scopeSelect, context, preferred);\n"
              "  };\n\n"
          )
          t = t[:start] + replacement + t[end:]

          old = (
              "    const startMs = Math.min(scope.startMs, scope.endMs);\n"
              "    const endMs = Math.max(scope.startMs, scope.endMs);\n"
              "    const loaded = await context.loadTraces([measuredId, targetId, rpmId, upperId, lowerId].filter((id): id is string => id !== undefined), startMs, endMs);\n"
          )
          new = (
              "    const bounds = analyzerScopeBounds(scope);\n"
              "    const startMs = bounds.startMs;\n"
              "    const endMs = bounds.endMs;\n"
              "    const loaded = await context.loadTraces(\n"
              "      [measuredId, targetId, rpmId, upperId, lowerId].filter((id): id is string => id !== undefined),\n"
              "      startMs,\n"
              "      endMs,\n"
              "    );\n"
          )
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = (
              "    const scoped = qualifyNumericSamples({\n"
              "      referenceChannelId: measured.channel.id,\n"
              "      channels,\n"
              "      conditions: [],\n"
              "      timeRange: { startMs, endMs },\n"
              "    });\n"
              "    const selectedTraces = [measured, target, rpm, upper, lower].filter((trace): trace is LoggerAnalysisTraceContext => trace !== undefined);\n"
              "    const complete = scoped.complete && selectedTraces.every((trace) => trace.complete || numericRangeCoversTime(trace.range, startMs, endMs));\n"
          )
          new = (
              "    const scoped = qualifyNumericSamples({\n"
              "      referenceChannelId: measured.channel.id,\n"
              "      channels,\n"
              "      conditions: [],\n"
              "      ...(scope.kind === 'range' && startMs !== undefined && endMs !== undefined ? { timeRange: { startMs, endMs } } : {}),\n"
              "    });\n"
              "    const selectedTraces = [measured, target, rpm, upper, lower].filter((trace): trace is LoggerAnalysisTraceContext => trace !== undefined);\n"
              "    const complete = scoped.complete && selectedTraces.every((trace) =>\n"
              "      trace.complete || (startMs !== undefined && endMs !== undefined && numericRangeCoversTime(trace.range, startMs, endMs)),\n"
              "    );\n"
          )
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    field('scope').textContent = `${scope.label} · ${((endMs - startMs) / 1000).toFixed(3)} s`;\n"
          new = "    field('scope').textContent = scope.kind === 'full'\n      ? `${scope.label} · entire source`\n      : `${scope.label} · ${(((endMs ?? 0) - (startMs ?? 0)) / 1000).toFixed(3)} s`;\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-view.ts
          git commit -m "Use shared Analyzer scopes in Boost"
          git push origin HEAD:refactor/boost-shared-scopes
