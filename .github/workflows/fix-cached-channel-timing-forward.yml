name: Fix cached-channel timing forward

on:
  push:
    branches:
      - perf/first-channel-read-breakdown-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/first-channel-read-breakdown-v1
      - run: python tools/fix-cached-channel-timing-forward.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts
          git commit -m "Fix cached-channel timing forwarding"
          git push origin HEAD:perf/first-channel-read-breakdown-v1
