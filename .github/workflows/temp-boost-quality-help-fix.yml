name: Temporary Boost quality help fix
on:
  push:
    branches:
      - feature/boost-operating-quality
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-operating-quality
          fetch-depth: 0
      - name: Consolidate operating-point help
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/boost-analyzer-help.ts')
          t = p.read_text()
          old = "  [/^Build operating points$/i, { title: 'Build RPM × TPS/load operating points · Open Loop', text: 'Groups qualified samples into user-defined RPM and TPS/load bins, then summarizes the pressure and wastegate duty actually seen in each region. The intended result is a practical duty-to-pressure map: compare like-for-like operating regions instead of relying on whole-log averages.' }],\n"
          new = "  [/^Build operating points$/i, { title: 'Build RPM × TPS/load operating points · Open Loop', text: 'Groups qualified samples into user-defined RPM and TPS/load bins, then summarizes the pressure and wastegate duty actually seen in each region. The table also rates Evidence from sample count and Variation from pressure SD divided by absolute mean pressure: up to 3% is Stable, 3–8% Variable, and above 8% Mixed. Mixed bins often combine spool, throttle movement, gear/load changes or other non-comparable samples. The intended result is a practical duty-to-pressure map with an immediate indication of which regions are trustworthy enough to compare. These labels describe evidence quality; they do not prescribe a tune change.' }],\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          duplicate = "  [/^Build operating points$/i, { title: 'Operating-point quality assessment', text: 'Each shown operating point also receives Evidence, Variation and Assessment labels. Evidence is based on how far the sample count exceeds your Minimum samples / bin threshold. Variation uses pressure standard deviation divided by absolute mean pressure, so the heuristic remains unit-independent: up to 3% is Stable, 3–8% Variable, and above 8% Mixed. A Mixed result often means spool, throttle movement, gear/load changes or otherwise non-comparable samples are being combined. These labels describe evidence quality; they do not prescribe a tune change.' }],\n"
          assert t.count(duplicate) == 1
          t = t.replace(duplicate, '', 1)
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-help.ts
          git commit -m "Consolidate Boost operating-point help"
          git push origin HEAD:feature/boost-operating-quality
