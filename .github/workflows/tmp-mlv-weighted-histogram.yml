name: Temporary MLV weighted histogram integration

on:
  push:
    branches:
      - histogram/mlv-weighted-average-v1
    paths:
      - .github/workflows/tmp-mlv-weighted-histogram.yml
      - scripts/tmp-mlv-weighted-histogram.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: histogram/mlv-weighted-average-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: python3 scripts/tmp-mlv-weighted-histogram.py
      - run: rm -f scripts/tmp-mlv-weighted-histogram.py .github/workflows/tmp-mlv-weighted-histogram.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add experimental MLV-style weighted histogram mean"
          git push origin HEAD:histogram/mlv-weighted-average-v1
