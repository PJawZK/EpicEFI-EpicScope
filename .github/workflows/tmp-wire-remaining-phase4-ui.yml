name: Temporary remaining Phase 4 UI integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-wire-remaining-phase4-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4/remaining-analyzers-ui-v1
          fetch-depth: 0
      - name: Apply Analyzer integration
        run: |
          git show origin/main:scripts/tmp-wire-remaining-phase4-ui.py > /tmp/patch.py
          python /tmp/patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/analyzer-page.ts apps/web/src/main.ts
          git commit -m "Activate remaining Experimental analyzers"
          git push origin HEAD:phase4/remaining-analyzers-ui-v1
