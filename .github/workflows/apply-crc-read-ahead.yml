name: Apply CRC validation read-ahead

on:
  push:
    branches:
      - perf/crc-validation-read-ahead

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/crc-validation-read-ahead
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply CRC read-ahead patch
        run: echo '' | base64 -d | python
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/parsers/mlg/mlg-records.ts
          git commit -m "Perf: read ahead during CRC validation"
          git push origin HEAD:perf/crc-validation-read-ahead
