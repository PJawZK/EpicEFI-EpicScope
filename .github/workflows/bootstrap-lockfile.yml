name: Bootstrap npm lockfile

on:
  push:
    branches:
      - phase1/web-boot

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: phase1/web-boot

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate npm lockfile"
          git push origin HEAD:phase1/web-boot
