name: VE v50 reconcile Logger scope handoff

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Logger scope reconciliation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Apply reconciliation patch
        run: python scripts/ve-v50-reconcile-logger-range.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-reconcile-logger-range.yml scripts/ve-v50-reconcile-logger-range.py
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/app-shell.ts apps/web/src/pages/ve-analyzer-v50-presentation.ts apps/web/src/styles/ve-analyzer-v50-port.css tests/web/logger-analysis-context.browser.mjs tests/web/ve-shared-table-interaction.browser.mjs
          git commit -m "Add authoritative VE scope handoff to Logger [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
