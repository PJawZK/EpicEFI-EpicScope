name: Low spec initial activation patch

on:
  push:
    branches:
      - perf/low-spec-initial-activation-cap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/low-spec-initial-activation-cap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/patch_low_spec_initial_activation.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: rm scripts/patch_low_spec_initial_activation.py .github/workflows/apply-low-spec-initial-activation.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: cap low-spec initial channel activation" || exit 0
          git push
