name: Apply cache observability instrumentation

on:
  push:
    branches:
      - perf/cache-observability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/cache-observability
          fetch-depth: 0

      - name: Patch diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          binding = Path('core/channels/channel-binding.ts')
          text = binding.read_text()
          anchor = "const residentFullRangesBySource = new WeakMap<\n  NumericChannelDataSource,\n  Map<string, NumericChannelRange>\n>();\n"
          addition = """

export interface BoundCacheDiagnosticEvent {
  readonly sequence: number;
  readonly kind: 'construct' | 'retain' | 'resident-hit' | 'resident-miss' | 'has-cache';
  readonly boundInstanceId: number;
  readonly sourceInstanceId: number;
  readonly channelId?: string;
  readonly sourceChannelId?: string;
  readonly residentCount: number;
  readonly startSampleIndex?: number;
  readonly sampleCount?: number;
  readonly retained?: boolean;
  readonly cacheReady?: boolean;
}

export interface BoundCacheDiagnosticSnapshot {
  readonly constructedBoundSources: number;
  readonly observedRawSources: number;
  readonly retainAttempts: number;
  readonly retainSuccesses: number;
  readonly residentHits: number;
  readonly residentMisses: number;
  readonly hasCacheChecks: number;
  readonly recentEvents: readonly BoundCacheDiagnosticEvent[];
}

const boundInstanceIds = new WeakMap<BoundNumericChannelDataSource, number>();
const sourceInstanceIds = new WeakMap<NumericChannelDataSource, number>();
let nextBoundInstanceId = 1;
let nextSourceInstanceId = 1;
let eventSequence = 0;
let constructedBoundSources = 0;
let observedRawSources = 0;
let retainAttempts = 0;
let retainSuccesses = 0;
let residentHits = 0;
let residentMisses = 0;
let hasCacheChecks = 0;
const recentBoundCacheEvents: BoundCacheDiagnosticEvent[] = [];

function sourceDiagnosticId(source: NumericChannelDataSource): number {
  const existing = sourceInstanceIds.get(source);
  if (existing) return existing;
  const created = nextSourceInstanceId++;
  sourceInstanceIds.set(source, created);
  observedRawSources += 1;
  return created;
}

function boundDiagnosticId(source: BoundNumericChannelDataSource): number {
  const existing = boundInstanceIds.get(source);
  if (existing) return existing;
  const created = nextBoundInstanceId++;
  boundInstanceIds.set(source, created);
  constructedBoundSources += 1;
  return created;
}

function recordBoundCacheEvent(event: Omit<BoundCacheDiagnosticEvent, 'sequence'>): void {
  recentBoundCacheEvents.push({ sequence: ++eventSequence, ...event });
  if (recentBoundCacheEvents.length > 40) recentBoundCacheEvents.shift();
}

export function latestBoundCacheDiagnosticSnapshot(): BoundCacheDiagnosticSnapshot {
  return {
    constructedBoundSources,
    observedRawSources,
    retainAttempts,
    retainSuccesses,
    residentHits,
    residentMisses,
    hasCacheChecks,
    recentEvents: [...recentBoundCacheEvents],
  };
}
"""
          if 'latestBoundCacheDiagnosticSnapshot' not in text:
              text = text.replace(anchor, anchor + addition)

          constructor_anchor = "    this.sampleCount = source.sampleCount;\n    this.residentFullRanges = residentFullRangesForSource(source);\n"
          constructor_addition = """    recordBoundCacheEvent({
      kind: 'construct',
      boundInstanceId: boundDiagnosticId(this),
      sourceInstanceId: sourceDiagnosticId(source),
      residentCount: this.residentFullRanges.size,
    });
"""
          if "kind: 'construct'" not in text:
              text = text.replace(constructor_anchor, constructor_anchor + constructor_addition)

          old = """  private retainFullRange(channelId: string, range: NumericChannelRange): void {
    if (range.startSampleIndex === 0 && range.values.length === this.sampleCount) {
      this.residentFullRanges.set(this.sourceId(channelId), range);
    }
  }
"""
          new = """  private retainFullRange(channelId: string, range: NumericChannelRange): void {
    retainAttempts += 1;
    const sourceChannelId = this.sourceChannelIdByBoundId.get(channelId);
    const retained = range.startSampleIndex === 0
      && range.values.length === this.sampleCount
      && sourceChannelId !== undefined;
    if (retained && sourceChannelId) {
      this.residentFullRanges.set(sourceChannelId, range);
      retainSuccesses += 1;
    }
    recordBoundCacheEvent({
      kind: 'retain',
      boundInstanceId: boundDiagnosticId(this),
      sourceInstanceId: sourceDiagnosticId(this.source),
      channelId,
      ...(sourceChannelId ? { sourceChannelId } : {}),
      residentCount: this.residentFullRanges.size,
      startSampleIndex: range.startSampleIndex,
      sampleCount: range.values.length,
      retained,
    });
  }
"""
          text = text.replace(old, new)

          old = """    const full = this.residentFullRanges.get(sourceId);
    if (!full) return undefined;
"""
          new = """    const full = this.residentFullRanges.get(sourceId);
    if (!full) {
      residentMisses += 1;
      recordBoundCacheEvent({
        kind: 'resident-miss',
        boundInstanceId: boundDiagnosticId(this),
        sourceInstanceId: sourceDiagnosticId(this.source),
        channelId,
        sourceChannelId: sourceId,
        residentCount: this.residentFullRanges.size,
        startSampleIndex,
        sampleCount,
      });
      return undefined;
    }
    residentHits += 1;
    recordBoundCacheEvent({
      kind: 'resident-hit',
      boundInstanceId: boundDiagnosticId(this),
      sourceInstanceId: sourceDiagnosticId(this.source),
      channelId,
      sourceChannelId: sourceId,
      residentCount: this.residentFullRanges.size,
      startSampleIndex,
      sampleCount,
    });
"""
          text = text.replace(old, new)

          old = """    const sourceId = this.sourceChannelIdByBoundId.get(channelId);
    if (sourceId && this.residentFullRanges.has(sourceId)) return true;
    if (!this.source.hasCachedChannelRange) return false;
    return sourceId
      ? this.source.hasCachedChannelRange(sourceId, startSampleIndex, sampleCount)
      : false;
"""
          new = """    hasCacheChecks += 1;
    const sourceId = this.sourceChannelIdByBoundId.get(channelId);
    const residentReady = Boolean(sourceId && this.residentFullRanges.has(sourceId));
    const delegatedReady = !residentReady && Boolean(
      sourceId && this.source.hasCachedChannelRange?.(sourceId, startSampleIndex, sampleCount)
    );
    const cacheReady = residentReady || delegatedReady;
    recordBoundCacheEvent({
      kind: 'has-cache',
      boundInstanceId: boundDiagnosticId(this),
      sourceInstanceId: sourceDiagnosticId(this.source),
      channelId,
      ...(sourceId ? { sourceChannelId: sourceId } : {}),
      residentCount: this.residentFullRanges.size,
      startSampleIndex,
      sampleCount,
      cacheReady,
    });
    return cacheReady;
"""
          text = text.replace(old, new)
          binding.write_text(text)

          perf = Path('apps/web/src/components/performance-diagnostics.ts')
          text = perf.read_text()
          anchor = "import {\n  clearChannelDecodePerformance,\n  latestChannelDecodePerformance,\n} from '../../../../core/diagnostics/channel-decode-performance';\n"
          if 'latestBoundCacheDiagnosticSnapshot' not in text:
              text = text.replace(anchor, anchor + "import { latestBoundCacheDiagnosticSnapshot } from '../../../../core/channels/channel-binding';\n")
          anchor = "    const lines: string[] = ['EpicScope performance diagnostics'];\n"
          replacement = """    const lines: string[] = ['EpicScope performance diagnostics'];
    const boundCache = latestBoundCacheDiagnosticSnapshot();
    lines.push(
      '',
      '[Bound channel cache]',
      `boundInstances=${boundCache.constructedBoundSources}`,
      `rawSources=${boundCache.observedRawSources}`,
      `retainAttempts=${boundCache.retainAttempts}`,
      `retainSuccesses=${boundCache.retainSuccesses}`,
      `residentHits=${boundCache.residentHits}`,
      `residentMisses=${boundCache.residentMisses}`,
      `hasCacheChecks=${boundCache.hasCacheChecks}`,
    );
    boundCache.recentEvents.forEach((event) => {
      lines.push(
        `event=${event.sequence};kind=${event.kind};bound=${event.boundInstanceId};source=${event.sourceInstanceId};channel=${event.channelId ?? '-'};sourceChannel=${event.sourceChannelId ?? '-'};resident=${event.residentCount};start=${event.startSampleIndex ?? '-'};samples=${event.sampleCount ?? '-'};retained=${event.retained ?? '-'};cacheReady=${event.cacheReady ?? '-'}`,
      );
    });
"""
          text = text.replace(anchor, replacement)
          perf.write_text(text)

          Path('.github/workflows/cache-observability-patch.yml').unlink()
          PY

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test -- --run

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "diagnostics: expose bound cache runtime state"
          git push origin HEAD:perf/cache-observability
