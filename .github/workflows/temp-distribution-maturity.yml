name: Temporary Distribution maturity validation
on:
  push:
    branches: [feat/distribution-maturity]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/temp_distribution_maturity.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          rm .github/workflows/temp-distribution-maturity.yml .github/scripts/temp_distribution_maturity.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'add Distribution saved setups and CSV export'
          git push
