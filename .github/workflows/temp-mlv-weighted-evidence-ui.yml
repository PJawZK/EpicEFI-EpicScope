name: Temporary MLV weighted evidence UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: histogram/mlv-weighted-evidence-ui-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: git show origin/main:scripts/temp_patch_mlv_weighted_evidence.py > /tmp/patch.py
      - run: python3 /tmp/patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add apps/web/src/pages/histogram-table-generator-view.ts
          git commit -m "Show MLV weighted cell hit evidence"
          git push origin HEAD:histogram/mlv-weighted-evidence-ui-v1
