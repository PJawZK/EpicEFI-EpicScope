name: Temporary Boost qualification evidence
on:
  push:
    branches:
      - feature/boost-shared-qualification
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-shared-qualification
          fetch-depth: 0
      - name: Clarify qualification evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/boost-analyzer-view.ts')
          t = p.read_text()
          old = "      <div class=\"boost-evidence\">\n        <span>Input <strong data-boost=\"input\">0</strong></span>\n        <span>Tracking valid <strong data-boost=\"tracking-valid\">0</strong></span>\n        <span>Tracking invalid <strong data-boost=\"tracking-invalid\">0</strong></span>\n        <span>Tracking unavailable <strong data-boost=\"tracking-unavailable\">0</strong></span>\n      </div>\n"
          new = "      <div class=\"boost-evidence\">\n        <span>Scope input <strong data-boost=\"qualification-input\">0</strong></span>\n        <span>Eligible <strong data-boost=\"qualification-eligible\">0</strong></span>\n        <span>Rejected <strong data-boost=\"qualification-rejected\">0</strong></span>\n        <span>Qualification invalid <strong data-boost=\"qualification-invalid\">0</strong></span>\n        <span>Qualification unavailable <strong data-boost=\"qualification-unavailable\">0</strong></span>\n        <span>Tracking valid <strong data-boost=\"tracking-valid\">0</strong></span>\n        <span>Tracking invalid <strong data-boost=\"tracking-invalid\">0</strong></span>\n        <span>Tracking unavailable <strong data-boost=\"tracking-unavailable\">0</strong></span>\n      </div>\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = "    field('input').textContent = currentResult.inputSampleCount.toLocaleString();\n    field('tracking-valid').textContent = (currentResult.tracking?.sampleCount ?? 0).toLocaleString();\n"
          new = "    field('qualification-input').textContent = scoped.inputSampleCount.toLocaleString();\n    field('qualification-eligible').textContent = scoped.eligibleSampleCount.toLocaleString();\n    field('qualification-rejected').textContent = scoped.valueRejectedSampleCount.toLocaleString();\n    field('qualification-invalid').textContent = scoped.invalidSampleCount.toLocaleString();\n    field('qualification-unavailable').textContent = scoped.unavailableSampleCount.toLocaleString();\n    field('tracking-valid').textContent = (currentResult.tracking?.sampleCount ?? 0).toLocaleString();\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-view.ts
          git commit -m "Clarify Boost qualification evidence"
          git push origin HEAD:feature/boost-shared-qualification
