name: Temp analyzer foundation phase1 validation

on:
  push:
    branches:
      - analyzer/foundation-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analyzer/foundation-phase1
      - name: Apply Analyzer foundation patch
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: python3 tools/patch-analyzer-foundation-phase1.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Analyzer foundation
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/logger-page.ts apps/web/src/app/app-shell.ts apps/web/src/pages/specialized-analyzer-suite-view.ts apps/web/src/styles/specialized-analyzer.css
          git commit -m 'Build Analyzer phase one foundation'
          git push origin HEAD:analyzer/foundation-phase1
