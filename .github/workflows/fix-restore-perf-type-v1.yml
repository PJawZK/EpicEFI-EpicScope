name: Fix restore performance type

on:
  push:
    branches:
      - perf/revert-multilevel-instrument-restore-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/revert-multilevel-instrument-restore-v1
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          s = s.replace(
              '  readonly prepareMs: number;\n  readonly sharedBatchMs: number;\n',
              '  readonly prepareMs: number;\n  readonly prepareStateMs: number;\n  readonly prepareClearMs: number;\n  readonly prepareLayoutMs: number;\n  readonly prepareViewportMs: number;\n  readonly preparePaneRequestsMs: number;\n  readonly prepareBatchPlanMs: number;\n  readonly sharedBatchMs: number;\n',
              1,
          )
          s = s.replace(
              '  readonly finalSyncMs: number;\n  readonly visiblePaneCount: number;\n',
              '  readonly finalSyncMs: number;\n  readonly finalSyncResolveMs: number;\n  readonly finalSyncAssignedNormalizeMs: number;\n  readonly finalSyncInspectorActiveMs: number;\n  readonly finalSyncInspectorQueuedMs: number;\n  readonly finalSyncValueSearchMs: number;\n  readonly finalSyncAssignedSyncMs: number;\n  readonly finalSyncOverviewMs: number;\n  readonly visiblePaneCount: number;\n',
              1,
          )
          p.write_text(s)
          PY
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/pages/logger-page.ts
          git commit -m "Fix restore performance instrumentation type"
          git push origin HEAD:perf/revert-multilevel-instrument-restore-v1
