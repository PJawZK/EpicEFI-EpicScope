name: Temporary Heatmap aggregation UI refinement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-refine-heatmap-aggregation-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: analysis/heatmap-aggregation-ui-v1
          fetch-depth: 0
      - name: Apply refinement
        run: |
          git show origin/main:scripts/tmp-refine-heatmap-aggregation-ui.py > /tmp/patch.py
          python /tmp/patch.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/heatmap-view.ts apps/web/src/styles/histogram.css
          git commit -m "Refine Heatmap aggregation presentation"
          git push origin HEAD:analysis/heatmap-aggregation-ui-v1
