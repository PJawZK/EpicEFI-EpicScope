name: VE v50 shared range live preview

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage shared range live preview reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Reconcile current-main live range preview with shared owner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-table-interaction-dom.ts')
          text = path.read_text()
          state_anchor = """  let inlineInput: HTMLInputElement | undefined;\n  let finishInlineEdit: ((commit: boolean) => void) | undefined;\n"""
          state_replacement = """  let inlineInput: HTMLInputElement | undefined;\n  let finishInlineEdit: ((commit: boolean) => void) | undefined;\n  let inlinePreviewOriginal = new Map<HTMLTableCellElement, string>();\n"""
          if state_anchor not in text:
              raise SystemExit('inline state anchor missing')
          text = text.replace(state_anchor, state_replacement, 1)

          start_anchor = """  const startInlineEdit = (position: TableCellPosition, initial?: string): void => {\n"""
          helpers = """  const restoreInlinePreview = (): void => {\n    for (const [previewCell, text] of inlinePreviewOriginal) {\n      previewCell.textContent = text;\n      delete previewCell.dataset.tablePreview;\n      delete previewCell.dataset.delayPreview;\n    }\n    inlinePreviewOriginal.clear();\n  };\n\n  const previewInlineValue = (activeCell: HTMLTableCellElement, text: string): void => {\n    for (const position of selectedPositions()) {\n      const previewCell = cellFor(position);\n      if (!previewCell || previewCell === activeCell) continue;\n      if (!inlinePreviewOriginal.has(previewCell)) inlinePreviewOriginal.set(previewCell, previewCell.textContent ?? '');\n      previewCell.textContent = text || '—';\n      previewCell.dataset.tablePreview = 'true';\n      if (previewCell.dataset.delayRow !== undefined) previewCell.dataset.delayPreview = 'true';\n    }\n  };\n\n""" + start_anchor
          if start_anchor not in text:
              raise SystemExit('startInlineEdit anchor missing')
          text = text.replace(start_anchor, helpers, 1)

          focus_anchor = """    inlineInput = input;\n    input.focus({ preventScroll: true });\n"""
          focus_replacement = """    inlineInput = input;\n    inlinePreviewOriginal = new Map();\n    previewInlineValue(cell, input.value);\n    input.focus({ preventScroll: true });\n"""
          if focus_anchor not in text:
              raise SystemExit('inline focus anchor missing')
          text = text.replace(focus_anchor, focus_replacement, 1)

          finish_anchor = """      input.remove();\n      delete cell.dataset.tableEditing;\n      delete cell.dataset.delayEditing;\n      if (commit) {\n"""
          finish_replacement = """      input.remove();\n      delete cell.dataset.tableEditing;\n      delete cell.dataset.delayEditing;\n      restoreInlinePreview();\n      if (commit) {\n"""
          if finish_anchor not in text:
              raise SystemExit('inline finish anchor missing')
          text = text.replace(finish_anchor, finish_replacement, 1)

          key_anchor = """    input.addEventListener('keydown', (event) => {\n"""
          key_replacement = """    input.addEventListener('input', () => previewInlineValue(cell, input.value));\n    input.addEventListener('keydown', (event) => {\n"""
          if key_anchor not in text:
              raise SystemExit('inline key anchor missing')
          text = text.replace(key_anchor, key_replacement, 1)
          path.write_text(text)
          PY
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-shared-live-preview.yml
          git add apps/web/src/pages/ve-table-interaction-dom.ts
          git commit -m "Preserve shared range live preview semantics [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
