name: SHIM-7 source switching fix

on:
  push:
    branches: [shim/logger-ui-v1]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[shim7-edge-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shim/logger-ui-v1
      - name: Patch source switching edges
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/app/shim-live-ui.ts')
          s = p.read_text()
          s = s.replace(
            "        if (!session?.isRecording) resetRecordedHeader();",
            "        if (!session?.isRecording && !captureOpened) resetRecordedHeader();",
            1,
          )
          disconnect = "    resetRecordedHeader();\n    appStatus.textContent = 'Shim disconnected';"
          replacement = "    if (!captureOpened) resetRecordedHeader();\n    appStatus.textContent = captureOpened ? 'Shim disconnected · retained capture remains active' : 'Shim disconnected';"
          if disconnect not in s:
            raise SystemExit('disconnect header anchor missing')
          s = s.replace(disconnect, replacement, 1)
          p.write_text(s)

          p = Path('apps/web/src/app/app-shell.ts')
          s = p.read_text()
          anchor = "        if (currentRawLog) {\n          const persistedReusable = reusableWorkspacePersistenceSuspended"
          replacement = "        if (currentRawLog && currentRawLog.summary.source.format !== 'TS-SHIM') {\n          const persistedReusable = reusableWorkspacePersistenceSuspended"
          if anchor not in s:
            raise SystemExit('INI binding guard anchor missing')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/app-shell.ts apps/web/src/app/shim-live-ui.ts
          git commit -m "Guard shim capture source switching [shim7-edge-fixed]"
          git push origin HEAD:shim/logger-ui-v1
