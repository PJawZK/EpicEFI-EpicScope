      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit target implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/analysis/range-statistics.ts tests/analysis/range-statistics.test.ts apps/web/src/components/graph-viewport.ts apps/web/src/panels/inspector-panel.ts apps/web/src/pages/logger-page.ts
          git commit -m "Add selected range statistics"
          git push origin HEAD:analysis/range-statistics-v1

      - name: Clean temporary main workflow
        if: always()
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/tmp-run-range-statistics.yml
          git add .github/workflows/tmp-run-range-statistics.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary range statistics workflow"
          git push origin main
