name: Temporary run range statistics patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-run-range-statistics.yml

permissions:
  contents: write

jobs:
  patch-target-and-clean-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: analysis/range-statistics-v1
          fetch-depth: 0

      - name: Apply range statistics patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis = Path('core/analysis/range-statistics.ts')
          analysis.write_text("""import type { NumericChannelRange } from '../log-model/log-types';

export interface NumericRangeStatistics {
  readonly validCount: number;
  readonly invalidCount: number;
  readonly min: number | undefined;
  readonly max: number | undefined;
  readonly mean: number | undefined;
  readonly standardDeviation: number | undefined;
}

export function summarizeNumericRange(
  range: NumericChannelRange,
  startMs = Number.NEGATIVE_INFINITY,
  endMs = Number.POSITIVE_INFINITY,
): NumericRangeStatistics {
  const lowerMs = Math.min(startMs, endMs);
  const upperMs = Math.max(startMs, endMs);
  let validCount = 0;
  let invalidCount = 0;
  let min = Number.POSITIVE_INFINITY;
  let max = Number.NEGATIVE_INFINITY;
  let mean = 0;
  let m2 = 0;

  for (let index = 0; index < range.values.length; index += 1) {
    const timeMs = range.timeMs[index];
    if (timeMs === undefined || timeMs < lowerMs || timeMs > upperMs) continue;
    const value = range.values[index];
    if (range.validity[index] !== 1 || value === undefined || !Number.isFinite(value)) {
      invalidCount += 1;
      continue;
    }
    validCount += 1;
    min = Math.min(min, value);
    max = Math.max(max, value);
    const delta = value - mean;
    mean += delta / validCount;
    m2 += delta * (value - mean);
  }

  return {
    validCount,
    invalidCount,
    min: validCount > 0 ? min : undefined,
    max: validCount > 0 ? max : undefined,
    mean: validCount > 0 ? mean : undefined,
    standardDeviation: validCount > 1
      ? Math.sqrt(m2 / (validCount - 1))
      : validCount === 1 ? 0 : undefined,
  };
}

export function numericRangeCoversTime(
  range: NumericChannelRange,
  startMs: number,
  endMs: number,
): boolean {
  if (range.timeMs.length === 0) return false;
  const lowerMs = Math.min(startMs, endMs);
  const upperMs = Math.max(startMs, endMs);
  const firstTimeMs = range.timeMs[0];
  const lastTimeMs = range.timeMs[range.timeMs.length - 1];
  return firstTimeMs !== undefined
    && lastTimeMs !== undefined
    && firstTimeMs <= lowerMs
    && lastTimeMs >= upperMs;
}
""", encoding='utf-8')

          tests = Path('tests/analysis/range-statistics.test.ts')
          tests.write_text("""import { describe, expect, it } from 'vitest';
import type { NumericChannelRange } from '../../core/log-model/log-types';
import { numericRangeCoversTime, summarizeNumericRange } from '../../core/analysis/range-statistics';

function range(
  timeMs: readonly number[],
  values: readonly number[],
  validity: readonly number[],
): NumericChannelRange {
  return {
    startSampleIndex: 0,
    timeMs: Float64Array.from(timeMs),
    values: Float64Array.from(values),
    validity: Uint8Array.from(validity),
  };
}

describe('summarizeNumericRange', () => {
  it('summarizes only samples inside the requested time range', () => {
    const result = summarizeNumericRange(
      range([0, 10, 20, 30, 40], [1, 2, 3, 4, 5], [1, 1, 1, 1, 1]),
      10,
      30,
    );

    expect(result).toEqual({
      validCount: 3,
      invalidCount: 0,
      min: 2,
      max: 4,
      mean: 3,
      standardDeviation: 1,
    });
  });

  it('counts invalid samples without letting them affect numeric statistics', () => {
    const result = summarizeNumericRange(
      range([0, 10, 20, 30], [5, 100, 9, Number.NaN], [1, 0, 1, 1]),
    );

    expect(result.validCount).toBe(2);
    expect(result.invalidCount).toBe(2);
    expect(result.min).toBe(5);
    expect(result.max).toBe(9);
    expect(result.mean).toBe(7);
    expect(result.standardDeviation).toBeCloseTo(Math.sqrt(8));
  });

  it('accepts reversed A/B boundaries', () => {
    const result = summarizeNumericRange(
      range([0, 10, 20, 30], [1, 2, 3, 4], [1, 1, 1, 1]),
      30,
      10,
    );

    expect(result.validCount).toBe(3);
    expect(result.min).toBe(2);
    expect(result.max).toBe(4);
  });
});

describe('numericRangeCoversTime', () => {
  const decoded = range([100, 110, 120, 130], [1, 2, 3, 4], [1, 1, 1, 1]);

  it('reports complete coverage when both requested boundaries are decoded', () => {
    expect(numericRangeCoversTime(decoded, 105, 125)).toBe(true);
    expect(numericRangeCoversTime(decoded, 125, 105)).toBe(true);
  });

  it('reports partial coverage when the requested interval extends outside decoded data', () => {
    expect(numericRangeCoversTime(decoded, 90, 125)).toBe(false);
    expect(numericRangeCoversTime(decoded, 105, 140)).toBe(false);
  });
});
""", encoding='utf-8')

