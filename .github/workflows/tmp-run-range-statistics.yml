name: Temporary range statistics patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-run-range-statistics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: analysis/range-statistics-v1
          fetch-depth: 0

      - name: Fetch patch script from main
        run: git show origin/main:scripts/tmp-range-statistics.py > /tmp/range-statistics.py

      - name: Apply patch
        run: python /tmp/range-statistics.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/analysis/range-statistics.ts tests/analysis/range-statistics.test.ts apps/web/src/components/graph-viewport.ts apps/web/src/panels/inspector-panel.ts apps/web/src/pages/logger-page.ts
          git commit -m "Add selected range statistics"
          git push origin HEAD:analysis/range-statistics-v1

# trigger
