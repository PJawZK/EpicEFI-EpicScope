name: Temporary Distribution fixed geometry validation
on:
  push:
    branches: [feat/distribution-fixed-geometry]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_distribution_fixed_geometry_transform.py
      - run: python .github/scripts/temp_distribution_fixed_geometry.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          rm .github/workflows/temp-distribution-fixed-geometry.yml .github/scripts/temp_distribution_fixed_geometry.py .github/scripts/patch_distribution_fixed_geometry_transform.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'complete Distribution fixed geometry parity'
          git push
