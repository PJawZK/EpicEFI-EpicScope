name: Temporary MLV weighting integration
on:
  push:
    branches: [histogram/mlv-weighting-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: histogram/mlv-weighting-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire weighted cell evidence into Table Generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/histogram-table-generator-view.ts')
          s = p.read_text()
          s = s.replace("if (method === 'weighted-mean') return 'Weighted mean';", "if (method === 'weighted-mean') return 'MLV weighted mean';")
          s = s.replace('<option value="weighted-mean">Weighted mean · MLV experimental</option>', '<option value="weighted-mean">MLV weighted mean</option>')
          old = '''      displayResult = {
        ...result,
        cellValues: weighted.cellValues,
        cellValueSampleCounts: weighted.cellContributingSampleCounts,
        cellValueMin: weighted.cellValueMin,
        cellValueMax: weighted.cellValueMax,
        valueValidSampleCount: weighted.contributingSampleCount,
        valueInvalidSampleCount: weighted.invalidValueSampleCount,
        valueUnavailableSampleCount: weighted.unavailableValueSampleCount,
      };'''
          new = '''      displayResult = {
        ...result,
        counts: weighted.cellContributingSampleCounts,
        cellValues: weighted.cellValues,
        cellValueSampleCounts: weighted.cellContributingSampleCounts,
        cellSampleIndices: weighted.cellSampleIndices,
        cellValueMin: weighted.cellValueMin,
        cellValueMax: weighted.cellValueMax,
        maxCellCount: Math.max(0, ...weighted.cellContributingSampleCounts),
        valueValidSampleCount: weighted.contributingSampleCount,
        valueInvalidSampleCount: weighted.invalidValueSampleCount,
        valueUnavailableSampleCount: weighted.unavailableValueSampleCount,
      };'''
          if old not in s:
              raise SystemExit('missing weighted display result block')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit validated integration and remove helper
        run: |
          rm .github/workflows/temp-mlv-weighting-v3.yml
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add core/analysis/weighted-cell-mean.ts tests/analysis/weighted-cell-mean.test.ts apps/web/src/pages/histogram-table-generator-view.ts .github/workflows/temp-mlv-weighting-v3.yml
          git commit -m "Match MLV breakpoint-weighted table generation"
          git push origin HEAD:histogram/mlv-weighting-v3
