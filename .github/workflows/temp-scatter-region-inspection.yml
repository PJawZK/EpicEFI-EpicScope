name: Temporary Scatter region inspection validation

on:
  push:
    branches:
      - fix/scatter-region-inspection

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scatter-region-inspection
      - name: Apply guarded transform
        run: |
          set +e
          output="$(python .github/scripts/temp_scatter_region_inspection.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if ! printf '%s\n' "$output" | grep -Fq "anchor not found in docs/HISTOGRAM.md"; then
              exit "$status"
            fi
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/HISTOGRAM.md')
          text = p.read_text()
          old = "- drag-box region selection evaluated against the full qualified pair population, not only rendered/downsampled points;\n- selected-region pair count and X/Y bounds;\n- selected-region → Logger navigation with the complete selected source evidence;\n"
          new = "- drag-box region selection evaluated against the full qualified pair population, not only rendered/downsampled points;\n- prominent in-plot region summary with pair share, X/Y bounds and contiguous-visit count;\n- selected-region → Logger navigation focused on the strongest contiguous visit instead of the full first-to-last hit envelope;\n"
          if old not in text:
              raise SystemExit('corrected Histogram anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-scatter-region-inspection.yml
          rm .github/scripts/temp_scatter_region_inspection.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'improve Scatter region inspection and Logger focus'
            git push
          fi
