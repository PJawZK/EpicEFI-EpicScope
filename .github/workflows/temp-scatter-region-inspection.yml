name: Temporary Scatter region inspection validation

on:
  push:
    branches:
      - fix/scatter-region-inspection

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scatter-region-inspection
      - run: python .github/scripts/temp_scatter_region_inspection.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-scatter-region-inspection.yml
          rm .github/scripts/temp_scatter_region_inspection.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'improve Scatter region inspection and Logger focus'
            git push
          fi
