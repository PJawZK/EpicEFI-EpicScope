name: Low spec full-view cap patch

on:
  push:
    branches:
      - perf/low-spec-full-view-cap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/low-spec-full-view-cap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_low_spec_full_view_cap.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: rm scripts/patch_low_spec_full_view_cap.py .github/workflows/apply-low-spec-full-view-cap.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts scripts/patch_low_spec_full_view_cap.py .github/workflows/apply-low-spec-full-view-cap.yml
          git commit -m "Perf: cap low-spec full-view activation"
          git push origin HEAD:perf/low-spec-full-view-cap
