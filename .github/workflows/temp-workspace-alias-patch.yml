name: Temporary workspace alias patch

on:
  push:
    branches:
      - fix/workspace-known-ini-alias-migration

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run workspace alias patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-known-ini-alias-migration
      - name: Apply workspace alias patch
        run: python3 tools/temp_workspace_alias_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/channels/channel-binding.ts apps/web/src/state/workspace-channel-identity.ts apps/web/src/app/app-shell.ts tests/channels/channel-binding.test.ts tests/web/workspace-channel-identity.test.ts
          git commit -m "Fix: migrate known stale INI workspace identities"
          git push origin HEAD:fix/workspace-known-ini-alias-migration
