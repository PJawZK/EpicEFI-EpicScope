name: Temporary MSQ geometry-only patch
on:
  push:
    branches: [histogram/msq-geometry-only-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: histogram/msq-geometry-only-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply geometry-only behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/histogram-page.ts')
          s = p.read_text()
          old = '''    const xAxisSelect = page.querySelector<HTMLSelectElement>('.histogram-table-msq-x-axis');
    const yAxisSelect = page.querySelector<HTMLSelectElement>('.histogram-table-msq-y-axis');
    const xDataSelect = page.querySelector<HTMLSelectElement>('.histogram-table-x');
    const yDataSelect = page.querySelector<HTMLSelectElement>('.histogram-table-y');
    if (!tableSelect?.value || !xAxisSelect || !yAxisSelect || !xDataSelect || !yDataSelect) return;'''
          new = '''    const xAxisSelect = page.querySelector<HTMLSelectElement>('.histogram-table-msq-x-axis');
    const yAxisSelect = page.querySelector<HTMLSelectElement>('.histogram-table-msq-y-axis');
    if (!tableSelect?.value || !xAxisSelect || !yAxisSelect) return;'''
          if old not in s:
              raise SystemExit('missing selector block')
          s = s.replace(old, new, 1)
          old2 = '''    const selectRuntimeChannel = (select: HTMLSelectElement, iniName: string | undefined): void => {
      if (!iniName) return;
      const lowered = iniName.toLocaleLowerCase();
      const channel = context.channels.find((candidate) => candidate.sourceName.toLocaleLowerCase() === lowered)
        ?? context.channels.find((candidate) => candidate.displayName.toLocaleLowerCase() === lowered);
      if (channel) select.value = channel.id;
    };
    selectRuntimeChannel(xDataSelect, definition.xChannel);
    selectRuntimeChannel(yDataSelect, definition.yChannel);

'''
          if old2 not in s:
              raise SystemExit('missing runtime-channel block')
          s = s.replace(old2, '', 1)
          p.write_text(s)
          PY
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit validated patch and remove helper
        run: |
          rm .github/workflows/temp-msq-geometry.yml
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add apps/web/src/pages/histogram-page.ts .github/workflows/temp-msq-geometry.yml
          git commit -m "Keep MSQ table autofill geometry-only"
          git push origin HEAD:histogram/msq-geometry-only-v1
