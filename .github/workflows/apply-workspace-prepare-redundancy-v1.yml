name: Apply workspace prepare optimization

on:
  push:
    branches:
      - perf/workspace-prepare-redundancy-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/workspace-prepare-redundancy-v1
      - run: python tools/apply-workspace-prepare-redundancy-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts apps/web/src/pages/logger-page.ts
          git commit -m "Perf: remove redundant workspace prepare rendering"
          git push origin HEAD:perf/workspace-prepare-redundancy-v1
