name: VE v50 reconcile semantic Lambda Result View

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage semantic Lambda Result View'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Replace v7 DOM delay reconstruction with semantic owner snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-analyzer-view-v7.ts')
          text = path.read_text()
          import_anchor = "import { veResultViewUsesNeutralFallback } from './ve-analyzer-result-heat';\n"
          if import_anchor not in text:
              raise SystemExit('result heat import anchor missing')
          text = text.replace(import_anchor, import_anchor + "import { veDelayEditOwner } from './ve-analyzer-delay-edit-owner';\n", 1)

          start = text.index('function readDelaySurface(root: HTMLElement): DelaySurface | undefined {')
          end = text.index('\nfunction bracket(', start)
          replacement = """function readDelaySurface(root: HTMLElement): DelaySurface | undefined {\n  const snapshot = veDelayEditOwner(root)?.snapshot();\n  if (!snapshot || snapshot.rows <= 0 || snapshot.cols <= 0) return undefined;\n  if (snapshot.rpmBins.length !== snapshot.cols || snapshot.loadBins.length !== snapshot.rows) return undefined;\n  if (snapshot.values.length !== snapshot.rows * snapshot.cols) return undefined;\n  if (!snapshot.rpmBins.every(Number.isFinite) || !snapshot.loadBins.every(Number.isFinite)) return undefined;\n\n  const rows = Array.from({ length: snapshot.rows }, (_, row) =>\n    snapshot.values.slice(row * snapshot.cols, (row + 1) * snapshot.cols));\n  return {\n    rpmBins: snapshot.rpmBins,\n    loadBins: snapshot.loadBins,\n    rows,\n  };\n}\n"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-reconcile-v7-delay.yml
          git add apps/web/src/pages/ve-analyzer-view-v7.ts
          git commit -m "Use semantic Lambda surface in VE Result View [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
