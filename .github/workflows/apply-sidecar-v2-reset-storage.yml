name: Apply sidecar v2 storage reset fix

on:
  push:
    branches:
      - fix/mlg-sidecar-v2-reset-storage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mlg-sidecar-v2-reset-storage
      - run: python tools/apply-sidecar-v2-reset-storage.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix: reset incompatible sidecar storage before v2 build"
          git push origin HEAD:fix/mlg-sidecar-v2-reset-storage
