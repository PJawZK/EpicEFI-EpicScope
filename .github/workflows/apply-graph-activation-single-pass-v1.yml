name: Apply graph activation single pass

on:
  push:
    branches:
      - perf/graph-activation-single-pass-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/graph-activation-single-pass-v1
      - run: python tools/apply-graph-activation-single-pass-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: reuse graph statistics for stable scale"
          git push origin HEAD:perf/graph-activation-single-pass-v1
