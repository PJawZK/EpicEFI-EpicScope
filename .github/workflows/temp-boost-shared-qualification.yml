name: Temporary Boost shared qualification
on:
  push:
    branches:
      - feature/boost-shared-qualification
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/boost-shared-qualification
          fetch-depth: 0
      - name: Share Boost qualification filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/boost-analyzer-view.ts')
          t = p.read_text()

          old = "import { qualifyNumericSamples } from '../../../../core/analysis/sample-qualification';\n"
          new = "import { qualifyNumericSampleGroups, type NumericQualificationGroup } from '../../../../core/analysis/sample-qualification';\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "import type { LoggerAnalysisContext, LoggerAnalysisTraceContext } from './logger-page';\n"
          new = "import type { LoggerAnalysisContext, LoggerAnalysisTraceContext } from './logger-page';\nimport { loadAnalysisFilterSets, type AnalysisFilterSetState } from '../state/analysis-filter-storage';\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  let currentResult: BoostAnalyzerResult | undefined;\n  let renderGeneration = 0;\n"
          new = "  let currentResult: BoostAnalyzerResult | undefined;\n  let renderGeneration = 0;\n  let analysisFilterSets = loadAnalysisFilterSets();\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "      <label><span>Scope</span><select class=\"boost-scope\"></select></label>\n      <button type=\"button\" class=\"boost-refresh\">Analyze</button>\n"
          new = "      <label><span>Scope</span><select class=\"boost-scope\"></select></label>\n      <label><span>Qualification</span><select class=\"boost-qualification\"><option value=\"\">None</option></select></label>\n      <button type=\"button\" class=\"boost-refresh\">Analyze</button>\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "        <div><span>Coverage</span><strong data-boost=\"coverage\">—</strong></div>\n        <div><span>Measured mean</span><strong data-boost=\"measured-mean\">—</strong></div>\n"
          new = "        <div><span>Coverage</span><strong data-boost=\"coverage\">—</strong></div>\n        <div><span>Qualification</span><strong data-boost=\"qualification\">None</strong></div>\n        <div><span>Measured mean</span><strong data-boost=\"measured-mean\">—</strong></div>\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  const scopeSelect = root.querySelector<HTMLSelectElement>('.boost-scope');\n  const refreshButton = root.querySelector<HTMLButtonElement>('.boost-refresh');\n"
          new = "  const scopeSelect = root.querySelector<HTMLSelectElement>('.boost-scope');\n  const qualificationSelect = root.querySelector<HTMLSelectElement>('.boost-qualification');\n  const refreshButton = root.querySelector<HTMLButtonElement>('.boost-refresh');\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  if (!measuredSelect || !targetSelect || !rpmSelect || !upperSelect || !lowerSelect || !scopeSelect || !refreshButton || !targetTolerance ||"
          new = "  if (!measuredSelect || !targetSelect || !rpmSelect || !upperSelect || !lowerSelect || !scopeSelect || !qualificationSelect || !refreshButton || !targetTolerance ||"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          anchor = "  const selectedScope = (): AnalyzerScope | undefined => selectedAnalyzerScope(scopeSelect, context);\n\n"
          assert t.count(anchor) == 1
          helpers = (
              "  const selectedQualificationFilter = (): AnalysisFilterSetState | undefined =>\n"
              "    qualificationSelect.value ? analysisFilterSets.find((filterSet) => filterSet.id === qualificationSelect.value) : undefined;\n\n"
              "  const qualificationGroups = (filterSet: AnalysisFilterSetState | undefined): NumericQualificationGroup[] => {\n"
              "    if (!filterSet) return [];\n"
              "    const grouped = new Map<string, Array<{ channelId: string; operator: AnalysisFilterSetState['conditions'][number]['operator']; value: number }>>();\n"
              "    for (const condition of filterSet.conditions) {\n"
              "      if (!condition.enabled) continue;\n"
              "      const groupId = condition.group || 'A';\n"
              "      const conditions = grouped.get(groupId) ?? [];\n"
              "      conditions.push({ channelId: condition.channelId, operator: condition.operator, value: condition.value });\n"
              "      grouped.set(groupId, conditions);\n"
              "    }\n"
              "    return [...grouped.entries()].map(([id, conditions]) => ({ id, logic: filterSet.groupConditionLogic, conditions }));\n"
              "  };\n\n"
          )
          t = t.replace(anchor, anchor + helpers, 1)

          anchor = "  const fillScope = (preferred: string): void => {\n    populateAnalyzerScopeSelect(scopeSelect, context, preferred);\n  };\n\n"
          assert t.count(anchor) == 1
          addition = (
              "  const fillQualification = (preferred: string): void => {\n"
              "    analysisFilterSets = loadAnalysisFilterSets();\n"
              "    qualificationSelect.replaceChildren(new Option('None', ''));\n"
              "    const available = new Set(context.channels.map((channel) => channel.id));\n"
              "    for (const filterSet of analysisFilterSets) {\n"
              "      const unavailable = filterSet.conditions.some((condition) => condition.enabled && !available.has(condition.channelId));\n"
              "      const option = new Option(unavailable ? `${filterSet.name} · unavailable channels` : filterSet.name, filterSet.id);\n"
              "      option.disabled = unavailable;\n"
              "      qualificationSelect.add(option);\n"
              "    }\n"
              "    const option = [...qualificationSelect.options].find((candidate) => candidate.value === preferred && !candidate.disabled);\n"
              "    qualificationSelect.value = option?.value ?? '';\n"
              "  };\n\n"
          )
          t = t.replace(anchor, anchor + addition, 1)

          old = "    const scope = selectedScope();\n    if (!measuredId || !scope) {\n"
          new = "    const scope = selectedScope();\n    const filterSet = selectedQualificationFilter();\n    if (!measuredId || !scope) {\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = (
              "    const loaded = await context.loadTraces(\n"
              "      [measuredId, targetId, rpmId, upperId, lowerId].filter((id): id is string => id !== undefined),\n"
              "      startMs,\n"
              "      endMs,\n"
              "    );\n"
          )
          new = (
              "    const filterChannelIds = filterSet\n"
              "      ? [...new Set(filterSet.conditions.filter((condition) => condition.enabled).map((condition) => condition.channelId))]\n"
              "      : [];\n"
              "    const requestedIds = [...new Set([\n"
              "      ...[measuredId, targetId, rpmId, upperId, lowerId].filter((id): id is string => id !== undefined),\n"
              "      ...filterChannelIds,\n"
              "    ])];\n"
              "    const loaded = await context.loadTraces(requestedIds, startMs, endMs);\n"
          )
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    const channels = new Map([[measured.channel.id, { range: measured.range, complete: measured.complete }]]);\n    const scoped = qualifyNumericSamples({\n      referenceChannelId: measured.channel.id,\n      channels,\n      conditions: [],\n"
          new = "    const channels = new Map(loaded.map((trace) => [trace.channel.id, { range: trace.range, complete: trace.complete }]));\n    const groups = qualificationGroups(filterSet);\n    if (filterChannelIds.some((id) => !channels.has(id))) { empty.hidden = false; content.hidden = true; return; }\n    const scoped = qualifyNumericSampleGroups({\n      referenceChannelId: measured.channel.id,\n      channels,\n      groupLogic: filterSet?.groupLogic ?? 'and',\n      groups,\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    field('coverage').textContent = currentResult.complete ? 'Complete' : 'Partial decoded';\n    field('measured-mean').textContent = formatNumber(currentResult.measured.mean);\n"
          new = "    field('coverage').textContent = currentResult.complete ? 'Complete' : 'Partial decoded';\n    field('qualification').textContent = filterSet?.name ?? 'None';\n    field('measured-mean').textContent = formatNumber(currentResult.measured.mean);\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    const previousScope = scopeSelect.value;\n    const channelsChanged = !sameChannelCatalog(context.channels, nextContext.channels);\n"
          new = "    const previousScope = scopeSelect.value;\n    const previousQualification = qualificationSelect.value;\n    const channelsChanged = !sameChannelCatalog(context.channels, nextContext.channels);\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "    fillScope(previousScope);\n    void render();\n"
          new = "    fillScope(previousScope);\n    fillQualification(previousQualification);\n    void render();\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          old = "  for (const select of [measuredSelect, targetSelect, rpmSelect, upperSelect, lowerSelect, scopeSelect]) select.addEventListener('change', () => { void render(); });\n"
          new = "  for (const select of [measuredSelect, targetSelect, rpmSelect, upperSelect, lowerSelect, scopeSelect, qualificationSelect]) select.addEventListener('change', () => { void render(); });\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)

          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/boost-analyzer-view.ts
          git commit -m "Apply shared qualification filters in Boost"
          git push origin HEAD:feature/boost-shared-qualification
