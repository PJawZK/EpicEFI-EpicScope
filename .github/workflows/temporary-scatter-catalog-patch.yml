name: Temporary Scatter catalog patch

on:
  push:
    branches:
      - audit/scatter-channel-catalog-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/scatter-channel-catalog-guard
          fetch-depth: 0

      - name: Patch Scatter channel catalog guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/scatter-view.ts')
          text = path.read_text()

          helper = "function sameChannelCatalog(\n  left: HistogramPageContext['channels'],\n  right: HistogramPageContext['channels'],\n): boolean {\n  return left.length === right.length && left.every((channel, index) => channel === right[index]);\n}\n\n"
          if helper not in text:
              anchor = "export function createScatterView(): ScatterViewController {"
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected one createScatterView anchor, found {text.count(anchor)}')
              text = text.replace(anchor, helper + anchor)

          old = "  const setContext = (nextContext: HistogramPageContext): void => {\n    const previous = panes.map((pane) => ({ x: pane.xSelect.value, y: pane.ySelect.value }));\n    context = nextContext;\n    analysisA = nextContext.aTimeMs;\n    analysisB = nextContext.bTimeMs;\n    fullStartMs = undefined;\n    fullEndMs = undefined;\n    fillSelect(panes[0]!.xSelect, previous[0]?.x ?? '', 0);\n    fillSelect(panes[0]!.ySelect, previous[0]?.y ?? '', 1);\n    fillSelect(panes[1]!.xSelect, previous[1]?.x ?? '', 0);\n    fillSelect(panes[1]!.ySelect, previous[1]?.y ?? '', 2);\n    void render();\n  };"
          new = "  const setContext = (nextContext: HistogramPageContext): void => {\n    const previous = panes.map((pane) => ({ x: pane.xSelect.value, y: pane.ySelect.value }));\n    const channelsChanged = !sameChannelCatalog(context.channels, nextContext.channels);\n    context = nextContext;\n    analysisA = nextContext.aTimeMs;\n    analysisB = nextContext.bTimeMs;\n    fullStartMs = undefined;\n    fullEndMs = undefined;\n    if (channelsChanged) {\n      fillSelect(panes[0]!.xSelect, previous[0]?.x ?? '', 0);\n      fillSelect(panes[0]!.ySelect, previous[0]?.y ?? '', 1);\n      fillSelect(panes[1]!.xSelect, previous[1]?.x ?? '', 0);\n      fillSelect(panes[1]!.ySelect, previous[1]?.y ?? '', 2);\n    }\n    void render();\n  };"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one setContext block, found {text.count(old)}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/pages/scatter-view.ts; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/scatter-view.ts
          git commit -m "Avoid Scatter channel selector rebuilds"
          git push origin HEAD:audit/scatter-channel-catalog-guard
