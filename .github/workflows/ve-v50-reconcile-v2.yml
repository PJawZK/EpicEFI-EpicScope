name: VE v50 reconcile v2 owner

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage v50 v2 reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Reconcile heterogeneous delay owner onto current v2
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-analyzer-view-v2.ts')
          text = path.read_text()

          old_import = """  activateVeDelayRecommendation,\n  editVeDelayCells,\n  type VeDelayCellPosition,\n"""
          new_import = """  activateVeDelayRecommendation,\n  editVeDelayCells,\n  editVeDelayCellValues,\n  type VeDelayCellPosition,\n"""
          if old_import not in text:
              raise SystemExit('delay editing import anchor not found')
          text = text.replace(old_import, new_import, 1)

          owner_import_anchor = "import { assessVeFuelCorrection, type VeFuelCorrectionMode } from './ve-fuel-correction';\n"
          owner_import = owner_import_anchor + "import { registerVeDelayEditOwner, type VeDelayCellValueEdit } from './ve-analyzer-delay-edit-owner';\n"
          if owner_import_anchor not in text:
              raise SystemExit('owner import anchor not found')
          text = text.replace(owner_import_anchor, owner_import, 1)

          edit_block = """  const editDelayCells = (positions: readonly VeDelayCellPosition[], edit: VeDelayEdit): boolean => {\n    if (!viewActive || pendingContext || pendingTune) return false;\n    const table = workingDelayTable ?? delayRecommendation;\n    if (!table) return false;\n    const next = editVeDelayCells(table, positions, edit);\n    if (next === table) return false;\n    if (workingDelayTable) workingDelayTable = next;\n    else delayRecommendation = next;\n    invalidate();\n    return true;\n  };\n\n"""
          addition = edit_block + """  const applyDelayCellValues = (edits: readonly VeDelayCellValueEdit[]): boolean => {\n    if (!viewActive || pendingContext || pendingTune || edits.length === 0) return false;\n    const table = workingDelayTable ?? delayRecommendation;\n    if (!table) return false;\n    let next;\n    try {\n      next = editVeDelayCellValues(table, edits);\n    } catch {\n      return false;\n    }\n    if (next === table) return false;\n    if (workingDelayTable) workingDelayTable = next;\n    else delayRecommendation = next;\n    invalidate();\n    return true;\n  };\n\n  registerVeDelayEditOwner(root, {\n    snapshot: () => {\n      const table = workingDelayTable ?? delayRecommendation;\n      return table ? {\n        revision: sessionRevision,\n        rows: table.rows,\n        cols: table.cols,\n        values: table.cells.map((cell) => cell.workingMs),\n      } : undefined;\n    },\n    applyValues: applyDelayCellValues,\n    revert: (positions) => editDelayCells(positions, { kind: 'revert' }),\n  });\n\n"""
          if edit_block not in text:
              raise SystemExit('editDelayCells anchor not found')
          text = text.replace(edit_block, addition, 1)
          path.write_text(text)
          PY
      - name: Commit reconciled owner and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-reconcile-v2.yml
          git add apps/web/src/pages/ve-analyzer-view-v2.ts
          git commit -m "Reconcile v50 Lambda owner with current VE v2 [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
