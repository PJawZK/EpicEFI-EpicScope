name: Temp apply VE generation invalidation

on:
  push:
    branches:
      - fix/ve-session-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ve-session-authority
          fetch-depth: 0
      - name: Apply generation invalidation
        run: |
          python - <<'PY'
          from pathlib import Path

          v2 = Path('apps/web/src/pages/ve-analyzer-view-v2.ts')
          text = v2.read_text()
          old = "  const rebuild = (): void => {\n    controls.replaceChildren(); result = undefined; proposal = undefined; delayDiscovery = undefined; delayRecommendation = undefined; workingDelayTable = undefined; selectedDelayCell = undefined;\n"
          new = "  const rebuild = (): void => {\n    runGeneration += 1;\n    delayGeneration += 1;\n    controls.replaceChildren(); result = undefined; proposal = undefined; delayDiscovery = undefined; delayRecommendation = undefined; workingDelayTable = undefined; selectedDelayCell = undefined;\n"
          if old not in text:
              raise SystemExit('VE rebuild anchor not found')
          v2.write_text(text.replace(old, new, 1))

          evidence = Path('apps/web/src/pages/ve-analyzer-cell-evidence.ts')
          text = evidence.read_text()
          old = "  const invalidate = (): void => { cache = undefined; };\n"
          new = "  const invalidate = (): void => {\n    cache = undefined;\n    detailGeneration += 1;\n    const panel = root.closest<HTMLElement>('.analyzer-page')?.querySelector<HTMLElement>('.ve-cell-detail-popover');\n    if (panel) panel.hidden = true;\n  };\n"
          if old not in text:
              raise SystemExit('cell evidence invalidate anchor not found')
          evidence.write_text(text.replace(old, new, 1))

          Path('.github/workflows/temp-apply-ve-generation-invalidation.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ve-analyzer-view-v2.ts apps/web/src/pages/ve-analyzer-cell-evidence.ts .github/workflows/temp-apply-ve-generation-invalidation.yml
          git commit -m "fix: invalidate stale VE async work on semantic rebuild"
          git push origin HEAD:fix/ve-session-authority
