name: VE v50 patch scope menu
on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
          fetch-depth: 0
      - run: python scripts/ve-v50-patch-scope.py
      - run: |
          rm scripts/ve-v50-patch-scope.py
          rm .github/workflows/ve-v50-patch-scope.yml
          npm ci
          npm run typecheck
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align VE scope disclosure with v50 interaction [skip ci]'
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
