name: Temporary Histogram parity closeout validation
on:
  push:
    branches: [docs/histogram-research-parity-closeout]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/temp_histogram_parity_closeout.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit docs
        run: |
          rm .github/workflows/temp-histogram-parity-closeout.yml .github/scripts/temp_histogram_parity_closeout.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'close out generic Histogram research parity'
          git push
