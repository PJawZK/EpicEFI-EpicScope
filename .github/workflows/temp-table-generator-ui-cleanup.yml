name: Temporary Table Generator UI cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/table-generator-cleanup-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: git show origin/main:scripts/temp_patch_table_generator_ui_cleanup.py > /tmp/patch.py
      - run: python3 /tmp/patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "PJawZK"
          git config user.email "anderswedin@hotmail.se"
          git add apps/web/src/pages/histogram-page.ts apps/web/src/pages/histogram-table-generator-view.ts apps/web/src/styles/histogram-workspace.css apps/web/src/styles/histogram-table-generator.css docs/DECISIONS.md
          git commit -m "Refine Table Generator controls and filters"
          git push origin HEAD:ui/table-generator-cleanup-v1
