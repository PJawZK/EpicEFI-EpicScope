name: Temp resident predecode patch

on:
  push:
    branches:
      - perf/reuse-predecoded-ranges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python tools/temp-resident-predecode-patch.py
      - run: rm tools/temp-resident-predecode-patch.py .github/workflows/temp-resident-predecode-patch.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/adapters/persistent-channel-cache.ts tests/web/persistent-channel-cache.test.ts tools/temp-resident-predecode-patch.py .github/workflows/temp-resident-predecode-patch.yml || true
          git commit -m "Perf: retain opportunistically predecoded channels in session" || exit 0
          git push
