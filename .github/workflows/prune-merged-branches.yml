name: Prune reviewed branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          branches=(
            'analyzer/foundation-phase1'
            'analyzer/shared-comparison-qualification'
            'fix/freeform-hidden-pane-geometry'
            'fix/load-newly-visible-pane-traces'
            'fix/load-newly-visible-pane-traces-clean'
            'fix/visible-pane-trace-invariant'
            'phase1/log-mlg-foundation'
            'phase1/log-mlg-plan'
            'phase1/mlg-counter-wrap-fix'
            'phase1/mlg-diagnostics-ui'
            'phase1/web-boot'
            'phase1/web-boot-finalize'
            'phase1/web-boot-plan'
            'phase1/web-reference'
            'refactor/extract-bug-report-health-v1'
            'cleanup/remove-superseded-branches'
          )

          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api --silent "repos/$GH_REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "DELETE $branch"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$encoded"
            else
              echo "SKIP   $branch (already absent)"
            fi
          done
