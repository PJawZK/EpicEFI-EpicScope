name: SHIM-7 typing fix

on:
  push:
    branches: [shim/logger-ui-v1]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[shim7-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shim/logger-ui-v1
      - name: Remove obsolete welcome option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app/shim-live-ui.ts')
          s = p.read_text()
          old = "      schema,\n      welcome,\n    });"
          new = "      schema,\n    });"
          if old not in s:
              raise SystemExit('capture source option anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/shim-live-ui.ts
          git commit -m "Fix shim capture source options [shim7-fix]"
          git push origin HEAD:shim/logger-ui-v1
