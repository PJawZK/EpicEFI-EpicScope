name: VE v50 one-off v2 batch fix

on:
  push:
    branches:
      - ui/ve-analyzer-v50-port

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-off VE v50 v2 batch patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-port
      - name: Use one-pass heterogeneous Lambda edits in v2 owner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-analyzer-view-v2.ts')
          text = path.read_text()
          old_import = """  activateVeDelayRecommendation,\n  editVeDelayCells,\n  type VeDelayCellPosition,\n"""
          new_import = """  activateVeDelayRecommendation,\n  editVeDelayCells,\n  editVeDelayCellValues,\n  type VeDelayCellPosition,\n"""
          if old_import not in text:
              raise SystemExit('expected delay-edit import block not found')
          text = text.replace(old_import, new_import, 1)
          old = """  const applyDelayCellValues = (edits: readonly VeDelayCellValueEdit[]): boolean => {\n    if (!viewActive || pendingContext || pendingTune || edits.length === 0) return false;\n    const table = workingDelayTable ?? delayRecommendation;\n    if (!table) return false;\n    const unique = new Map<string, VeDelayCellValueEdit>();\n    for (const edit of edits) {\n      if (edit.workingMs !== undefined && (!Number.isFinite(edit.workingMs) || edit.workingMs < 0)) return false;\n      unique.set(`${edit.row}:${edit.col}`, edit);\n    }\n    let next = table;\n    for (const edit of unique.values()) {\n      next = editVeDelayCells(next, [{ row: edit.row, col: edit.col }], { kind: 'set', workingMs: edit.workingMs });\n    }\n    if (next === table) return false;\n    if (workingDelayTable) workingDelayTable = next;\n    else delayRecommendation = next;\n    invalidate();\n    return true;\n  };\n"""
          new = """  const applyDelayCellValues = (edits: readonly VeDelayCellValueEdit[]): boolean => {\n    if (!viewActive || pendingContext || pendingTune || edits.length === 0) return false;\n    const table = workingDelayTable ?? delayRecommendation;\n    if (!table) return false;\n    let next;\n    try {\n      next = editVeDelayCellValues(table, edits);\n    } catch {\n      return false;\n    }\n    if (next === table) return false;\n    if (workingDelayTable) workingDelayTable = next;\n    else delayRecommendation = next;\n    invalidate();\n    return true;\n  };\n"""
          if old not in text:
              raise SystemExit('expected applyDelayCellValues block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ve-analyzer-view-v2.ts
          git commit -m "Batch Lambda owner edits in one immutable pass [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-port
