name: Apply timeline overview optimization

on:
  push:
    branches:
      - perf/timeline-overview-blocks-final-sync-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/timeline-overview-blocks-final-sync-v1
      - run: python tools/apply-timeline-overview-blocks-final-sync-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/timeline-shell.ts apps/web/src/pages/logger-page.ts
          git commit -m "Perf: reuse envelope blocks in timeline overview"
          git push origin HEAD:perf/timeline-overview-blocks-final-sync-v1
