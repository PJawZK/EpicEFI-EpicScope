name: Temporary Trigger and Startup starter transform v2
on:
  push:
    branches: [feat/trigger-startup-starters-v2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded starter transform
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/state/semantic-channel-roles.ts')
          s = p.read_text()
          old = "  | 'fuel.pressureDelta'\n  | 'fuel.pumpCommand';"
          new = """  | 'fuel.pressureDelta'\n  | 'fuel.pumpCommand'\n  | 'trigger.syncState'\n  | 'trigger.errorActive'\n  | 'trigger.errorCount'\n  | 'trigger.resyncCount'\n  | 'trigger.phaseSynchronized'\n  | 'trigger.enginePhase'\n  | 'startup.crankingFuel'\n  | 'startup.afterStartCorrection'\n  | 'startup.warmupCorrection'\n  | 'startup.engineCycles';"""
          assert old in s
          s = s.replace(old, new, 1)

          anchor = """  'fuel.pumpCommand': {\n    id: 'fuel.pumpCommand',\n    displayName: 'Fuel Pump Command',\n    aliases: ['isFuelPumpOn', 'Fuel Pump Command', 'Fuel Pump State', 'Fuel Pump On'],\n    include: [/fuel.*pump.*(?:command|state|on)/i],\n    exclude: [/prime/i, /force/i, /button/i, /duration/i, /threshold/i, /config/i, /pin/i],\n  },\n};"""
          replacement = """  'fuel.pumpCommand': {\n    id: 'fuel.pumpCommand',\n    displayName: 'Fuel Pump Command',\n    aliases: ['isFuelPumpOn', 'Fuel Pump Command', 'Fuel Pump State', 'Fuel Pump On'],\n    include: [/fuel.*pump.*(?:command|state|on)/i],\n    exclude: [/prime/i, /force/i, /button/i, /duration/i, /threshold/i, /config/i, /pin/i],\n  },\n  'trigger.syncState': {\n    id: 'trigger.syncState',\n    displayName: 'Trigger Sync State',\n    aliases: ['triggerSyncState', 'Trigger Sync State', 'Sync State', 'Engine Sync State'],\n    include: [/trigger.*sync.*state/i, /engine.*sync.*state/i],\n    exclude: [/config/i, /mode/i, /target/i, /threshold/i],\n  },\n  'trigger.errorActive': {\n    id: 'trigger.errorActive',\n    displayName: 'Trigger Error',\n    aliases: ['isTriggerError', 'Trigger Error', 'Error: Trigger'],\n    include: [/trigger.*error/i],\n    exclude: [/count/i, /counter/i, /threshold/i, /code/i, /ordering/i],\n  },\n  'trigger.errorCount': {\n    id: 'trigger.errorCount',\n    displayName: 'Trigger Error Count',\n    aliases: ['totalTriggerErrorCounter', 'Trigger Error Count', 'Trigger Errors'],\n    include: [/trigger.*error.*(?:count|counter)/i],\n    exclude: [/ordering/i, /recent/i, /code/i, /threshold/i],\n  },\n  'trigger.resyncCount': {\n    id: 'trigger.resyncCount',\n    displayName: 'Resync Count',\n    aliases: ['camResyncCounter', 'Resync Count', 'Resync Counter', 'Cam Resync Count'],\n    include: [/(?:cam.*)?resync.*(?:count|counter)/i],\n    exclude: [/config/i, /threshold/i, /limit/i],\n  },\n  'trigger.phaseSynchronized': {\n    id: 'trigger.phaseSynchronized',\n    displayName: 'Phase Synchronized',\n    aliases: ['m_hasSynchronizedPhase', 'Phase Synchronized', 'Fully Synchronized'],\n    include: [/(?:phase.*synchron|fully.*synchron)/i],\n    exclude: [/target/i, /config/i, /attempt/i],\n  },\n  'trigger.enginePhase': {\n    id: 'trigger.enginePhase',\n    displayName: 'Engine Phase',\n    aliases: ['currentEngineDecodedPhase', 'Engine Phase', 'Decoded Engine Phase'],\n    include: [/engine.*(?:decoded.*)?phase/i],\n    exclude: [/target/i, /offset/i, /config/i, /attempt/i],\n  },\n  'startup.crankingFuel': {\n    id: 'startup.crankingFuel',\n    displayName: 'Cranking Fuel',\n    aliases: ['crankingFuel_fuel', 'Cranking Fuel', 'Fuel: Cranking cycle mass', 'Fuel: cranking'],\n    include: [/cranking.*fuel/i],\n    exclude: [/base/i, /coefficient/i, /mult/i, /table/i, /curve/i, /config/i],\n  },\n  'startup.afterStartCorrection': {\n    id: 'startup.afterStartCorrection',\n    displayName: 'After-start Correction',\n    aliases: ['running_postCrankingFuelCorrection', 'After-start Correction', 'Post Cranking Fuel Correction', 'Fuel: Post cranking mult'],\n    include: [/(?:after.*start|post.*cranking).*?(?:fuel.*)?(?:correction|mult)/i],\n    exclude: [/table/i, /curve/i, /target/i, /config/i],\n  },\n  'startup.warmupCorrection': {\n    id: 'startup.warmupCorrection',\n    displayName: 'Warmup Correction',\n    aliases: ['running_coolantTemperatureCoefficient', 'Warmup Correction', 'CLT Fuel Correction', 'Fuel: CLT correction'],\n    include: [/(?:warmup|coolant|clt).*(?:fuel.*)?(?:correction|coefficient|mult)/i],\n    exclude: [/cranking/i, /table/i, /curve/i, /target/i, /config/i, /afr/i, /lambda/i],\n  },\n  'startup.engineCycles': {\n    id: 'startup.engineCycles',\n    displayName: 'Engine Cycles Since Start',\n    aliases: ['revolutionCounterSinceStart', 'Engine Cycle Count', 'Engine Cycles Since Start'],\n    include: [/(?:engine.*cycle|revolution).*since.*start/i, /engine.*cycle.*count/i],\n    exclude: [/table/i, /bin/i, /target/i],\n  },\n};"""
          assert anchor in s
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = Path('apps/web/src/state/built-in-workspace-templates.ts')
          s = p.read_text()
          anchor = """export const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n  TRANSIENT_AE_DUAL_WORKSPACE,\n  FUEL_SYSTEM_DUAL_WORKSPACE,\n]);"""
          inserted = """export const TRIGGER_SYNC_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'trigger-sync-dual',\n  name: 'Trigger / Sync',\n  description: 'Dual-pane crank/cam synchronization and trigger health overview.',\n  layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'trigger.syncState', requirement: 'required' },\n      { roleId: 'trigger.phaseSynchronized', requirement: 'preferred' },\n      { roleId: 'trigger.errorActive', requirement: 'preferred' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'trigger.errorCount', requirement: 'preferred' },\n      { roleId: 'trigger.resyncCount', requirement: 'optional' },\n      { roleId: 'trigger.enginePhase', requirement: 'optional' },\n      { roleId: 'electrical.batteryVoltage', requirement: 'optional' },\n    ] },\n  ],\n};\n\nexport const STARTUP_WARMUP_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'startup-warmup-dual',\n  name: 'Startup / Warmup',\n  description: 'Dual-pane cranking, after-start and warmup fueling overview.',\n  layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'temperature.coolant', requirement: 'required' },\n      { roleId: 'temperature.intakeAir', requirement: 'preferred' },\n      { roleId: 'electrical.batteryVoltage', requirement: 'preferred' },\n      { roleId: 'startup.engineCycles', requirement: 'optional' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'startup.crankingFuel', requirement: 'preferred' },\n      { roleId: 'startup.afterStartCorrection', requirement: 'preferred' },\n      { roleId: 'startup.warmupCorrection', requirement: 'preferred' },\n      { roleId: 'fuel.lambda', requirement: 'preferred' },\n      { roleId: 'idle.target', requirement: 'optional' },\n    ] },\n  ],\n};\n\nexport const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n  TRANSIENT_AE_DUAL_WORKSPACE,\n  FUEL_SYSTEM_DUAL_WORKSPACE,\n  TRIGGER_SYNC_DUAL_WORKSPACE,\n  STARTUP_WARMUP_DUAL_WORKSPACE,\n]);"""
          assert anchor in s
          s = s.replace(anchor, inserted, 1)
          p.write_text(s)

          test = Path('tests/web/trigger-startup-starters.test.ts')
          assert not test.exists()
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport type { ChannelDefinition } from '../../core/log-model/log-types';\nimport { STARTUP_WARMUP_DUAL_WORKSPACE, TRIGGER_SYNC_DUAL_WORKSPACE, STARTER_WORKSPACE_TEMPLATES, resolveStarterWorkspaceTemplate } from '../../apps/web/src/state/built-in-workspace-templates';\nimport { resolveSemanticChannelRole } from '../../apps/web/src/state/semantic-channel-roles';\n\nfunction channel(id: string, sourceName = id, displayName = sourceName): ChannelDefinition {\n  return { id, sourceName, displayName, valueType: 'number' };\n}\n\ndescribe('Trigger / Sync and Startup / Warmup starters', () => {\n  it('appends both starters to the production catalog', () => {\n    expect(STARTER_WORKSPACE_TEMPLATES.slice(-2).map((template) => template.name)).toEqual(['Trigger / Sync', 'Startup / Warmup']);\n  });\n\n  it('resolves Trigger / Sync onto canonical EpicEFI INI identities', () => {\n    const result = resolveStarterWorkspaceTemplate(TRIGGER_SYNC_DUAL_WORKSPACE, [\n      channel('ini:RPMValue', 'RPMValue', 'RPM'),\n      channel('ini:triggerSyncState', 'triggerSyncState', 'Trigger sync state'),\n      channel('ini:m_hasSynchronizedPhase', 'm_hasSynchronizedPhase', 'Fully synchronized'),\n      channel('ini:isTriggerError', 'isTriggerError', 'Error: Trigger'),\n      channel('ini:totalTriggerErrorCounter', 'totalTriggerErrorCounter', 'Trigger error count'),\n      channel('ini:camResyncCounter', 'camResyncCounter', 'Resync counter'),\n      channel('ini:currentEngineDecodedPhase', 'currentEngineDecodedPhase', 'Engine Phase'),\n      channel('ini:VBatt', 'VBatt', 'Battery'),\n    ]);\n    expect(result.panes[0]?.channelIds).toEqual(['ini:RPMValue', 'ini:triggerSyncState', 'ini:m_hasSynchronizedPhase', 'ini:isTriggerError']);\n    expect(result.panes[1]?.channelIds).toEqual(['ini:totalTriggerErrorCounter', 'ini:camResyncCounter', 'ini:currentEngineDecodedPhase', 'ini:VBatt']);\n    expect(result.unresolvedRequiredRoleIds).toEqual([]);\n  });\n\n  it('keeps trigger state distinct from counters/settings', () => {\n    const channels = [\n      channel('isTriggerError', 'isTriggerError', 'Error: Trigger'),\n      channel('totalTriggerErrorCounter', 'totalTriggerErrorCounter', 'Trigger error count'),\n      channel('triggerSyncConfirmCycles', 'triggerSyncConfirmCycles', 'Sync confirmation cycles'),\n    ];\n    expect(resolveSemanticChannelRole('trigger.errorActive', channels).channel?.id).toBe('isTriggerError');\n    expect(resolveSemanticChannelRole('trigger.errorCount', channels).channel?.id).toBe('totalTriggerErrorCounter');\n  });\n\n  it('resolves Startup / Warmup onto canonical EpicEFI INI identities', () => {\n    const result = resolveStarterWorkspaceTemplate(STARTUP_WARMUP_DUAL_WORKSPACE, [\n      channel('ini:RPMValue', 'RPMValue', 'RPM'),\n      channel('ini:coolant', 'coolant', 'Coolant temp'),\n      channel('ini:intake', 'intake', 'Intake air temp'),\n      channel('ini:VBatt', 'VBatt', 'Battery'),\n      channel('ini:revolutionCounterSinceStart', 'revolutionCounterSinceStart', 'Engine Cycle Count'),\n      channel('ini:crankingFuel_fuel', 'crankingFuel_fuel', 'Fuel: Cranking cycle mass'),\n      channel('ini:running_postCrankingFuelCorrection', 'running_postCrankingFuelCorrection', 'Fuel: Post cranking mult'),\n      channel('ini:running_coolantTemperatureCoefficient', 'running_coolantTemperatureCoefficient', 'Fuel: CLT correction'),\n      channel('ini:lambdaValue', 'lambdaValue', 'Lambda'),\n      channel('ini:idleTarget', 'idleTarget', 'Idle target'),\n    ]);\n    expect(result.panes[0]?.channelIds).toEqual(['ini:RPMValue', 'ini:coolant', 'ini:intake', 'ini:VBatt', 'ini:revolutionCounterSinceStart']);\n    expect(result.panes[1]?.channelIds).toEqual(['ini:crankingFuel_fuel', 'ini:running_postCrankingFuelCorrection', 'ini:running_coolantTemperatureCoefficient', 'ini:lambdaValue', 'ini:idleTarget']);\n    expect(result.unresolvedRequiredRoleIds).toEqual([]);\n  });\n\n  it('does not use cranking configuration channels as runtime cranking fuel', () => {\n    expect(resolveSemanticChannelRole('startup.crankingFuel', [\n      channel('crankingFuel_baseFuel', 'crankingFuel_baseFuel', 'Fuel: Cranking cycle base mass'),\n      channel('crankingFuel_coolantTemperatureCoefficient', 'crankingFuel_coolantTemperatureCoefficient', 'Fuel: cranking CLT mult'),\n    ]).channel).toBeUndefined();\n  });\n});\n""")
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/trigger-startup-starters.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat: add Trigger Sync and Startup Warmup starters"
          git push
