name: VE v50 responsive acceptance integration

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage v50 responsive acceptance integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Add responsive acceptance to browser gate
        run: python scripts/ve-v50-responsive-acceptance-patch.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-responsive-acceptance.yml scripts/ve-v50-responsive-acceptance-patch.py
          git add scripts/browser/acceptance.mjs
          git commit -m "Run v50 responsive acceptance at desktop widths [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
