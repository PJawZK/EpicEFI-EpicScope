name: Temporary inline help typo fix
on:
  push:
    branches:
      - refactor/shared-inline-help
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-inline-help
          fetch-depth: 0
      - name: Fix imported help type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/idle-analyzer-help.ts')
          t = p.read_text()
          assert t.count('InlineInlineHelpEntry') == 1
          p.write_text(t.replace('InlineInlineHelpEntry', 'InlineHelpEntry', 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/idle-analyzer-help.ts
          git commit -m "Fix shared inline help type import"
          git push origin HEAD:refactor/shared-inline-help
