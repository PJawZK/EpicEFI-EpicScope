name: Apply priority capture during index

on:
  push:
    branches:
      - perf/priority-capture-during-index-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/priority-capture-during-index-v1
      - run: python tools/apply-priority-capture-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add core/parsers/mlg/mlg-channel-data.ts core/parsers/mlg/mlg-records.ts apps/web/src/workers/mlg-worker-protocol.ts apps/web/src/workers/mlg-import.worker.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/adapters/mlg-staged-import.ts apps/web/src/app/app-shell.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: capture restored channels during initial MLG scan"
          git push origin HEAD:perf/priority-capture-during-index-v1
