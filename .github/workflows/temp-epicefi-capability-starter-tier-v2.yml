name: Temporary EpicEFI capability starter transform v2
on:
  push:
    branches: [feat/epicefi-capability-starter-tier-v2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply capability-gated starter slice
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/state/semantic-channel-roles.ts')
          s = p.read_text()
          old = "  | 'vehicle.wheelSpeedRearRight'\n  | 'vehicle.longitudinalAcceleration';"
          new = """  | 'vehicle.wheelSpeedRearRight'\n  | 'vehicle.longitudinalAcceleration'\n  | 'transient.predictedMap'\n  | 'transient.mapPredictionActive'\n  | 'transient.wallFuelAmount';"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  'vehicle.longitudinalAcceleration': { id: 'vehicle.longitudinalAcceleration', displayName: 'Longitudinal Accel', aliases: ['accelerationLon', 'Accel: Longitudinal', 'Longitudinal Acceleration', 'Longitudinal Accel'], include: [/longitudinal.*(?:accel|acceleration)/i, /accel.*longitudinal/i], exclude: [/target/i, /limit/i] },\n};"""
          new = """  'vehicle.longitudinalAcceleration': { id: 'vehicle.longitudinalAcceleration', displayName: 'Longitudinal Accel', aliases: ['accelerationLon', 'Accel: Longitudinal', 'Longitudinal Acceleration', 'Longitudinal Accel'], include: [/longitudinal.*(?:accel|acceleration)/i, /accel.*longitudinal/i], exclude: [/target/i, /limit/i] },\n  'transient.predictedMap': { id: 'transient.predictedMap', displayName: 'Predicted MAP', aliases: ['fallbackMap', 'Predicted MAP', 'MAP Estimate', 'Estimated MAP'], include: [/fallback.*map/i, /predicted.*map/i, /estimated.*map/i], exclude: [/use.*(?:map.*estimate|estimate.*map)/i, /enable/i, /during.*transient/i, /blend/i, /table/i, /target/i, /error/i, /duration/i, /config/i, /raw/i] },\n  'transient.mapPredictionActive': { id: 'transient.mapPredictionActive', displayName: 'MAP Prediction Active', aliases: ['isMapPredictionActive', 'MAP Prediction Active', 'Prediction Active'], include: [/map.*prediction.*active/i, /prediction.*active.*map/i], exclude: [/enable/i, /table/i, /config/i, /duration/i] },\n  'transient.wallFuelAmount': { id: 'transient.wallFuelAmount', displayName: 'Wall Fuel Amount', aliases: ['wallFuelAmount', 'Fuel: wall amount', 'Wall Fuel Amount', 'Fuel on the wall'], include: [/wall.*fuel.*amount/i, /fuel.*wall.*amount/i, /^fuel on the wall$/i], exclude: [/correction/i, /tau/i, /beta/i, /table/i, /config/i] },\n};"""
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/state/built-in-workspace-templates.ts')
          s = p.read_text()
          old = """export interface BuiltInWorkspaceTemplate {\n  readonly id: string;\n  readonly name: string;\n  readonly layout: GraphWorkspaceLayout;\n  readonly panes: readonly BuiltInWorkspacePaneTemplate[];\n  readonly description?: string;\n  readonly developmentOnly?: boolean;\n}"""
          new = """export interface StarterWorkspaceAvailability {\n  /** Every listed semantic capability must resolve before this starter is offered. */\n  readonly allOfRoleIds: readonly SemanticChannelRoleId[];\n}\n\nexport interface BuiltInWorkspaceTemplate {\n  readonly id: string;\n  readonly name: string;\n  readonly layout: GraphWorkspaceLayout;\n  readonly panes: readonly BuiltInWorkspacePaneTemplate[];\n  readonly description?: string;\n  readonly tier?: 'generic' | 'epicefi';\n  readonly availability?: StarterWorkspaceAvailability;\n  readonly developmentOnly?: boolean;\n}"""
          assert old in s
          s = s.replace(old, new, 1)
          anchor = """export const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,"""
          inserted = """export const EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'epicefi-map-predict-wall-wetting-dual',\n  name: 'EpicEFI · MAP Predict + Wall Wetting',\n  description: 'EpicEFI predictive-MAP and intake-wall fuel model diagnostics.',\n  tier: 'epicefi',\n  availability: {\n    allOfRoleIds: [\n      'transient.predictedMap',\n      'transient.effectiveMap',\n      'transient.mapPredictionActive',\n      'transient.wallFuelAmount',\n      'transient.wallFuelCorrection',\n    ],\n  },\n  layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'engine.throttle.position', requirement: 'required' },\n      { roleId: 'transient.tpsDelta', requirement: 'preferred' },\n      { roleId: 'engine.map', requirement: 'required' },\n      { roleId: 'transient.predictedMap', requirement: 'required' },\n      { roleId: 'transient.effectiveMap', requirement: 'required' },\n      { roleId: 'transient.mapPredictionActive', requirement: 'required' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'fuel.lambda', requirement: 'preferred' },\n      { roleId: 'fuel.injectorPulseWidth', requirement: 'preferred' },\n      { roleId: 'transient.aeFuel', requirement: 'preferred' },\n      { roleId: 'transient.wallFuelAmount', requirement: 'required' },\n      { roleId: 'transient.wallFuelCorrection', requirement: 'required' },\n    ] },\n  ],\n};\n\nexport const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,"""
          assert anchor in s
          s = s.replace(anchor, inserted, 1)
          old = """  ELECTRICAL_DUAL_WORKSPACE,\n  VEHICLE_DRIVELINE_DUAL_WORKSPACE,\n]);\n\nexport function starterWorkspaceTemplate"""
          new = """  ELECTRICAL_DUAL_WORKSPACE,\n  VEHICLE_DRIVELINE_DUAL_WORKSPACE,\n  EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE,\n]);\n\nexport function starterWorkspaceAvailable(\n  template: StarterWorkspaceTemplate,\n  channels: readonly ChannelDefinition[],\n  options: SemanticChannelResolveOptions = {},\n): boolean {\n  const capabilities = template.availability?.allOfRoleIds ?? [];\n  return capabilities.every((roleId) => Boolean(resolveSemanticChannelRole(roleId, channels, options).channel));\n}\n\nexport function availableStarterWorkspaceTemplates(\n  channels: readonly ChannelDefinition[],\n  options: SemanticChannelResolveOptions = {},\n): readonly StarterWorkspaceTemplate[] {\n  return STARTER_WORKSPACE_TEMPLATES.filter((template) => starterWorkspaceAvailable(template, channels, options));\n}\n\nexport function starterWorkspaceTemplate"""
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/pages/logger-page.ts')
          s = p.read_text()
          s = s.replace("""  STARTER_WORKSPACE_TEMPLATES,\n  resolveStarterWorkspaceTemplate,""", """  availableStarterWorkspaceTemplates,\n  resolveStarterWorkspaceTemplate,""", 1)
          old = """interface GraphSelectorController {\n  readonly element: HTMLElement;\n  setWorkspaces(workspaces: readonly GraphWorkspaceSummary[], activeId: string): void;\n  setEnabled(enabled: boolean): void;"""
          new = """interface GraphSelectorController {\n  readonly element: HTMLElement;\n  setWorkspaces(workspaces: readonly GraphWorkspaceSummary[], activeId: string): void;\n  setTemplates(templates: readonly StarterWorkspaceTemplate[]): void;\n  setEnabled(enabled: boolean): void;"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  let activeId = SINGLE_RESOLVER_RUNTIME_ID;\n  let enabled = false;"""
          new = """  let activeId = SINGLE_RESOLVER_RUNTIME_ID;\n  let templates: readonly StarterWorkspaceTemplate[] = availableStarterWorkspaceTemplates([]);\n  let enabled = false;"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  const templateFragment = document.createDocumentFragment();\n  for (const template of STARTER_WORKSPACE_TEMPLATES) {\n    const templateButton = document.createElement('button');\n    templateButton.type = 'button';\n    templateButton.dataset.workspaceTemplateId = template.id;\n    const label = document.createElement('span');\n    label.textContent = template.name;\n    templateButton.append(label);\n    if (template.description) {\n      const detail = document.createElement('small');\n      detail.className = 'graph-selector-template-detail';\n      detail.textContent = template.description;\n      templateButton.append(detail);\n    }\n    templateFragment.append(templateButton);\n  }\n  templateList.replaceChildren(templateFragment);"""
          new = """  const renderTemplates = (): void => {\n    const templateFragment = document.createDocumentFragment();\n    for (const template of templates) {\n      const templateButton = document.createElement('button');\n      templateButton.type = 'button';\n      templateButton.dataset.workspaceTemplateId = template.id;\n      const label = document.createElement('span');\n      label.textContent = template.name;\n      templateButton.append(label);\n      if (template.description) {\n        const detail = document.createElement('small');\n        detail.className = 'graph-selector-template-detail';\n        detail.textContent = template.description;\n        templateButton.append(detail);\n      }\n      templateFragment.append(templateButton);\n    }\n    templateList.replaceChildren(templateFragment);\n  };\n  renderTemplates();"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """    setWorkspaces: (nextWorkspaces, nextActiveId) => {\n      workspaces = nextWorkspaces;\n      activeId = nextActiveId;\n      render();\n    },\n    setEnabled:"""
          new = """    setWorkspaces: (nextWorkspaces, nextActiveId) => {\n      workspaces = nextWorkspaces;\n      activeId = nextActiveId;\n      render();\n    },\n    setTemplates: (nextTemplates) => {\n      templates = nextTemplates;\n      renderTemplates();\n    },\n    setEnabled:"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """    catalogChannelDefinitions = new Map(channels.map((channel) => [channel.id, channel]));\n    catalogSourceName = sourceName;\n\n    if (!channelDataSource) {\n      graphSelector.setEnabled(loggerWorkspaceEditingAvailable(channels.length));"""
          new = """    catalogChannelDefinitions = new Map(channels.map((channel) => [channel.id, channel]));\n    catalogSourceName = sourceName;\n\n    if (!channelDataSource) {\n      graphSelector.setTemplates(availableStarterWorkspaceTemplates(channels));\n      graphSelector.setEnabled(loggerWorkspaceEditingAvailable(channels.length));"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """    if (!channelDataSource) {\n      channelDefinitions.clear();\n      unavailableChannelIds.clear();"""
          new = """    if (!channelDataSource) {\n      graphSelector.setTemplates(availableStarterWorkspaceTemplates([]));\n      channelDefinitions.clear();\n      unavailableChannelIds.clear();"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """    channelDefinitions = new Map(summary.channels.map((channel) => [channel.id, channel]));\n    channelIdAliases = new Map(options.channelIdAliases ?? []);"""
          new = """    channelDefinitions = new Map(summary.channels.map((channel) => [channel.id, channel]));\n    graphSelector.setTemplates(availableStarterWorkspaceTemplates(summary.channels));\n    channelIdAliases = new Map(options.channelIdAliases ?? []);"""
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/built-in-workspace-templates.test.ts')
          s = p.read_text()
          old = """      'Trigger / Sync', 'Startup / Warmup', 'Electrical', 'Vehicle / Driveline',\n    ]);"""
          new = """      'Trigger / Sync', 'Startup / Warmup', 'Electrical', 'Vehicle / Driveline',\n      'EpicEFI · MAP Predict + Wall Wetting',\n    ]);"""
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/electrical-driveline-starters.test.ts')
          s = p.read_text()
          old = "it('completes the generic starter catalog', () => expect(STARTER_WORKSPACE_TEMPLATES.slice(-2).map((t) => t.name)).toEqual(['Electrical', 'Vehicle / Driveline']));"
          new = "it('completes the generic starter catalog', () => expect(STARTER_WORKSPACE_TEMPLATES.filter((t) => t.tier !== 'epicefi').slice(-2).map((t) => t.name)).toEqual(['Electrical', 'Vehicle / Driveline']));"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/epicefi-capability-starters.test.ts')
          assert not p.exists()
          p.write_text("""import { describe, expect, it } from 'vitest';\nimport type { ChannelDefinition } from '../../core/log-model/log-types';\nimport { EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE, availableStarterWorkspaceTemplates, resolveStarterWorkspaceTemplate, starterWorkspaceAvailable } from '../../apps/web/src/state/built-in-workspace-templates';\nimport { resolveSemanticChannelRole } from '../../apps/web/src/state/semantic-channel-roles';\nfunction channel(id: string, sourceName = id, displayName = sourceName): ChannelDefinition { return { id, sourceName, displayName, valueType: 'number' }; }\nconst capabilityChannels = [\n  channel('ini:RPMValue','RPMValue','RPM'), channel('ini:TPSValue','TPSValue','TPS'), channel('ini:deltaTps','deltaTps','AE: TPS change'), channel('ini:MAPValue','MAPValue','MAP'),\n  channel('ini:fallbackMap','fallbackMap','fallbackMap'), channel('ini:effectiveMap','effectiveMap','Effective MAP'), channel('ini:isMapPredictionActive','isMapPredictionActive','isMapPredictionActive'),\n  channel('ini:lambdaValue','lambdaValue','Lambda'), channel('ini:actualLastInjection','actualLastInjection','Fuel: Last inj pulse width'), channel('ini:tpsAccelFuel','tpsAccelFuel','Fuel: TPS AE add fuel ms'),\n  channel('ini:wallFuelAmount','wallFuelAmount','Fuel: wall amount'), channel('ini:wallFuelCorrection','wallFuelCorrection','fuel wallwetting injection time'),\n];\ndescribe('capability-gated EpicEFI starters', () => {\n  it('keeps generic starters available while hiding EpicEFI-specific starters without capabilities', () => {\n    const names=availableStarterWorkspaceTemplates([]).map((t)=>t.name); expect(names).toContain('General'); expect(names).toContain('Vehicle / Driveline'); expect(names).not.toContain('EpicEFI · MAP Predict + Wall Wetting');\n  });\n  it('offers MAP Predict + Wall Wetting only when its full runtime capability bundle resolves', () => {\n    expect(starterWorkspaceAvailable(EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE, capabilityChannels)).toBe(true);\n    expect(availableStarterWorkspaceTemplates(capabilityChannels).map((t)=>t.name)).toContain('EpicEFI · MAP Predict + Wall Wetting');\n    expect(starterWorkspaceAvailable(EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE, capabilityChannels.filter((c)=>c.sourceName!=='isMapPredictionActive'))).toBe(false);\n  });\n  it('resolves the specialized starter onto the current EpicEFI runtime identities', () => {\n    const r=resolveStarterWorkspaceTemplate(EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE, capabilityChannels);\n    expect(r.panes[0]?.channelIds).toEqual(['ini:RPMValue','ini:TPSValue','ini:deltaTps','ini:MAPValue','ini:fallbackMap','ini:effectiveMap','ini:isMapPredictionActive']);\n    expect(r.panes[1]?.channelIds).toEqual(['ini:lambdaValue','ini:actualLastInjection','ini:tpsAccelFuel','ini:wallFuelAmount','ini:wallFuelCorrection']);\n    expect(r.unresolvedRequiredRoleIds).toEqual([]);\n  });\n  it('does not mistake MAP prediction configuration for runtime capability', () => {\n    const configOnly=[channel('mapPredictionBlendDuration','mapPredictionBlendDuration','Predictive MAP Blend Duration'),channel('useMapEstimateDuringTransient','useMapEstimateDuringTransient','Use MAP estimate during transient'),channel('wwaeTau','wwaeTau','Wall wetting tau'),channel('wwaeBeta','wwaeBeta','Wall wetting beta')];\n    expect(resolveSemanticChannelRole('transient.predictedMap',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('transient.mapPredictionActive',configOnly).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('transient.wallFuelAmount',configOnly).channel).toBeUndefined();\n    expect(starterWorkspaceAvailable(EPICEFI_MAP_PREDICT_WALL_WETTING_DUAL_WORKSPACE,configOnly)).toBe(false);\n  });\n});\n""")

          p = Path('docs/PREPOPULATED_WORKSPACES.md')
          s = p.read_text()
          old = """## EpicEFI-specific starter tier\n\nGeneric starters should remain portable across ECU families. Richer starters may be exposed only where the active schema provides the required capabilities, for example:\n\n- **EpicEFI · Dual Chamber Boost**;\n- **EpicEFI · MAP Predict + Wall Wetting**;\n- **EpicEFI · ETB Control**;\n- **EpicEFI · Fuel Rail Diagnostics**;\n- **EpicEFI · Trigger + Sync Detailed**;\n- **EpicEFI · Injector / Ignition Timing**;\n- **EpicEFI · Engine Protection**.\n\nCapability detection should use semantic roles/schema capabilities rather than hard-coded board names such as `if ECU == Mega144H7`."""
          new = """## EpicEFI-specific starter tier\n\nGeneric starters remain portable across ECU families. Specialized starters are capability-gated: they are offered only when every semantic role in the starter's availability bundle resolves against the active channel schema. Detection is therefore based on runtime/schema capabilities rather than hard-coded board names such as `if ECU == Mega144H7`.\n\nImplemented specialized starter:\n\n- **EpicEFI · MAP Predict + Wall Wetting** — Dual layout. Pane 1: RPM, TPS, TPS change, live MAP, predicted/fallback MAP, effective MAP and prediction-active state. Pane 2: Lambda, injector pulse width, TPS AE fuel, wall-fuel amount and wall-fuel correction. The menu exposes it only when predicted MAP, effective MAP, prediction-active state, wall-fuel amount and wall-fuel correction all resolve.\n\nPlanned specialized candidates remain:\n\n- **EpicEFI · Dual Chamber Boost**;\n- **EpicEFI · ETB Control**;\n- **EpicEFI · Fuel Rail Diagnostics**;\n- **EpicEFI · Trigger + Sync Detailed**;\n- **EpicEFI · Injector / Ignition Timing**;\n- **EpicEFI · Engine Protection**.\n\nCapability gating affects only starter discovery. Once materialized, the resulting workspace is still an ordinary editable workspace and is not owned by the capability detector."""
          assert old in s
          p.write_text(s.replace(old, new, 1))
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts apps/web/src/pages/logger-page.ts tests/web/built-in-workspace-templates.test.ts tests/web/electrical-driveline-starters.test.ts tests/web/epicefi-capability-starters.test.ts docs/PREPOPULATED_WORKSPACES.md
          git commit -m "feat: add capability-gated EpicEFI starter tier"
          git push
