name: Temporary Range Compare percentile UI
on:
  push:
    branches:
      - feature/range-compare-percentiles
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/range-compare-percentiles
          fetch-depth: 0
      - name: Add percentile rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/analyzer-page.ts')
          text = path.read_text()
          old = (
              "    const unit = trace.channel.unit ? ` ${trace.channel.unit}` : '';\n"
              "    const rows: Array<{ label: string; key: 'count' | 'mean' | 'min' | 'max' | 'standard-deviation'; unit: string }> = [\n"
              "      { label: 'Valid samples', key: 'count', unit: '' },\n"
              "      { label: 'Mean', key: 'mean', unit },\n"
              "      { label: 'Minimum', key: 'min', unit },\n"
              "      { label: 'Maximum', key: 'max', unit },\n"
              "      { label: 'Std dev', key: 'standard-deviation', unit },\n"
              "    ];\n"
              "    tableBody.replaceChildren(...rows.map((row) => {\n"
              "      const metric = currentResult!.metrics[row.key];\n"
          )
          new = (
              "    const unit = trace.channel.unit ? ` ${trace.channel.unit}` : '';\n"
              "    const rows = [\n"
              "      { label: 'Valid samples', metric: currentResult.metrics.count, unit: '' },\n"
              "      { label: 'Mean', metric: currentResult.metrics.mean, unit },\n"
              "      { label: 'P10', metric: currentResult.percentiles.p10, unit },\n"
              "      { label: 'Median', metric: currentResult.percentiles.median, unit },\n"
              "      { label: 'P90', metric: currentResult.percentiles.p90, unit },\n"
              "      { label: 'Minimum', metric: currentResult.metrics.min, unit },\n"
              "      { label: 'Maximum', metric: currentResult.metrics.max, unit },\n"
              "      { label: 'Std dev', metric: currentResult.metrics['standard-deviation'], unit },\n"
              "    ];\n"
              "    tableBody.replaceChildren(...rows.map((row) => {\n"
              "      const metric = row.metric;\n"
          )
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/analyzer-page.ts
          git commit -m "Show percentile metrics in Range Compare"
          git push origin HEAD:feature/range-compare-percentiles
