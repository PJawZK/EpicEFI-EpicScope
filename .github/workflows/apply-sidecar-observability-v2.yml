name: Apply sidecar observability v2

on:
  push:
    branches:
      - perf/mlg-sidecar-observability-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply sidecar observability v2 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mlg-sidecar-observability-v2
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/workers/mlg-import.worker.ts',
              'const SERIAL_VALIDATION_CHUNK_SIZE = 8 * 1024 * 1024;',
              'const SERIAL_VALIDATION_CHUNK_SIZE = 32 * 1024 * 1024;',
          )

          perf = 'apps/web/src/components/performance-diagnostics.ts'
          replace_once(
              perf,
              "  readonly validationMode?: 'serial' | 'parallel';\n}",
              "  readonly validationMode?: 'serial' | 'parallel';\n"
              "  readonly sidecarStatus?: 'built' | 'reused';\n"
              "  readonly sidecarTotalMs?: number;\n"
              "  readonly sidecarTransposeMs?: number;\n"
              "  readonly sidecarWriteMs?: number;\n"
              "  readonly sidecarBytesWritten?: number;\n"
              "  readonly sidecarStripeCount?: number;\n"
              "  readonly sidecarTargetStripeBytes?: number;\n"
              "  readonly sidecarTotalBytes?: number;\n"
              "}\n",
          )
          replace_once(
              perf,
              "  readonly validationMode: 'serial' | 'parallel';\n}",
              "  readonly validationMode: 'serial' | 'parallel';\n"
              "  readonly sidecarStatus?: 'built' | 'reused';\n"
              "  readonly sidecarTotalMs?: number;\n"
              "  readonly sidecarTransposeMs?: number;\n"
              "  readonly sidecarWriteMs?: number;\n"
              "  readonly sidecarBytesWritten?: number;\n"
              "  readonly sidecarStripeCount?: number;\n"
              "  readonly sidecarTargetStripeBytes?: number;\n"
              "  readonly sidecarTotalBytes?: number;\n"
              "}\n",
          )
          replace_once(
              perf,
              "          `validationChecksumBytes=${latestLoad.validationChecksumBytes ?? 0}`,\n        );\n      }",
              "          `validationChecksumBytes=${latestLoad.validationChecksumBytes ?? 0}`,\n        );\n"
              "        if (latestLoad.sidecarStatus) {\n"
              "          lines.push(\n"
              "            '[MLG column sidecar]',\n"
              "            `status=${latestLoad.sidecarStatus}`,\n"
              "            `total=${(latestLoad.sidecarTotalMs ?? 0).toFixed(2)} ms`,\n"
              "            `transpose=${(latestLoad.sidecarTransposeMs ?? 0).toFixed(2)} ms`,\n"
              "            `write=${(latestLoad.sidecarWriteMs ?? 0).toFixed(2)} ms`,\n"
              "            `other=${Math.max(0, (latestLoad.sidecarTotalMs ?? 0) - (latestLoad.sidecarTransposeMs ?? 0) - (latestLoad.sidecarWriteMs ?? 0)).toFixed(2)} ms`,\n"
              "            `bytesWritten=${latestLoad.sidecarBytesWritten ?? 0}`,\n"
              "            `stripes=${latestLoad.sidecarStripeCount ?? 0}`,\n"
              "            `targetStripeBytes=${latestLoad.sidecarTargetStripeBytes ?? 0}`,\n"
              "            `storedBytes=${latestLoad.sidecarTotalBytes ?? 0}`,\n"
              "          );\n"
              "        }\n"
              "      }",
          )
          replace_once(
              perf,
              "          validationChecksumBytes: run.validationChecksumBytes,\n          validationMode: run.validationMode,\n",
              "          validationChecksumBytes: run.validationChecksumBytes,\n"
              "          validationMode: run.validationMode,\n"
              "          ...(run.sidecarStatus ? {\n"
              "            sidecarStatus: run.sidecarStatus,\n"
              "            sidecarTotalMs: run.sidecarTotalMs ?? 0,\n"
              "            sidecarTransposeMs: run.sidecarTransposeMs ?? 0,\n"
              "            sidecarWriteMs: run.sidecarWriteMs ?? 0,\n"
              "            sidecarBytesWritten: run.sidecarBytesWritten ?? 0,\n"
              "            sidecarStripeCount: run.sidecarStripeCount ?? 0,\n"
              "            sidecarTargetStripeBytes: run.sidecarTargetStripeBytes ?? 0,\n"
              "            sidecarTotalBytes: run.sidecarTotalBytes ?? 0,\n"
              "          } : {}),\n",
          )

          app = 'apps/web/src/app/app-shell.ts'
          replace_once(
              app,
              "              validationChecksumBytes: validated.performance.checksumBytes,\n              validationMode: validated.validationMode,\n",
              "              validationChecksumBytes: validated.performance.checksumBytes,\n"
              "              validationMode: validated.validationMode,\n"
              "              ...(validated.sidecar ? {\n"
              "                sidecarStatus: validated.sidecar.performance.totalMs === 0 ? 'reused' as const : 'built' as const,\n"
              "                sidecarTotalMs: validated.sidecar.performance.totalMs,\n"
              "                sidecarTransposeMs: validated.sidecar.performance.transposeMs,\n"
              "                sidecarWriteMs: validated.sidecar.performance.writeMs,\n"
              "                sidecarBytesWritten: validated.sidecar.performance.bytesWritten,\n"
              "                sidecarStripeCount: validated.sidecar.manifest.stripes.length,\n"
              "                sidecarTargetStripeBytes: validated.sidecar.manifest.targetStripeBytes,\n"
              "                sidecarTotalBytes: validated.sidecar.manifest.totalBytes,\n"
              "              } : {}),\n",
          )
          PY
      - name: Commit patch
        run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/workers/mlg-import.worker.ts apps/web/src/components/performance-diagnostics.ts apps/web/src/app/app-shell.ts
          git commit -m "Apply sidecar observability v2 patch"
          git push origin HEAD:perf/mlg-sidecar-observability-v2
