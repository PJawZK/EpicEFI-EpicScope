name: Temporary final render instrumentation patch
on:
  push:
    branches:
      - diag/final-render-instrumentation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/final-render-instrumentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/components/graph-viewport.ts')
          s = p.read_text()
          old = """  readonly renderMs: number;\n  readonly sampleCount: number;\n"""
          new = """  readonly renderMs: number;\n  readonly statisticsMs?: number | undefined;\n  readonly applyMs?: number | undefined;\n  readonly readoutMs?: number | undefined;\n  readonly cursorMs?: number | undefined;\n  readonly envelopeMs?: number | undefined;\n  readonly drawSetupMs?: number | undefined;\n  readonly drawTraceMs?: number | undefined;\n  readonly drawOverlayMs?: number | undefined;\n  readonly drawRemainderMs?: number | undefined;\n  readonly sampleCount: number;\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """      const cacheHits = new Set(result.performance.cacheHitChannelIds);\n      const scaleTimes = new Map<string, number>();\n      const usedColors = new Set([...activeTraces.values()].map((trace) => trace.color));\n\n      for (const [channelId, pending] of batch) {\n"""
          new = """      const cacheHits = new Set(result.performance.cacheHitChannelIds);\n      const scaleTimes = new Map<string, number>();\n      let statisticsMs = 0;\n      let applyMs = 0;\n      const usedColors = new Set([...activeTraces.values()].map((trace) => trace.color));\n\n      for (const [channelId, pending] of batch) {\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """        const scale = buildStableValueScale(range);\n        scaleTimes.set(channelId, now() - scaleStart);\n        const color = TRACE_COLORS.find((candidate) => !usedColors.has(candidate)) ?? TRACE_COLORS[0];\n        usedColors.add(color);\n        activeTraces.set(channelId, {\n          channel: pending.channel,\n          range,\n          scale,\n          fullStatistics: summarizeNumericRange(range),\n          statisticsComplete: requestRange.phase === 'full',\n          color,\n        });\n      }\n\n      overlay.hidden = activeTraces.size > 0;\n      renderReadout();\n      emitCursorValues();\n      const renderStart = now();\n      draw();\n      const renderMs = now() - renderStart;\n"""
          new = """        const scale = buildStableValueScale(range);\n        scaleTimes.set(channelId, now() - scaleStart);\n        const statisticsStart = now();\n        const fullStatistics = summarizeNumericRange(range);\n        statisticsMs += now() - statisticsStart;\n        const applyStart = now();\n        const color = TRACE_COLORS.find((candidate) => !usedColors.has(candidate)) ?? TRACE_COLORS[0];\n        usedColors.add(color);\n        activeTraces.set(channelId, {\n          channel: pending.channel,\n          range,\n          scale,\n          fullStatistics,\n          statisticsComplete: requestRange.phase === 'full',\n          color,\n        });\n        applyMs += now() - applyStart;\n      }\n\n      overlay.hidden = activeTraces.size > 0;\n      const readoutStart = now();\n      renderReadout();\n      const readoutMs = now() - readoutStart;\n      const cursorStart = now();\n      emitCursorValues();\n      const cursorMs = now() - cursorStart;\n      measuredEnvelopeBuildMs = 0;\n      measuredDrawSetupMs = 0;\n      measuredDrawTraceMs = 0;\n      measuredDrawOverlayMs = 0;\n      measureEnvelopeBuild = true;\n      const renderStart = now();\n      draw();\n      const renderMs = now() - renderStart;\n      measureEnvelopeBuild = false;\n      const drawRemainderMs = Math.max(0, renderMs - measuredEnvelopeBuildMs - measuredDrawSetupMs - measuredDrawTraceMs - measuredDrawOverlayMs);\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """          renderMs,\n          sampleCount: range.values.length,\n"""
          new = """          renderMs,\n          statisticsMs,\n          applyMs,\n          readoutMs,\n          cursorMs,\n          envelopeMs: measuredEnvelopeBuildMs,\n          drawSetupMs: measuredDrawSetupMs,\n          drawTraceMs: measuredDrawTraceMs,\n          drawOverlayMs: measuredDrawOverlayMs,\n          drawRemainderMs,\n          sampleCount: range.values.length,\n"""
          assert s.count(old) >= 1
          s = s.replace(old, new, 1)

          old = """      const completedChannelIds: string[] = [];\n      for (const channelId of candidates) {\n"""
          new = """      const completedChannelIds: string[] = [];\n      let statisticsMs = 0;\n      let applyMs = 0;\n      for (const channelId of candidates) {\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """        activeTraces.set(channelId, {\n          ...latest,\n          range,\n          scale: latest.scale,\n          fullStatistics: summarizeNumericRange(range),\n          statisticsComplete: true,\n        });\n        envelopeCache.delete(channelId);\n        completedChannelIds.push(channelId);\n"""
          new = """        const statisticsStart = now();\n        const fullStatistics = summarizeNumericRange(range);\n        statisticsMs += now() - statisticsStart;\n        const applyStart = now();\n        activeTraces.set(channelId, {\n          ...latest,\n          range,\n          scale: latest.scale,\n          fullStatistics,\n          statisticsComplete: true,\n        });\n        envelopeCache.delete(channelId);\n        completedChannelIds.push(channelId);\n        applyMs += now() - applyStart;\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """      if (completedChannelIds.length === 0) return;\n      renderReadout();\n      emitCursorValues();\n      const renderStart = now();\n      draw();\n      const renderMs = now() - renderStart;\n"""
          new = """      if (completedChannelIds.length === 0) return;\n      const readoutStart = now();\n      renderReadout();\n      const readoutMs = now() - readoutStart;\n      const cursorStart = now();\n      emitCursorValues();\n      const cursorMs = now() - cursorStart;\n      measuredEnvelopeBuildMs = 0;\n      measuredDrawSetupMs = 0;\n      measuredDrawTraceMs = 0;\n      measuredDrawOverlayMs = 0;\n      measureEnvelopeBuild = true;\n      const renderStart = now();\n      draw();\n      const renderMs = now() - renderStart;\n      measureEnvelopeBuild = false;\n      const drawRemainderMs = Math.max(0, renderMs - measuredEnvelopeBuildMs - measuredDrawSetupMs - measuredDrawTraceMs - measuredDrawOverlayMs);\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          marker = """          renderMs,\n          sampleCount: range.values.length,\n          batchSize: candidates.length,\n"""
          repl = """          renderMs,\n          statisticsMs,\n          applyMs,\n          readoutMs,\n          cursorMs,\n          envelopeMs: measuredEnvelopeBuildMs,\n          drawSetupMs: measuredDrawSetupMs,\n          drawTraceMs: measuredDrawTraceMs,\n          drawOverlayMs: measuredDrawOverlayMs,\n          drawRemainderMs,\n          sampleCount: range.values.length,\n          batchSize: candidates.length,\n"""
          assert s.count(marker) == 1
          s = s.replace(marker, repl)
          p.write_text(s)

          p = Path('apps/web/src/components/performance-diagnostics.ts')
          s = p.read_text()
          old = """  readonly renderMs: number;\n  readonly sampleCount: number;\n"""
          new = """  readonly renderMs: number;\n  readonly statisticsMs?: number | undefined;\n  readonly applyMs?: number | undefined;\n  readonly readoutMs?: number | undefined;\n  readonly cursorMs?: number | undefined;\n  readonly envelopeMs?: number | undefined;\n  readonly drawSetupMs?: number | undefined;\n  readonly drawTraceMs?: number | undefined;\n  readonly drawOverlayMs?: number | undefined;\n  readonly drawRemainderMs?: number | undefined;\n  readonly sampleCount: number;\n"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('apps/web/src/app/app-shell.ts')
          s = p.read_text()
          old = """      renderMs: run.renderMs,\n      sampleCount: run.sampleCount,\n"""
          new = """      renderMs: run.renderMs,\n      statisticsMs: run.statisticsMs,\n      applyMs: run.applyMs,\n      readoutMs: run.readoutMs,\n      cursorMs: run.cursorMs,\n      envelopeMs: run.envelopeMs,\n      drawSetupMs: run.drawSetupMs,\n      drawTraceMs: run.drawTraceMs,\n      drawOverlayMs: run.drawOverlayMs,\n      drawRemainderMs: run.drawRemainderMs,\n      sampleCount: run.sampleCount,\n"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('apps/web/src/components/performance-diagnostics-report.ts')
          s = p.read_text()
          old = """        const lowLevel = [\n          run.persistentLookupMs !== undefined ? `persistentLookup=${run.persistentLookupMs.toFixed(2)} ms` : '',\n"""
          new = """        const renderDetail = [\n          run.statisticsMs !== undefined ? `statistics=${run.statisticsMs.toFixed(2)} ms` : '',\n          run.applyMs !== undefined ? `apply=${run.applyMs.toFixed(2)} ms` : '',\n          run.readoutMs !== undefined ? `readout=${run.readoutMs.toFixed(2)} ms` : '',\n          run.cursorMs !== undefined ? `cursor=${run.cursorMs.toFixed(2)} ms` : '',\n          run.envelopeMs !== undefined ? `envelope=${run.envelopeMs.toFixed(2)} ms` : '',\n          run.drawSetupMs !== undefined ? `drawSetup=${run.drawSetupMs.toFixed(2)} ms` : '',\n          run.drawTraceMs !== undefined ? `drawTrace=${run.drawTraceMs.toFixed(2)} ms` : '',\n          run.drawOverlayMs !== undefined ? `drawOverlay=${run.drawOverlayMs.toFixed(2)} ms` : '',\n          run.drawRemainderMs !== undefined ? `drawRemainder=${run.drawRemainderMs.toFixed(2)} ms` : '',\n        ].filter(Boolean).join('; ');\n        const lowLevel = [\n          run.persistentLookupMs !== undefined ? `persistentLookup=${run.persistentLookupMs.toFixed(2)} ms` : '',\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = """; physicalReadMs=${run.physicalReadMs.toFixed(2)} ms${lowLevel ? `; ${lowLevel}` : ''}`,\n"""
          new = """; physicalReadMs=${run.physicalReadMs.toFixed(2)} ms${renderDetail ? `; ${renderDetail}` : ''}${lowLevel ? `; ${lowLevel}` : ''}`,\n"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/graph-viewport.ts apps/web/src/components/performance-diagnostics.ts apps/web/src/components/performance-diagnostics-report.ts apps/web/src/app/app-shell.ts
          git commit -m 'diag: instrument graph render phases'
          git push
