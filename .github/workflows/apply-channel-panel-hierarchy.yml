name: Apply channel panel hierarchy

on:
  push:
    branches:
      - ui/channel-panel-hierarchy-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply channel panel hierarchy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/channel-panel-hierarchy-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply-channel-panel-hierarchy.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/panels/inspector-panel.ts apps/web/src/styles/app.css
          git commit -m "UI: simplify channel browser hierarchy"
          git push
