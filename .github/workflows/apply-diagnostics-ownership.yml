name: Apply diagnostics ownership cleanup

on:
  push:
    branches:
      - cleanup/realign-diagnostics-ownership-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply diagnostics ownership cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/realign-diagnostics-ownership-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/realign-diagnostics-ownership.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core apps/web/src tests
          git commit -m "Cleanup: realign diagnostics ownership"
          git push
