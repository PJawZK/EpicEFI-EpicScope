    if (!this.#baseline || this.#baselineRows !== snapshot.rows || this.#baselineCols !== snapshot.cols) {
      this.#baseline = [...snapshot.values];
      this.#baselineRows = snapshot.rows;
      this.#baselineCols = snapshot.cols;
