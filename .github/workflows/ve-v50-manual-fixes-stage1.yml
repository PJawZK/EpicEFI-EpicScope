.ve-workbench-table td[data-table-value-state='lower'],
.ve-delay-table td[data-table-value-state='lower'] { color: #73bfff !important; }
.ve-workbench-table td[data-table-value-state='higher'],
.ve-delay-table td[data-table-value-state='higher'] { color: #ff7d83 !important; }

