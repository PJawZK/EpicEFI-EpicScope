name: Temporary Range Compare wording
on:
  push:
    branches:
      - feature/range-compare-scopes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/range-compare-scopes
          fetch-depth: 0
      - name: Update Range Compare wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/analyzer-page.ts')
          text = path.read_text()
          old = '<h1>Saved range comparison</h1>'
          new = '<h1>Range comparison</h1>'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = "      heading.textContent = 'Saved range comparison';"
          new = "      heading.textContent = 'Range comparison';"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/analyzer-page.ts
          git commit -m "Update Range Compare scope wording"
          git push origin HEAD:feature/range-compare-scopes
