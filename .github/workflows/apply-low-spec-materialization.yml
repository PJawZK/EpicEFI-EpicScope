name: Low spec materialization patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_low_spec_materialization.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          rm scripts/patch_low_spec_materialization.py
          rm .github/workflows/apply-low-spec-materialization.yml
          git config user.name PJawZK
          git config user.email anderswedin@hotmail.se
          git add apps/web/src/components/graph-viewport.ts scripts/patch_low_spec_materialization.py .github/workflows/apply-low-spec-materialization.yml
          git commit -m 'Perf: defer low-spec channel materialization until idle'
          git push origin HEAD:perf/low-spec-idle-materialization
