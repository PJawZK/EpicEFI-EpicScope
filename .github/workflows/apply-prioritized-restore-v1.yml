name: Apply prioritized restored-channel sidecar gate

on:
  push:
    branches:
      - perf/prioritize-restored-channels-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/prioritize-restored-channels-v1
      - run: python tools/apply-prioritized-restore-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/adapters/mlg-column-sidecar-v1.ts apps/web/src/adapters/mlg-staged-import.ts apps/web/src/app/app-shell.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: prioritize restored channels during sidecar build"
          git push origin HEAD:perf/prioritize-restored-channels-v1
