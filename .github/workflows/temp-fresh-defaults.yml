name: Temporary fresh defaults validation

on:
  push:
    branches:
      - fix/fresh-generic-workspaces-single-context

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-generic-workspaces-single-context
      - name: Apply guarded transform
        run: python .github/scripts/temp_fresh_defaults.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/state/built-in-workspace-templates.ts apps/web/src/pages/logger-page.ts tests/web/built-in-workspace-templates.test.ts docs/PREPOPULATED_WORKSPACES.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'fix: seed generic workspaces and restore single graph context'
            git push
          fi
