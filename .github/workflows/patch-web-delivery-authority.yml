name: Patch Web delivery authority

on:
  push:
    branches:
      - phase1/web-boot

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase1/web-boot

      - name: Update authority documents
        shell: python
        run: |
          from pathlib import Path

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          marker = '## Superseding decisions\n'
          addition = '''## D-035 — GitHub-hosted Web delivery\n\n**Status:** Approved\n\nDuring the Web stage, the normal project-owner workflow must not require a local clone, Node.js, npm, or a development environment.\n\nGitHub Actions is the authoritative automated Web build/type-check path and GitHub Pages is the normal hosted browser test/distribution surface. Local development remains optional for contributors.\n\nThe Pages-hosted application is still local-first: selecting a local log/tune file for analysis must not upload its contents merely because the application itself is hosted by GitHub Pages.\n\nThe initial repository Pages path is `/EpicEFI-EpicScope/`, and Vite build configuration must respect that base path.\n\n`web-ci.yml` owns branch/PR validation. `pages.yml` owns `main` build/deployment. Pages source may require the one-time repository setting **Settings → Pages → Source: GitHub Actions**.\n\n'''
          if '## D-035 — GitHub-hosted Web delivery' not in text:
              text = text.replace(marker, addition + marker)
              decisions.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          text = text.replace('### WEB-BOOT — Planned', '### WEB-BOOT — In progress')
          text = text.replace('- Chromium/Brave-first development target;\n', '- Chromium/Brave-first development target;\n- GitHub Actions as the required automated build/type-check path;\n- GitHub Pages as the normal project-owner Web test/distribution surface;\n- no local clone/Node/npm required for project-owner testing;\n')
          text = text.replace('4. `WEB-BOOT-004` — bootstrap quality gate.', '4. `WEB-BOOT-004` — GitHub-hosted CI/Pages quality gate.')
          roadmap.write_text(text)

          arch = Path('docs/FILE_ARCHITECTURE.md')
          text = arch.read_text()
          old = '├── vite.config.ts              # created by WEB-BOOT\n├── docs/'
          new = '''├── vite.config.ts              # created by WEB-BOOT\n├── .github/\n│   └── workflows/\n│       ├── web-ci.yml          # Web validation\n│       └── pages.yml           # main → GitHub Pages\n├── docs/'''
          text = text.replace(old, new)
          anchor = '## Documentation responsibilities\n'
          workflow_section = '''## GitHub workflow responsibilities\n\n### `.github/workflows/web-ci.yml`\n\nAuthoritative Web branch/PR validation. It installs from the committed lockfile, type-checks, and performs the production Vite build. It must not deploy production Pages or become a source-code mutation mechanism.\n\n### `.github/workflows/pages.yml`\n\nAuthoritative `main` → GitHub Pages build/deployment workflow. It builds the same Web application and deploys `dist/web` through GitHub Pages actions. Hosting must not weaken local-first privacy or imply a backend/upload path.\n\nTemporary bootstrap workflows are allowed only for a narrowly defined repository-establishment task and must be removed before merge.\n\n'''
          if '## GitHub workflow responsibilities' not in text:
              text = text.replace(anchor, workflow_section + anchor)
          arch.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          if '## Web delivery' not in text:
              text += '''\n\n## Web delivery\n\nDuring the Web stage, EpicScope is built and validated by GitHub Actions and deployed from `main` to GitHub Pages. The project owner should be able to test the current Web build in Brave/Chromium without cloning the repository or installing Node/npm locally. Local log analysis remains client-side unless an explicit future sharing feature is invoked.\n'''
              readme.write_text(text)

      - name: Commit authority corrections
        run: |
          if git diff --quiet; then
            echo "No authority changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DECISIONS.md docs/ROADMAP.md docs/FILE_ARCHITECTURE.md README.md
          git commit -m "Align repository with GitHub-hosted Web workflow"
          git push origin HEAD:phase1/web-boot
