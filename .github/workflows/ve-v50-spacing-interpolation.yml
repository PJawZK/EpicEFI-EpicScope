name: VE v50 spacing-aware interpolation

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry spacing-aware table interpolation reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Apply spacing-aware interpolation patch
        run: python scripts/ve-v50-spacing-interpolation-patch.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-spacing-interpolation.yml scripts/ve-v50-spacing-interpolation-patch.py
          git add apps/web/src/pages/ve-table-interaction.ts apps/web/src/pages/ve-analyzer-delay-table-interaction.ts tests/ve-table-interaction.test.ts
          git commit -m "Use physical table axes for monotone interpolation [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
