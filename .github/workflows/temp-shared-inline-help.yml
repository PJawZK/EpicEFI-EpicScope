name: Temporary shared inline help
on:
  push:
    branches:
      - refactor/shared-inline-help
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-inline-help
          fetch-depth: 0
      - name: Migrate Idle help to shared utility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/idle-analyzer-help.ts')
          t = p.read_text()
          old = "interface HelpEntry {\n  readonly title: string;\n  readonly text: string;\n}\n\n"
          new = "import { addInlineHelpButton, createInlineHelpPresenter, matchingInlineHelp, type InlineHelpEntry } from '../components/inline-help';\n\n"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          t = t.replace('HelpEntry', 'InlineHelpEntry')
          start = t.index("const STYLE_ID = 'idle-analyzer-inline-help-style';")
          end = t.index('export function ensureIdleAnalyzerHelp')
          replacement = "const ROOTS = new WeakSet<HTMLElement>();\nconst LAYOUT_STYLE_ID = 'idle-analyzer-inline-help-layout';\n\nfunction ensureIdleHelpLayoutStyle(): void {\n  if (document.getElementById(LAYOUT_STYLE_ID)) return;\n  const style = document.createElement('style');\n  style.id = LAYOUT_STYLE_ID;\n  style.textContent = `\n    .specialized-analyzer-summary > div { position:relative; }\n    .specialized-analyzer-summary > div > .epicscope-inline-help { position:absolute; top:5px; right:5px; }\n    .specialized-analyzer-controls label > span, .specialized-analyzer-options-grid label > span { display:inline-flex; align-items:center; }\n  `;\n  document.head.append(style);\n}\n\n"
          t = t[:start] + replacement + t[end:]
          t = t.replace('  ensureStyle();', '  ensureIdleHelpLayoutStyle();')
          old_show = "  const show = (help: InlineHelpEntry): void => {\n    guidance.hidden = false;\n    guidanceTitle.textContent = help.title;\n    guidanceText.textContent = help.text;\n    guidance.scrollIntoView({ block: 'nearest' });\n  };"
          assert t.count(old_show) == 1
          t = t.replace(old_show, "  const show = createInlineHelpPresenter(guidance, guidanceTitle, guidanceText);", 1)
          t = t.replace('matchingHelp(', 'matchingInlineHelp(')
          t = t.replace('addButton(', 'addInlineHelpButton(')
          p.write_text(t)

          p = Path('apps/web/src/styles/ui-refinements.css')
          t = p.read_text()
          assert '.idle-analyzer-info {' in t
          t = t.replace('.idle-analyzer-info {', '.epicscope-inline-help {')
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/idle-analyzer-help.ts apps/web/src/styles/ui-refinements.css
          git commit -m "Use shared inline help utilities"
          git push origin HEAD:refactor/shared-inline-help
