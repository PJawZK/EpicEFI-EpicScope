name: VE v50 responsive table selection

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage responsive table-selection fixture fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Select a real VE table before responsive geometry checks
        run: python scripts/ve-v50-responsive-table-selection-patch.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-responsive-table-selection.yml scripts/ve-v50-responsive-table-selection-patch.py
          git add scripts/browser/acceptance.mjs
          git commit -m "Select VE table before responsive acceptance [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
