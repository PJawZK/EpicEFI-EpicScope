name: Temp predecode patch

on:
  push:
    branches:
      - perf/opportunistic-predecode-experiment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/opportunistic-predecode-experiment
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: python tools/temp-predecode-patch.py
      - run: rm tools/temp-predecode-patch.py .github/workflows/temp-predecode-patch.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: add opportunistic predecode benchmark control"
          git push origin HEAD:perf/opportunistic-predecode-experiment
