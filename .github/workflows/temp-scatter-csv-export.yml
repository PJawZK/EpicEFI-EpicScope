name: Temporary Scatter CSV export validation
on:
  push:
    branches: [feat/scatter-csv-export]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/temp_scatter_csv_export.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit product changes
        run: |
          rm .github/workflows/temp-scatter-csv-export.yml .github/scripts/temp_scatter_csv_export.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'finish Scatter maturity with CSV evidence export'
          git push
