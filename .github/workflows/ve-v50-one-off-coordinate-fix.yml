name: VE v50 one-off coordinate fix

on:
  push:
    branches:
      - ui/ve-analyzer-v50-port

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-off VE v50 coordinate patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-port
      - name: Preserve semantic table coordinates after visual row reversal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ve-table-interaction-dom.ts')
          text = path.read_text()
          old = """      const cell = tr.cells[cellIndex] as HTMLTableCellElement;\n      cell.dataset.tableRow = String(row);\n      cell.dataset.tableCol = String(cellIndex - 1);\n"""
          new = """      const cell = tr.cells[cellIndex] as HTMLTableCellElement;\n      const semanticRow = Number(cell.dataset.delayRow);\n      const semanticCol = Number(cell.dataset.delayCol);\n      cell.dataset.tableRow = Number.isInteger(semanticRow) ? String(semanticRow) : String(row);\n      cell.dataset.tableCol = Number.isInteger(semanticCol) ? String(semanticCol) : String(cellIndex - 1);\n"""
          if old not in text:
              raise SystemExit('expected coordinate block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ve-table-interaction-dom.ts
          git commit -m "Respect semantic coordinates in shared table interaction [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-port
