name: VE v50 Analyzer lifecycle cleanup

on:
  push:
    branches:
      - ui/ve-analyzer-v50-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage Analyzer remount lifecycle cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/ve-analyzer-v50-reconcile
      - name: Deactivate Analyzer before application shell disposal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/app-shell.ts')
          text = path.read_text()
          anchor = """    document.removeEventListener('pointerdown', onTransientPointerDown, true);\n    loggerPage.disposeSourceIntegrity();\n"""
          replacement = """    document.removeEventListener('pointerdown', onTransientPointerDown, true);\n    // Domain controllers can own observers/gesture state while active. Deactivate\n    // Analyzer before the shell DOM is replaced so those owners release detached\n    // view resources rather than waiting for a future navigation event.\n    analyzerPage.setActive(false);\n    loggerPage.disposeSourceIntegrity();\n"""
          if anchor not in text:
              raise SystemExit('app-shell dispose anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ve-v50-lifecycle-dispose.yml
          git add apps/web/src/app/app-shell.ts
          git commit -m "Deactivate Analyzer on shell disposal [skip ci]"
          git push origin HEAD:ui/ve-analyzer-v50-reconcile
