name: Temporary Electrical and Driveline starter transform v2
on:
  push:
    branches: [feat/electrical-driveline-starters-v2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded starter transform
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/state/semantic-channel-roles.ts')
          s = p.read_text()
          old = "  | 'startup.warmupCorrection'\n  | 'startup.engineCycles';"
          new = """  | 'startup.warmupCorrection'\n  | 'startup.engineCycles'\n  | 'electrical.sensorSupplyVoltage'\n  | 'electrical.sensorSupplyFault'\n  | 'electrical.alternatorDuty'\n  | 'vehicle.gear'\n  | 'vehicle.clutchState'\n  | 'vehicle.brakeState'\n  | 'vehicle.wheelSpeedFrontLeft'\n  | 'vehicle.wheelSpeedFrontRight'\n  | 'vehicle.wheelSpeedRearLeft'\n  | 'vehicle.wheelSpeedRearRight'\n  | 'vehicle.longitudinalAcceleration';"""
          assert old in s, 'semantic role union anchor missing'
          s = s.replace(old, new, 1)
          anchor = """  'startup.engineCycles': { id: 'startup.engineCycles', displayName: 'Engine Cycles Since Start', aliases: ['revolutionCounterSinceStart', 'Engine Cycle Count', 'Engine Cycles Since Start'], include: [/(?:engine.*cycle|revolution).*since.*start/i, /engine.*cycle.*count/i], exclude: [/table/i, /bin/i, /target/i] },\n};"""
          addition = """  'startup.engineCycles': { id: 'startup.engineCycles', displayName: 'Engine Cycles Since Start', aliases: ['revolutionCounterSinceStart', 'Engine Cycle Count', 'Engine Cycles Since Start'], include: [/(?:engine.*cycle|revolution).*since.*start/i, /engine.*cycle.*count/i], exclude: [/table/i, /bin/i, /target/i] },\n  'electrical.sensorSupplyVoltage': { id: 'electrical.sensorSupplyVoltage', displayName: 'Sensor Supply Voltage', aliases: ['rawSst1Volts', 'Sensor Supply Voltage', 'Sensor Supply 1', '5V Reference', 'Sensor 5V'], include: [/(?:sensor.*supply|5v.*reference|reference.*5v).*volt/i, /sensor.*supply/i], exclude: [/fault/i, /threshold/i, /minimum/i, /maximum/i, /config/i, /adc.*channel/i] },\n  'electrical.sensorSupplyFault': { id: 'electrical.sensorSupplyFault', displayName: 'Sensor Supply Fault', aliases: ['sst1Fault', 'Sensor Supply Fault', 'SST1: Fault', '5V Reference Fault'], include: [/(?:sensor.*supply|sst|5v.*reference).*fault/i], exclude: [/threshold/i, /config/i] },\n  'electrical.alternatorDuty': { id: 'electrical.alternatorDuty', displayName: 'Alternator Duty', aliases: ['alternatorDutyCycle', 'Alternator Duty', 'Alternator duty cycle'], include: [/alternator.*duty(?:.*cycle)?/i], exclude: [/adder/i, /target/i, /conditioned/i, /table/i, /config/i] },\n  'vehicle.gear': { id: 'vehicle.gear', displayName: 'Gear', aliases: ['detectedGear', 'Detected Gear', 'Gear'], include: [/^(?:detected\\s*)?gear$/i, /gear.*detected/i], exclude: [/target/i, /next/i, /ratio/i, /upshift/i, /downshift/i, /table/i, /config/i] },\n  'vehicle.clutchState': { id: 'vehicle.clutchState', displayName: 'Clutch State', aliases: ['clutchDownState', 'Clutch State', 'Clutch Down', 'Clutch: down'], include: [/clutch.*(?:down|state|pedal)/i], exclude: [/up/i, /pressure/i, /target/i, /pin/i, /mode/i, /position/i] },\n  'vehicle.brakeState': { id: 'vehicle.brakeState', displayName: 'Brake State', aliases: ['brakePedalState', 'Brake State', 'Brake Pedal State', 'Brake switch'], include: [/brake.*(?:pedal|switch|state)/i], exclude: [/pressure/i, /target/i, /pin/i, /mode/i, /trans/i] },\n  'vehicle.wheelSpeedFrontLeft': { id: 'vehicle.wheelSpeedFrontLeft', displayName: 'Wheel Speed FL', aliases: ['vehicleSpeedKph1', 'Wheel Speed FL', 'Vehicle Speed Front Left'], include: [/(?:wheel|vehicle).*speed.*(?:front.*left|fl)/i], exclude: [/average/i, /reference/i, /target/i] },\n  'vehicle.wheelSpeedFrontRight': { id: 'vehicle.wheelSpeedFrontRight', displayName: 'Wheel Speed FR', aliases: ['vehicleSpeedKph2', 'Wheel Speed FR', 'Vehicle Speed Front Right'], include: [/(?:wheel|vehicle).*speed.*(?:front.*right|fr)/i], exclude: [/average/i, /reference/i, /target/i] },\n  'vehicle.wheelSpeedRearLeft': { id: 'vehicle.wheelSpeedRearLeft', displayName: 'Wheel Speed RL', aliases: ['vehicleSpeedKph3', 'Wheel Speed RL', 'Vehicle Speed Rear Left'], include: [/(?:wheel|vehicle).*speed.*(?:rear.*left|rl)/i], exclude: [/average/i, /reference/i, /target/i] },\n  'vehicle.wheelSpeedRearRight': { id: 'vehicle.wheelSpeedRearRight', displayName: 'Wheel Speed RR', aliases: ['vehicleSpeedKph4', 'Wheel Speed RR', 'Vehicle Speed Rear Right'], include: [/(?:wheel|vehicle).*speed.*(?:rear.*right|rr)/i], exclude: [/average/i, /reference/i, /target/i] },\n  'vehicle.longitudinalAcceleration': { id: 'vehicle.longitudinalAcceleration', displayName: 'Longitudinal Accel', aliases: ['accelerationLon', 'Accel: Longitudinal', 'Longitudinal Acceleration', 'Longitudinal Accel'], include: [/longitudinal.*(?:accel|acceleration)/i, /accel.*longitudinal/i], exclude: [/target/i, /limit/i] },\n};"""
          assert anchor in s, 'semantic role definition anchor missing'
          p.write_text(s.replace(anchor, addition, 1))

          p = Path('apps/web/src/state/built-in-workspace-templates.ts')
          s = p.read_text()
          anchor = """export const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n  TRANSIENT_AE_DUAL_WORKSPACE,\n  FUEL_SYSTEM_DUAL_WORKSPACE,\n  TRIGGER_SYNC_DUAL_WORKSPACE,\n  STARTUP_WARMUP_DUAL_WORKSPACE,\n]);"""
          addition = """export const ELECTRICAL_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'electrical-dual', name: 'Electrical', description: 'Dual-pane charging, electrical load and sensor-supply overview.', layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'electrical.batteryVoltage', requirement: 'required' },\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'fuel.injectorPulseWidth', requirement: 'preferred' },\n      { roleId: 'ignition.dwell', requirement: 'preferred' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'fuel.injectorDuty', requirement: 'preferred' },\n      { roleId: 'fuel.pumpCommand', requirement: 'optional' },\n      { roleId: 'electrical.alternatorDuty', requirement: 'optional' },\n      { roleId: 'electrical.sensorSupplyVoltage', requirement: 'optional' },\n      { roleId: 'electrical.sensorSupplyFault', requirement: 'optional' },\n    ] },\n  ],\n};\n\nexport const VEHICLE_DRIVELINE_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'vehicle-driveline-dual', name: 'Vehicle / Driveline', description: 'Dual-pane road speed, driver inputs and driveline-state overview.', layout: 'dual',\n  panes: [\n    { id: 'pane-1', roles: [\n      { roleId: 'engine.rpm', requirement: 'required' },\n      { roleId: 'vehicle.speed', requirement: 'required' },\n      { roleId: 'engine.throttle.position', requirement: 'preferred' },\n      { roleId: 'engine.map', requirement: 'preferred' },\n      { roleId: 'vehicle.gear', requirement: 'preferred' },\n    ] },\n    { id: 'pane-2', roles: [\n      { roleId: 'vehicle.clutchState', requirement: 'optional' },\n      { roleId: 'vehicle.brakeState', requirement: 'optional' },\n      { roleId: 'vehicle.wheelSpeedFrontLeft', requirement: 'optional' },\n      { roleId: 'vehicle.wheelSpeedFrontRight', requirement: 'optional' },\n      { roleId: 'vehicle.wheelSpeedRearLeft', requirement: 'optional' },\n      { roleId: 'vehicle.wheelSpeedRearRight', requirement: 'optional' },\n      { roleId: 'vehicle.longitudinalAcceleration', requirement: 'optional' },\n    ] },\n  ],\n};\n\nexport const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n  TRANSIENT_AE_DUAL_WORKSPACE,\n  FUEL_SYSTEM_DUAL_WORKSPACE,\n  TRIGGER_SYNC_DUAL_WORKSPACE,\n  STARTUP_WARMUP_DUAL_WORKSPACE,\n  ELECTRICAL_DUAL_WORKSPACE,\n  VEHICLE_DRIVELINE_DUAL_WORKSPACE,\n]);"""
          assert anchor in s, 'starter catalog anchor missing'
          p.write_text(s.replace(anchor, addition, 1))

          p = Path('tests/web/built-in-workspace-templates.test.ts')
          s = p.read_text()
          old = "      'Trigger / Sync', 'Startup / Warmup',\n    ]);"
          new = "      'Trigger / Sync', 'Startup / Warmup', 'Electrical', 'Vehicle / Driveline',\n    ]);"
          assert old in s, 'catalog order anchor missing'
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/web/trigger-startup-starters.test.ts')
          s = p.read_text()
          old = "it('appends both starters to the production catalog', () => expect(STARTER_WORKSPACE_TEMPLATES.slice(-2).map((t) => t.name)).toEqual(['Trigger / Sync', 'Startup / Warmup']));"
          new = "it('includes both starters in the production catalog', () => { expect(STARTER_WORKSPACE_TEMPLATES.map((t) => t.name)).toEqual(expect.arrayContaining(['Trigger / Sync', 'Startup / Warmup'])); });"
          assert old in s, 'prior starter membership anchor missing'
          p.write_text(s.replace(old, new, 1))

          test = Path('tests/web/electrical-driveline-starters.test.ts')
          assert not test.exists(), 'focused test already exists'
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport type { ChannelDefinition } from '../../core/log-model/log-types';\nimport { ELECTRICAL_DUAL_WORKSPACE, VEHICLE_DRIVELINE_DUAL_WORKSPACE, STARTER_WORKSPACE_TEMPLATES, resolveStarterWorkspaceTemplate } from '../../apps/web/src/state/built-in-workspace-templates';\nimport { resolveSemanticChannelRole } from '../../apps/web/src/state/semantic-channel-roles';\nfunction channel(id: string, sourceName = id, displayName = sourceName): ChannelDefinition { return { id, sourceName, displayName, valueType: 'number' }; }\ndescribe('Electrical and Vehicle / Driveline starters', () => {\n  it('completes the generic starter catalog', () => expect(STARTER_WORKSPACE_TEMPLATES.slice(-2).map((t) => t.name)).toEqual(['Electrical', 'Vehicle / Driveline']));\n  it('resolves Electrical onto canonical EpicEFI INI identities', () => {\n    const r = resolveStarterWorkspaceTemplate(ELECTRICAL_DUAL_WORKSPACE, [\n      channel('ini:VBatt','VBatt','Battery'), channel('ini:RPMValue','RPMValue','RPM'), channel('ini:actualLastInjection','actualLastInjection','Fuel: Last inj pulse width'), channel('ini:sparkDwell','sparkDwell','Ignition: coil charge time'), channel('ini:injectorDutyCycle','injectorDutyCycle','Fuel: injector duty cycle'), channel('ini:isFuelPumpOn','isFuelPumpOn','Fuel pump on'), channel('ini:alternatorDutyCycle','alternatorDutyCycle','Alternator duty'), channel('ini:rawSst1Volts','rawSst1Volts','Sensor supply 1'), channel('ini:sst1Fault','sst1Fault','SST1: Fault'),\n    ]);\n    expect(r.panes[0]?.channelIds).toEqual(['ini:VBatt','ini:RPMValue','ini:actualLastInjection','ini:sparkDwell']);\n    expect(r.panes[1]?.channelIds).toEqual(['ini:injectorDutyCycle','ini:isFuelPumpOn','ini:alternatorDutyCycle','ini:rawSst1Volts','ini:sst1Fault']);\n    expect(r.unresolvedRequiredRoleIds).toEqual([]);\n  });\n  it('keeps sensor-supply runtime values distinct from tracker configuration', () => {\n    const c=[channel('sst1AdcChannel','sst1AdcChannel','SST 1 input'),channel('sstValidMin','sstValidMin','SST valid min'),channel('rawSst1Volts','rawSst1Volts','Sensor supply 1')];\n    expect(resolveSemanticChannelRole('electrical.sensorSupplyVoltage',c).channel?.id).toBe('rawSst1Volts');\n  });\n  it('resolves Vehicle / Driveline onto canonical EpicEFI INI identities', () => {\n    const r = resolveStarterWorkspaceTemplate(VEHICLE_DRIVELINE_DUAL_WORKSPACE, [\n      channel('ini:RPMValue','RPMValue','RPM'), channel('ini:vehicleSpeedKph','vehicleSpeedKph','Vehicle Speed'), channel('ini:TPSValue','TPSValue','TPS'), channel('ini:MAPValue','MAPValue','MAP'), channel('ini:detectedGear','detectedGear','Detected Gear'), channel('ini:clutchDownState','clutchDownState','Clutch: down'), channel('ini:brakePedalState','brakePedalState','Brake switch'), channel('ini:vehicleSpeedKph1','vehicleSpeedKph1','Wheel speed 1 FL'), channel('ini:vehicleSpeedKph2','vehicleSpeedKph2','Wheel speed 2 FR'), channel('ini:vehicleSpeedKph3','vehicleSpeedKph3','Wheel speed 3 RL'), channel('ini:vehicleSpeedKph4','vehicleSpeedKph4','Wheel speed 4 RR'), channel('ini:accelerationLon','accelerationLon','Accel: Longitudinal'),\n    ]);\n    expect(r.panes[0]?.channelIds).toEqual(['ini:RPMValue','ini:vehicleSpeedKph','ini:TPSValue','ini:MAPValue','ini:detectedGear']);\n    expect(r.panes[1]?.channelIds).toEqual(['ini:clutchDownState','ini:brakePedalState','ini:vehicleSpeedKph1','ini:vehicleSpeedKph2','ini:vehicleSpeedKph3','ini:vehicleSpeedKph4','ini:accelerationLon']);\n    expect(r.unresolvedRequiredRoleIds).toEqual([]);\n  });\n  it('does not mistake gear targets or transmission brake pressure for generic states', () => {\n    expect(resolveSemanticChannelRole('vehicle.gear',[channel('transTargetGear','transTargetGear','Trans: target gear')]).channel).toBeUndefined();\n    expect(resolveSemanticChannelRole('vehicle.brakeState',[channel('transBrakePressure','transBrakePressure','Trans: brake pressure')]).channel).toBeUndefined();\n  });\n});\n""")

          p = Path('docs/PREPOPULATED_WORKSPACES.md')
          s = p.read_text()
          old = """- **Startup / Warmup** — Dual layout; RPM, coolant temp, intake-air temp, battery voltage, engine cycles since start, cranking fuel, after-start correction, warmup correction, Lambda and idle target.\n\nPlanned generic starter families remain:\n- **Electrical** — battery voltage, RPM, injector pulse width/duty, ignition dwell, fuel-pump state, ECU/sensor supply voltage and relevant electrical fault/status channels where available;\n- **Vehicle / Driveline** — RPM, vehicle speed, TPS, MAP, gear, clutch/brake state, wheel speeds and longitudinal acceleration where available.\n\n## EpicEFI-specific starter tier"""
          new = """- **Startup / Warmup** — Dual layout; RPM, coolant temp, intake-air temp, battery voltage, engine cycles since start, cranking fuel, after-start correction, warmup correction, Lambda and idle target;\n- **Electrical** — Dual layout; battery voltage, RPM, injector pulse width/duty, ignition dwell, fuel-pump state, alternator duty, sensor-supply voltage and sensor-supply fault where available;\n- **Vehicle / Driveline** — Dual layout; RPM, vehicle speed, TPS, MAP, gear, clutch/brake state, four wheel speeds and longitudinal acceleration where available.\n\nThe planned generic starter catalog is now complete.\n\n## EpicEFI-specific starter tier"""
          assert old in s, 'docs generic catalog anchor missing'
          p.write_text(s.replace(old, new, 1))
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/built-in-workspace-templates.test.ts tests/web/trigger-startup-starters.test.ts tests/web/electrical-driveline-starters.test.ts docs/PREPOPULATED_WORKSPACES.md
          git diff --cached --quiet && exit 1
          git commit -m "feat: add Electrical and Vehicle Driveline starters"
          git push
