name: Temporary specialized analyzer patch

on:
  push:
    branches:
      - audit/specialized-analysis-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/specialized-analysis-generation
          fetch-depth: 0

      - name: Patch specialized analyzer lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/specialized-analyzer-suite-view.ts')
          text = path.read_text()

          if 'let analysisGeneration = 0;' not in text:
              old = "  let domain: SpecializedAnalyzerDomain = 'idle';\n  const rememberedSelections = new Map<string, string>();"
              new = "  let domain: SpecializedAnalyzerDomain = 'idle';\n  let analysisGeneration = 0;\n  const rememberedSelections = new Map<string, string>();"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one domain state anchor, found {text.count(old)}')
              text = text.replace(old, new)

          if 'const generation = ++analysisGeneration;' not in text:
              old = "  const analyzeCurrent = async (): Promise<void> => {\n    const spec = SPECS[domain];"
              new = "  const analyzeCurrent = async (): Promise<void> => {\n    const generation = ++analysisGeneration;\n    const spec = SPECS[domain];"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one analyzeCurrent anchor, found {text.count(old)}')
              text = text.replace(old, new)

          guard = "    const loaded = await context.loadTraces([...selected.values()], startMs, endMs);\n    if (generation !== analysisGeneration) return;\n"
          if guard not in text:
              old = "    const loaded = await context.loadTraces([...selected.values()], startMs, endMs);\n    const byId = new Map(loaded.map((trace) => [trace.channel.id, trace]));"
              new = guard + "    const byId = new Map(loaded.map((trace) => [trace.channel.id, trace]));"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one loadTraces anchor, found {text.count(old)}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/pages/specialized-analyzer-suite-view.ts; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/specialized-analyzer-suite-view.ts
          git commit -m "Guard specialized analyzer async results"
          git push origin HEAD:audit/specialized-analysis-generation
