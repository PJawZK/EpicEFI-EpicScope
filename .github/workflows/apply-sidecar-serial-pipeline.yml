name: Apply sidecar serial pipeline

on:
  push:
    branches:
      - perf/mlg-sidecar-serial-pipeline-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mlg-sidecar-serial-pipeline-v1
      - run: python tools/apply-sidecar-serial-pipeline.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/workers/mlg-import.worker.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perf: pipeline serial validation with sidecar IO"
          git push origin HEAD:perf/mlg-sidecar-serial-pipeline-v1
