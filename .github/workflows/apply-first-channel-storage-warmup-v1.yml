name: Apply first-channel storage warmup v1

on:
  push:
    branches:
      - perf/first-channel-storage-warmup-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/first-channel-storage-warmup-v1
      - run: python tools/apply-first-channel-storage-warmup-v1.py
      - run: |
          git config user.name "EpicScope Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/adapters/persistent-channel-cache.ts apps/web/src/adapters/mlg-column-sidecar-v1.ts
          git commit -m "Perf: warm first-channel storage metadata"
          git push origin HEAD:perf/first-channel-storage-warmup-v1
