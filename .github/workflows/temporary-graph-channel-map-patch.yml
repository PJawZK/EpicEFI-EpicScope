name: Temporary graph channel map patch

on:
  push:
    branches:
      - audit/graph-channel-id-map

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/graph-channel-id-map
          fetch-depth: 0

      - name: Patch graph channel lookup map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/graph-viewport.ts')
          text = path.read_text()

          if 'const channelsById = new Map<string, ChannelDefinition>();' not in text:
              old = "export function createGraphViewport(): GraphViewportController {\n  let channels: readonly ChannelDefinition[] = [];\n  let channelData: NumericChannelDataSource | undefined;"
              new = "export function createGraphViewport(): GraphViewportController {\n  let channels: readonly ChannelDefinition[] = [];\n  const channelsById = new Map<string, ChannelDefinition>();\n  let channelData: NumericChannelDataSource | undefined;"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one channel state anchor, found {text.count(old)}')
              text = text.replace(old, new)

          setlog_guard = "    channels = nextChannels;\n    channelsById.clear();\n    for (const channel of nextChannels) {\n      if (!channelsById.has(channel.id)) channelsById.set(channel.id, channel);\n    }\n"
          if setlog_guard not in text:
              old = "    channels = nextChannels;\n    channelData = nextChannelData;"
              new = setlog_guard + "    channelData = nextChannelData;"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one setLog anchor, found {text.count(old)}')
              text = text.replace(old, new)

          find_old = "channels.find((candidate) => candidate.id === channelId)"
          find_new = "channelsById.get(channelId)"
          remaining = text.count(find_old)
          if remaining:
              if remaining != 2:
                  raise SystemExit(f'Expected exactly two channel find lookups, found {remaining}')
              text = text.replace(find_old, find_new)

          clear_guard = "    channels = [];\n    channelsById.clear();\n    channelData = undefined;"
          if clear_guard not in text:
              old = "    channels = [];\n    channelData = undefined;"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one clear anchor, found {text.count(old)}')
              text = text.replace(old, clear_guard)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/components/graph-viewport.ts; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/graph-viewport.ts
          git commit -m "Use graph channel ID map"
          git push origin HEAD:audit/graph-channel-id-map
