name: Temporary MLV bilinear histogram integration
on:
  push:
    branches:
      - histogram/mlv-bilinear-weight-v2
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: histogram/mlv-bilinear-weight-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/tmp-mlv-bilinear-v2.py
      - run: rm -f scripts/tmp-mlv-bilinear-v2.py .github/workflows/tmp-mlv-bilinear-v2.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: use bilinear MLV-style histogram hit weighting'
          git push origin HEAD:histogram/mlv-bilinear-weight-v2
