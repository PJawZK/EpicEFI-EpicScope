name: Temporary current-state documentation refresh

on:
  push:
    branches:
      - docs/current-state-2026-10-03

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-state-2026-10-03
          fetch-depth: 0
      - name: Apply documentation refresh
        run: python .github/scripts/temp_doc_refresh.py
      - name: Commit refreshed documentation and remove helpers
        shell: bash
        run: |
          rm .github/workflows/temp-doc-refresh.yml .github/scripts/temp_doc_refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/temp-doc-refresh.yml .github/scripts/temp_doc_refresh.py
          git commit -m "Docs: align current state after predecode rollback"
          git push origin HEAD:docs/current-state-2026-10-03
