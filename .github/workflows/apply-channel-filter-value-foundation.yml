name: Apply channel filter/value foundation

on:
  push:
    branches:
      - ui/channel-filter-value-foundation-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply channel filter/value foundation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/channel-filter-value-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/apply-channel-filter-value-foundation.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/panels/inspector-panel.ts apps/web/src/pages/logger-page.ts
          git commit -m "UI: verify channel filters and value formatting"
          git push
