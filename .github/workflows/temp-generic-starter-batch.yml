name: Temporary generic starter batch transform
on:
  push:
    branches: [feat/generic-starters-fuel-ignition-cooling]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded starter batch transform
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/state/semantic-channel-roles.ts')
          s = p.read_text()
          old = "  | 'boost.error'\n  | 'exhaust.emap';"
          new = """  | 'boost.error'\n  | 'exhaust.emap'\n  | 'fuel.lambdaTarget'\n  | 'fuel.injectorPulseWidth'\n  | 'fuel.injectorDuty'\n  | 'fuel.pressure'\n  | 'fuel.totalCorrection'\n  | 'ignition.dwell'\n  | 'ignition.knockLevel'\n  | 'ignition.knockRetard'\n  | 'vehicle.speed'\n  | 'temperature.oil'\n  | 'engine.oilPressure'\n  | 'cooling.fanCommand';"""
          assert old in s, 'role union anchor missing'
          s = s.replace(old, new, 1)

          anchor = """  'exhaust.emap': {\n    id: 'exhaust.emap',\n    displayName: 'EMAP',\n    aliases: ['emapKpa', 'EMAP', 'Exhaust Manifold Pressure', 'Exhaust MAP'],\n    include: [/^emap(?:\\s*kpa)?$/i, /exhaust.*(?:manifold.*)?pressure/i, /exhaust.*map/i],\n    exclude: [/raw/i, /voltage/i, /sensor.*config/i],\n  },\n};"""
          replacement = """  'exhaust.emap': {\n    id: 'exhaust.emap',\n    displayName: 'EMAP',\n    aliases: ['emapKpa', 'EMAP', 'Exhaust Manifold Pressure', 'Exhaust MAP'],\n    include: [/^emap(?:\\s*kpa)?$/i, /exhaust.*(?:manifold.*)?pressure/i, /exhaust.*map/i],\n    exclude: [/raw/i, /voltage/i, /sensor.*config/i],\n  },\n  'fuel.lambdaTarget': {\n    id: 'fuel.lambdaTarget',\n    displayName: 'Lambda Target',\n    aliases: ['targetLambda', 'Lambda Target', 'Target Lambda', 'Fuel: target lambda'],\n    include: [/target.*lambda/i, /lambda.*target/i],\n    exclude: [/error/i, /correction/i, /table/i],\n  },\n  'fuel.injectorPulseWidth': {\n    id: 'fuel.injectorPulseWidth',\n    displayName: 'Injector Pulse Width',\n    aliases: ['actualLastInjection', 'Injector Pulse Width', 'Injection Pulse Width', 'Fuel: Last inj pulse width', 'PW'],\n    include: [/actual.*injection/i, /inject(?:or|ion).*pulse.*width/i, /\\binj.*pw\\b/i],\n    exclude: [/stage\\s*2/i, /secondary/i, /target/i, /limit/i, /pre.*small/i],\n  },\n  'fuel.injectorDuty': {\n    id: 'fuel.injectorDuty',\n    displayName: 'Injector Duty',\n    aliases: ['injectorDutyCycle', 'Injector Duty', 'Injector Duty Cycle', 'Fuel: injector duty cycle'],\n    include: [/injector.*duty(?:.*cycle)?/i],\n    exclude: [/stage\\s*2/i, /secondary/i, /max/i, /limit/i, /sustained/i],\n  },\n  'fuel.pressure': {\n    id: 'fuel.pressure',\n    displayName: 'Fuel Pressure',\n    aliases: ['lowFuelPressure', 'Fuel Pressure', 'FuelPressureInjector', 'Fuel Pressure Low'],\n    include: [/^(?:low\\s*)?fuel.*pressure$/i, /fuel.*pressure/i],\n    exclude: [/raw/i, /high/i, /target/i, /minimum/i, /maximum/i, /limit/i, /correction/i, /delta/i, /sensor.*config/i],\n  },\n  'fuel.totalCorrection': {\n    id: 'fuel.totalCorrection',\n    displayName: 'Fuel Correction',\n    aliases: ['totalFuelCorrection', 'Fuel: Total correction', 'Total Fuel Correction', 'Fuel Correction'],\n    include: [/total.*fuel.*correction/i, /fuel.*total.*correction/i],\n    exclude: [/table/i, /target/i, /long.*term/i, /short.*term/i],\n  },\n  'ignition.dwell': {\n    id: 'ignition.dwell',\n    displayName: 'Dwell',\n    aliases: ['sparkDwell', 'Dwell', 'Ignition: coil charge time', 'Coil Charge Time'],\n    include: [/^spark.*dwell$/i, /^dwell$/i, /coil.*charge.*time/i],\n    exclude: [/base/i, /clamp/i, /crank/i, /multispark/i, /table/i, /duration.*angle/i],\n  },\n  'ignition.knockLevel': {\n    id: 'ignition.knockLevel',\n    displayName: 'Knock Level',\n    aliases: ['m_knockLevel', 'Knock Level', 'Knock: Current level'],\n    include: [/knock.*(?:current.*)?level/i],\n    exclude: [/threshold/i, /gain/i, /cyl/i, /retard/i],\n  },\n  'ignition.knockRetard': {\n    id: 'ignition.knockRetard',\n    displayName: 'Knock Retard',\n    aliases: ['m_knockRetard', 'Knock Retard', 'Knock: Retard'],\n    include: [/knock.*retard/i],\n    exclude: [/max/i, /table/i, /limit/i],\n  },\n  'vehicle.speed': {\n    id: 'vehicle.speed',\n    displayName: 'Vehicle Speed',\n    aliases: ['vehicleSpeedKph', 'Vehicle Speed', 'VSS', 'Road Speed', 'Speed'],\n    include: [/^vehicle.*speed(?:.*kph)?$/i, /^vss$/i, /road.*speed/i],\n    exclude: [/target/i, /limit/i, /wheel/i, /front/i, /rear/i, /trans/i],\n  },\n  'temperature.oil': {\n    id: 'temperature.oil',\n    displayName: 'Oil Temp',\n    aliases: ['oilTemp', 'Oil Temp', 'Oil Temperature'],\n    include: [/^oil.*temp(?:erature)?$/i],\n    exclude: [/raw/i, /limit/i, /maximum/i, /sensor.*config/i],\n  },\n  'engine.oilPressure': {\n    id: 'engine.oilPressure',\n    displayName: 'Oil Pressure',\n    aliases: ['oilPressure', 'Oil Pressure'],\n    include: [/^oil.*pressure$/i],\n    exclude: [/raw/i, /minimum/i, /maximum/i, /limit/i, /switch/i, /sensor.*config/i],\n  },\n  'cooling.fanCommand': {\n    id: 'cooling.fanCommand',\n    displayName: 'Fan Command',\n    aliases: ['fan1Pwm', 'fan1m_state', 'Fan Command', 'Cooling Fan Duty', 'Radiator Fan Duty', 'Fan Duty'],\n    include: [/fan.*(?:pwm|duty|command|state|on)/i],\n    exclude: [/fan\\s*2/i, /frequency/i, /min/i, /max/i, /threshold/i, /temperature/i, /button/i, /broken/i, /inhibit/i],\n  },\n};"""
          assert anchor in s, 'role definitions anchor missing'
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = Path('apps/web/src/state/built-in-workspace-templates.ts')
          s = p.read_text()
          anchor = """export const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n]);"""
          inserted = """export const FUEL_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'fuel-dual',\n  name: 'Fuel',\n  description: 'Dual-pane mixture and injector overview.',\n  layout: 'dual',\n  panes: [\n    {\n      id: 'pane-1',\n      roles: [\n        { roleId: 'engine.rpm', requirement: 'required' },\n        { roleId: 'engine.map', requirement: 'required' },\n        { roleId: 'fuel.lambda', requirement: 'preferred' },\n        { roleId: 'fuel.lambdaTarget', requirement: 'preferred' },\n      ],\n    },\n    {\n      id: 'pane-2',\n      roles: [\n        { roleId: 'fuel.injectorPulseWidth', requirement: 'preferred' },\n        { roleId: 'fuel.injectorDuty', requirement: 'preferred' },\n        { roleId: 'fuel.pressure', requirement: 'optional' },\n        { roleId: 'fuel.totalCorrection', requirement: 'optional' },\n      ],\n    },\n  ],\n};\n\nexport const IGNITION_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'ignition-dual',\n  name: 'Ignition',\n  description: 'Dual-pane spark timing and knock overview.',\n  layout: 'dual',\n  panes: [\n    {\n      id: 'pane-1',\n      roles: [\n        { roleId: 'engine.rpm', requirement: 'required' },\n        { roleId: 'engine.map', requirement: 'required' },\n        { roleId: 'ignition.advance', requirement: 'preferred' },\n        { roleId: 'ignition.knockRetard', requirement: 'optional' },\n      ],\n    },\n    {\n      id: 'pane-2',\n      roles: [\n        { roleId: 'ignition.dwell', requirement: 'preferred' },\n        { roleId: 'ignition.knockLevel', requirement: 'optional' },\n        { roleId: 'fuel.lambda', requirement: 'optional' },\n        { roleId: 'temperature.intakeAir', requirement: 'optional' },\n      ],\n    },\n  ],\n};\n\nexport const COOLING_DUAL_WORKSPACE: StarterWorkspaceTemplate = {\n  id: 'cooling-dual',\n  name: 'Cooling',\n  description: 'Dual-pane thermal state and cooling-system overview.',\n  layout: 'dual',\n  panes: [\n    {\n      id: 'pane-1',\n      roles: [\n        { roleId: 'temperature.coolant', requirement: 'required' },\n        { roleId: 'temperature.intakeAir', requirement: 'preferred' },\n        { roleId: 'engine.rpm', requirement: 'preferred' },\n        { roleId: 'vehicle.speed', requirement: 'optional' },\n      ],\n    },\n    {\n      id: 'pane-2',\n      roles: [\n        { roleId: 'cooling.fanCommand', requirement: 'optional' },\n        { roleId: 'temperature.oil', requirement: 'optional' },\n        { roleId: 'engine.oilPressure', requirement: 'optional' },\n        { roleId: 'electrical.batteryVoltage', requirement: 'optional' },\n      ],\n    },\n  ],\n};\n\nexport const STARTER_WORKSPACE_TEMPLATES: readonly StarterWorkspaceTemplate[] = Object.freeze([\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  BOOST_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n]);"""
          assert anchor in s, 'starter catalog anchor missing'
          s = s.replace(anchor, inserted, 1)
          p.write_text(s)

          p = Path('tests/web/semantic-channel-roles.test.ts')
          s = p.read_text()
          anchor = """  it('keeps generic idle roles separate from DC valve target/feedback detail', () => {"""
          tests = """  it('resolves generic fuel roles to measured EpicEFI runtime channels', () => {\n    const channels = [\n      channel('lambdaValue', 'lambdaValue', 'Lambda'),\n      channel('targetLambda', 'targetLambda', 'Fuel: target lambda'),\n      channel('actualLastInjection', 'actualLastInjection', 'Fuel: Last inj pulse width'),\n      channel('actualLastInjectionStage2', 'actualLastInjectionStage2', 'Fuel: Last inj pulse width stg 2'),\n      channel('injectorDutyCycle', 'injectorDutyCycle', 'Fuel: injector duty cycle'),\n      channel('maxInjectorDutyInstant', 'maxInjectorDutyInstant', 'Max injector duty'),\n      channel('lowFuelPressure', 'lowFuelPressure', 'Fuel pressure'),\n      channel('rawLowFuelPressure', 'rawLowFuelPressure', 'Raw Fuel Pressure'),\n      channel('totalFuelCorrection', 'totalFuelCorrection', 'Fuel: Total correction'),\n    ];\n\n    expect(resolveSemanticChannelRole('fuel.lambdaTarget', channels).channel?.id).toBe('targetLambda');\n    expect(resolveSemanticChannelRole('fuel.injectorPulseWidth', channels).channel?.id).toBe('actualLastInjection');\n    expect(resolveSemanticChannelRole('fuel.injectorDuty', channels).channel?.id).toBe('injectorDutyCycle');\n    expect(resolveSemanticChannelRole('fuel.pressure', channels).channel?.id).toBe('lowFuelPressure');\n    expect(resolveSemanticChannelRole('fuel.totalCorrection', channels).channel?.id).toBe('totalFuelCorrection');\n  });\n\n  it('resolves ignition and cooling context without consuming configuration/raw channels', () => {\n    const channels = [\n      channel('sparkDwell', 'sparkDwell', 'Ignition: coil charge time'),\n      channel('baseDwell', 'baseDwell', 'Ignition: base dwell'),\n      channel('m_knockLevel', 'm_knockLevel', 'Knock: Current level'),\n      channel('m_knockRetard', 'm_knockRetard', 'Knock retard'),\n      channel('vehicleSpeedKph', 'vehicleSpeedKph', 'Vehicle speed'),\n      channel('oilTemp', 'oilTemp', 'Oil Temp'),\n      channel('rawOilTemperature', 'rawOilTemperature', 'Raw Oil Temperature'),\n      channel('oilPressure', 'oilPressure', 'Oil Pressure'),\n      channel('rawOilPressure', 'rawOilPressure', 'Raw Oil Pressure'),\n      channel('fan1Pwm', 'fan1Pwm', 'fan1Pwm'),\n      channel('fan1PwmFrequency', 'fan1PwmFrequency', 'Fan 1 PWM frequency'),\n    ];\n\n    expect(resolveSemanticChannelRole('ignition.dwell', channels).channel?.id).toBe('sparkDwell');\n    expect(resolveSemanticChannelRole('ignition.knockLevel', channels).channel?.id).toBe('m_knockLevel');\n    expect(resolveSemanticChannelRole('ignition.knockRetard', channels).channel?.id).toBe('m_knockRetard');\n    expect(resolveSemanticChannelRole('vehicle.speed', channels).channel?.id).toBe('vehicleSpeedKph');\n    expect(resolveSemanticChannelRole('temperature.oil', channels).channel?.id).toBe('oilTemp');\n    expect(resolveSemanticChannelRole('engine.oilPressure', channels).channel?.id).toBe('oilPressure');\n    expect(resolveSemanticChannelRole('cooling.fanCommand', channels).channel?.id).toBe('fan1Pwm');\n  });\n\n""" + anchor
          assert anchor in s, 'semantic test anchor missing'
          s = s.replace(anchor, tests, 1)
          p.write_text(s)

          p = Path('tests/web/built-in-workspace-templates.test.ts')
          s = p.read_text()
          old = """  BOOST_DUAL_WORKSPACE,\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,"""
          new = """  BOOST_DUAL_WORKSPACE,\n  COOLING_DUAL_WORKSPACE,\n  FUEL_DUAL_WORKSPACE,\n  GENERAL_SINGLE_WORKSPACE,\n  IDLE_DUAL_WORKSPACE,\n  IGNITION_DUAL_WORKSPACE,"""
          assert old in s, 'test import anchor missing'
          s = s.replace(old, new, 1)
          old = """  it('exposes General, Idle and Boost through the production starter catalog', () => {\n    expect(STARTER_WORKSPACE_TEMPLATES.map((template) => template.name)).toEqual(['General', 'Idle', 'Boost']);\n    expect(starterWorkspaceTemplate(BOOST_DUAL_WORKSPACE.id)).toBe(BOOST_DUAL_WORKSPACE);\n    expect(starterWorkspaceTemplate(GENERAL_SINGLE_WORKSPACE.id)).toBe(GENERAL_SINGLE_WORKSPACE);\n    expect(starterWorkspaceTemplate(IDLE_DUAL_WORKSPACE.id)).toBe(IDLE_DUAL_WORKSPACE);"""
          new = """  it('exposes the production starter catalog in deliberate menu order', () => {\n    expect(STARTER_WORKSPACE_TEMPLATES.map((template) => template.name)).toEqual([\n      'General', 'Idle', 'Boost', 'Fuel', 'Ignition', 'Cooling',\n    ]);\n    expect(starterWorkspaceTemplate(BOOST_DUAL_WORKSPACE.id)).toBe(BOOST_DUAL_WORKSPACE);\n    expect(starterWorkspaceTemplate(COOLING_DUAL_WORKSPACE.id)).toBe(COOLING_DUAL_WORKSPACE);\n    expect(starterWorkspaceTemplate(FUEL_DUAL_WORKSPACE.id)).toBe(FUEL_DUAL_WORKSPACE);\n    expect(starterWorkspaceTemplate(GENERAL_SINGLE_WORKSPACE.id)).toBe(GENERAL_SINGLE_WORKSPACE);\n    expect(starterWorkspaceTemplate(IDLE_DUAL_WORKSPACE.id)).toBe(IDLE_DUAL_WORKSPACE);\n    expect(starterWorkspaceTemplate(IGNITION_DUAL_WORKSPACE.id)).toBe(IGNITION_DUAL_WORKSPACE);"""
          assert old in s, 'catalog test anchor missing'
          s = s.replace(old, new, 1)
          anchor = """  it('resolves General onto EpicEFI live Shim channel IDs', () => {"""
          tests = """  it('resolves Fuel onto canonical EpicEFI INI identities', () => {\n    const result = resolveStarterWorkspaceTemplate(FUEL_DUAL_WORKSPACE, [\n      channel('ini:RPMValue', 'RPMValue', 'RPM'),\n      channel('ini:MAPValue', 'MAPValue', 'MAP'),\n      channel('ini:lambdaValue', 'lambdaValue', 'Lambda'),\n      channel('ini:targetLambda', 'targetLambda', 'Fuel: target lambda'),\n      channel('ini:actualLastInjection', 'actualLastInjection', 'Fuel: Last inj pulse width'),\n      channel('ini:injectorDutyCycle', 'injectorDutyCycle', 'Fuel: injector duty cycle'),\n      channel('ini:lowFuelPressure', 'lowFuelPressure', 'Fuel pressure'),\n      channel('ini:totalFuelCorrection', 'totalFuelCorrection', 'Fuel: Total correction'),\n    ]);\n    expect(result.panes[0]?.channelIds).toEqual([\n      'ini:RPMValue', 'ini:MAPValue', 'ini:lambdaValue', 'ini:targetLambda',\n    ]);\n    expect(result.panes[1]?.channelIds).toEqual([\n      'ini:actualLastInjection', 'ini:injectorDutyCycle', 'ini:lowFuelPressure', 'ini:totalFuelCorrection',\n    ]);\n  });\n\n  it('resolves Ignition onto canonical EpicEFI INI identities', () => {\n    const result = resolveStarterWorkspaceTemplate(IGNITION_DUAL_WORKSPACE, [\n      channel('ini:RPMValue', 'RPMValue', 'RPM'),\n      channel('ini:MAPValue', 'MAPValue', 'MAP'),\n      channel('ini:correctedIgnitionAdvance', 'correctedIgnitionAdvance', 'Timing: ignition'),\n      channel('ini:m_knockRetard', 'm_knockRetard', 'Knock retard'),\n      channel('ini:sparkDwell', 'sparkDwell', 'Ignition: coil charge time'),\n      channel('ini:m_knockLevel', 'm_knockLevel', 'Knock: Current level'),\n      channel('ini:lambdaValue', 'lambdaValue', 'Lambda'),\n      channel('ini:intake', 'intake', 'Intake air temp'),\n    ]);\n    expect(result.panes[0]?.channelIds).toEqual([\n      'ini:RPMValue', 'ini:MAPValue', 'ini:correctedIgnitionAdvance', 'ini:m_knockRetard',\n    ]);\n    expect(result.panes[1]?.channelIds).toEqual([\n      'ini:sparkDwell', 'ini:m_knockLevel', 'ini:lambdaValue', 'ini:intake',\n    ]);\n  });\n\n  it('resolves Cooling onto canonical EpicEFI INI identities', () => {\n    const result = resolveStarterWorkspaceTemplate(COOLING_DUAL_WORKSPACE, [\n      channel('ini:coolant', 'coolant', 'Coolant temp'),\n      channel('ini:intake', 'intake', 'Intake air temp'),\n      channel('ini:RPMValue', 'RPMValue', 'RPM'),\n      channel('ini:vehicleSpeedKph', 'vehicleSpeedKph', 'Vehicle speed'),\n      channel('ini:fan1Pwm', 'fan1Pwm', 'fan1Pwm'),\n      channel('ini:oilTemp', 'oilTemp', 'Oil Temp'),\n      channel('ini:oilPressure', 'oilPressure', 'Oil Pressure'),\n      channel('ini:VBatt', 'VBatt', 'Battery'),\n    ]);\n    expect(result.panes[0]?.channelIds).toEqual([\n      'ini:coolant', 'ini:intake', 'ini:RPMValue', 'ini:vehicleSpeedKph',\n    ]);\n    expect(result.panes[1]?.channelIds).toEqual([\n      'ini:fan1Pwm', 'ini:oilTemp', 'ini:oilPressure', 'ini:VBatt',\n    ]);\n  });\n\n""" + anchor
          assert anchor in s, 'starter resolution test anchor missing'
          s = s.replace(anchor, tests, 1)
          p.write_text(s)

          # Guard the resulting intended catalog/roles before validation.
          assert "name: 'Fuel'" in Path('apps/web/src/state/built-in-workspace-templates.ts').read_text()
          assert "name: 'Ignition'" in Path('apps/web/src/state/built-in-workspace-templates.ts').read_text()
          assert "name: 'Cooling'" in Path('apps/web/src/state/built-in-workspace-templates.ts').read_text()
          assert "'fuel.injectorPulseWidth'" in Path('apps/web/src/state/semantic-channel-roles.ts').read_text()
          assert "'cooling.fanCommand'" in Path('apps/web/src/state/semantic-channel-roles.ts').read_text()
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/state/semantic-channel-roles.ts apps/web/src/state/built-in-workspace-templates.ts tests/web/semantic-channel-roles.test.ts tests/web/built-in-workspace-templates.test.ts
          git commit -m 'feat: add Fuel Ignition and Cooling starters'
          git push